<!DOCTYPE html>
<!-- Wardrobe app self-test harness (2026-07-18). NOT shipped — lives in
     migration/ like all tooling. Run it with the local preview server:
         http://localhost:4173/migration/selftest.html
     It loads the real app in an iframe (login screen is fine — these are
     pure-helper tests over mock state) and asserts the derivation logic that
     the app's correctness hangs on. Add a test here whenever a session's
     ad-hoc console verification proves something worth keeping true. -->
<html>
<head>
<meta charset="utf-8">
<title>Wardrobe self-test</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 24px; max-width: 720px; }
  h1 { font-size: 18px; }
  .pass { color: #2f9e5e; }
  .fail { color: #c0392b; font-weight: 700; }
  #summary { font-size: 16px; font-weight: 700; margin: 12px 0; }
  li { margin: 2px 0; }
  /* Off-screen rather than display:none. A display:none subtree has NO layout,
     so every getBoundingClientRect() inside it returns 0 and any layout
     assertion silently "passes" on zeros (2026-07-26). Parked off-screen at a
     realistic phone width, the app lays out normally and stays invisible. */
  iframe { position: absolute; left: -10000px; top: 0; width: 390px; height: 844px; border: 0; }
</style>
</head>
<body>
<h1>Wardrobe self-test</h1>
<div id="summary">Loading app…</div>
<ul id="results"></ul>
<iframe id="app"></iframe>
<script>
const results = [];
function t(name, fn) {
  try {
    const r = fn();
    if (r === true) results.push({ name, ok: true });
    else results.push({ name, ok: false, msg: JSON.stringify(r) });
  } catch (e) {
    results.push({ name, ok: false, msg: e.message });
  }
}
function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b) ? true : `${JSON.stringify(a)} ≠ ${JSON.stringify(b)}`; }
// Async variant of t(). Returns the promise so run() can await them all before
// rendering — an async assertion that lands after the summary is drawn would be
// silently dropped, which is the "test that can't fail" trap all over again.
const pending = [];
function ta(name, fn) {
  const p = (async () => {
    try {
      const r = await fn();
      results.push(r === true ? { name, ok: true } : { name, ok: false, msg: JSON.stringify(r) });
    } catch (e) { results.push({ name, ok: false, msg: e.message }); }
  })();
  pending.push(p);
  return p;
}

// The iframe src is set here, with a cache-bust, rather than in the markup:
// the preview server's browser caches index.html hard, and a fixed
// "?selftest=1" would let a green run be scored against a stale copy of the
// app. A gate that can pass on last deploy's code is worse than no gate.
//
// Since the 2026-07-25 split, busting index.html is NOT enough — it is 278
// lines of markup pointing at 21 sub-resources whose "?v=" only changes on
// deploy. Every edit made WITHOUT a version bump — i.e. every edit during a
// working session — keeps the same URL, so the iframe replays the cached copy
// and the suite scores code that is not on disk.
//
// ⚠️ Re-fetching each module with cache:"reload" does NOT fix this (it was the
// fix from 2026-07-25 and it is not sufficient — measured 2026-07-26: with a
// freshly edited js/14-calendar.js on disk and on the wire, the iframe still
// executed the previous copy). The iframe navigation does not necessarily
// consult the same cache entry the fetch refreshed.
//
// So don't rely on cache semantics at all: rewrite the markup to carry a
// per-run token on every js/ and css/ URL, and hand that to the iframe via
// srcdoc. A URL nothing has ever requested cannot be served from cache.
// srcdoc needs <base href="/"> — relative URLs would otherwise resolve against
// /migration/, and the app would silently load nothing.
const frameEl = document.getElementById("app");
frameEl.addEventListener("load", () => setTimeout(run, 300));

(async () => {
  const token = Date.now();
  try {
    const html = await (await fetch(`/index.html?_=${token}`, { cache: "reload" })).text();
    const srcs = [...html.matchAll(/(?:src|href)="((?:js|css)\/[^"]+)"/g)].map(m => m[1]);
    if (!srcs.length) throw new Error("no js/ or css/ tags found in index.html");
    // Keep the text so source-level invariants (icon vocabulary, banned
    // patterns) can be asserted synchronously inside run().
    // ⚠️ LEADING SLASH. This harness lives at /migration/selftest.html, so a
    // relative "js/01-config.js" resolves to /migration/js/01-config.js — a 404.
    // That is what the 2026-07-25 "re-fetch with cache:reload" fix actually did:
    // 21 silent 404s, refreshing nothing, which is why stale modules survived it
    // (found 2026-07-26). fetch() does not throw on 404, so it looked fine.
    window.__src = {};
    await Promise.all(srcs.map(async s => {
      const r = await fetch(`/${s}${s.includes("?") ? "&" : "?"}_=${token}`, { cache: "reload" });
      if (!r.ok) throw new Error(`${s} → HTTP ${r.status}`);
      window.__src[s.split("?")[0]] = await r.text();
    }));
    const busted = html
      .replace(/<head(\s[^>]*)?>/i, m => `${m}<base href="/">`)
      .replace(/((?:src|href)=")((?:js|css)\/[^"]+)(")/g,
               (m, a, u, b) => `${a}${u}${u.includes("?") ? "&" : "?"}_=${token}${b}`);
    if (!/<base href="\/">/.test(busted)) throw new Error("could not inject <base> — index.html has no <head>");
    frameEl.srcdoc = busted;
  } catch (e) {
    // Don't fail silently into a stale run — a fresh iframe is the whole point.
    document.getElementById("summary").textContent = `FAIL: could not refresh app sources — ${e.message}`;
  }
})();

async function run() {
  const frame = document.getElementById("app");
  // The app's globals are top-level const/let — lexical bindings, NOT
  // contentWindow properties. Inject a classic script (shares the page's
  // global lexical scope) exposing an eval bridge, wrapped in a Proxy so
  // tests can read/write app globals naturally as W.name.
  const doc = frame.contentDocument;
  const bridge = doc.createElement("script");
  bridge.textContent = `window.__app = new Proxy({}, {
    get(_, k) { if (k === "__isBridge") return true; try { return eval(k); } catch { return undefined; } },
    set(_, k, v) { window.__tmpv = v; try { eval(k + " = window.__tmpv"); } catch (e) { console.error(e); } return true; },
  });`;
  doc.body.appendChild(bridge);
  const W = frame.contentWindow.__app;
  if (!W || typeof W.todayStr !== "function") {
    document.getElementById("summary").textContent = "FAIL: app script did not parse (todayStr missing)";
    return;
  }
  const today = W.todayStr();
  const D = (n) => W.shiftDate(today, n);

  // ---- freshness (the gate's own gate) ----
  // Everything below is worthless if the iframe is executing a cached copy of
  // the app instead of what's on disk — that is not hypothetical, it happened
  // on 2026-07-26 and silently passed 129 cases against a stale module.
  // Function.prototype.toString() returns exact source text, so a live function
  // whose body isn't a substring of the freshly-fetched file proves the two
  // have diverged. Checks a handful per module, which is enough: staleness is
  // per-file, never per-function.
  t("the iframe is running the code on disk, not a cached copy", () => {
    const src = window.__src || {};
    const stale = [];
    for (const path of Object.keys(src).filter(p => p.endsWith(".js"))) {
      const names = [...src[path].matchAll(/^(?:async )?function (\w+)\s*\(/gm)]
        .map(m => m[1]).slice(0, 5);
      for (const n of names) {
        const fn = W[n];
        if (typeof fn !== "function") { stale.push(`${path}:${n} missing`); break; }
        if (!src[path].includes(fn.toString())) { stale.push(`${path}:${n} differs`); break; }
      }
    }
    return !stale.length ? true : `stale modules — ${JSON.stringify(stale)}`;
  });

  // ---- version lockstep (phantom update-toast guard) ----
  t("APP_VERSION matches <meta app-version>", () =>
    eq(W.APP_VERSION, W.document.querySelector('meta[name="app-version"]').content));
  // Since the split there are 21 more places the version lives: the "?v=" on
  // every js/ and css/ tag. Miss one and GitHub Pages happily serves a fresh
  // index.html beside a stale module — a half-updated app, which is worse than
  // an un-updated one. The deploy skill rewrites them with sed; this is what
  // stops a missed one from shipping.
  t("every js/ + css/ tag is cache-busted to the current APP_VERSION", () => {
    const want = W.APP_VERSION.replace(/\s+/g, "");
    const tags = [...W.document.querySelectorAll('script[src], link[rel="stylesheet"]')]
      .map(el => el.getAttribute("src") || el.getAttribute("href"))
      .filter(u => /^(js|css)\//.test(u));
    const wrong = tags.filter(u => new URLSearchParams(u.split("?")[1] || "").get("v") !== want);
    return tags.length >= 21 && !wrong.length
      ? true : `${tags.length} tags, want v=${want}, wrong: ${JSON.stringify(wrong)}`;
  });

  // ---- icon vocabulary (2026-07-26 audit C2) ----
  // ↻ used to mean three things — "wear again" (show me looks I already own) in
  // the calendar footer, "reshuffle" (generate a new combo) in the suggester,
  // and a per-piece swap — two of which are opposites. That's a recall tax on a
  // one-tap control, so the glyph was retired outright: ✨ is now the single
  // mark for "make something new", and history actions carry a plain word. The
  // weather refresh control is an inline SVG, so nothing legitimately needs ↻.
  t("↻ is retired — ✨ is the only 'make something new' glyph", () => {
    const src = window.__src || {};
    const files = Object.keys(src).filter(p => p.endsWith(".js"));
    const guilty = files.filter(p => src[p].includes("↻"));
    return files.length >= 20 && !guilty.length
      ? true : `${files.length} modules scanned, ↻ still in: ${JSON.stringify(guilty)}`;
  });

  // ---- full-width buttons (2026-07-26 audit H0) ----
  // A <button> sizes to its CONTENT regardless of `display`, so .log-cta — the
  // app's primary action — spent months rendering as a 181px stub in a 390px
  // column, and .logged-row (also laundry / backup / planned rows) at 259px.
  // Measured on detached nodes in a fixed-width host: no app state is touched,
  // so this can't perturb the fixtures the rest of the suite builds.
  t("Home's full-width buttons actually fill their column", () => {
    const d = W.document;
    const host = d.createElement("div");
    host.style.cssText = "width:390px;position:absolute;left:-9999px;top:0";
    const mk = cls => { const b = d.createElement("button"); b.className = cls; b.textContent = "x"; host.appendChild(b); return b; };
    const cta = mk("log-cta"), row = mk("logged-row");
    d.body.appendChild(host);
    const w = [cta.getBoundingClientRect().width, row.getBoundingClientRect().width].map(Math.round);
    host.remove();
    // 390 host − 2×16px side margins
    return w.every(x => x === 358) ? true : `got ${JSON.stringify(w)}, want [358,358] in a 390px column`;
  });

  // ---- sheet registry (2026-07-26 audit M5) ----
  // uiCanRefetch() suppresses the visibility-change refetch while any sheet is
  // open. It does that from a hand-maintained id list, so a NEW sheet wrapper
  // that nobody remembers to add gets its contents yanked out from under an
  // open edit. Cheap to assert, and it catches the whole class.
  t("uiCanRefetch names every sheet wrapper in index.html", () => {
    const wrappers = [...W.document.querySelectorAll('div[id$="Sheet"]')]
      .filter(d => d.querySelector(":scope > .sheet"))
      .map(d => d.id);
    const src = W.uiCanRefetch.toString();
    const missing = wrappers.filter(id => !src.includes(`"${id}"`));
    return wrappers.length >= 9 && !missing.length
      ? true : `wrappers=${JSON.stringify(wrappers)} missing=${JSON.stringify(missing)}`;
  });

  /* ---- sheet stacking order (2026-08-13 audit) ----
     Every sheet wrapper stacks equally, so DOM ORDER decides which paints on
     top. #fieldSheet sat 5th of 9 — under a comment claiming it was last — with
     four sheets after it. Nothing was visibly broken only because the one live
     path across that boundary (the rack's "wrong formality"/"wrong season"
     answers) closes its host sheet first. This is the 2026-07-25 r19 bug that
     cost a day of "the button does nothing", pre-armed. */
  t("#fieldSheet is genuinely last among the sheet wrappers", () => {
    const wrappers = [...W.document.querySelectorAll('div[id$="Sheet"]')]
      .filter(d => d.querySelector(":scope > .sheet")).map(d => d.id);
    const i = wrappers.indexOf("fieldSheet");
    return i === wrappers.length - 1
      ? true : `fieldSheet is ${i + 1} of ${wrappers.length}: ${JSON.stringify(wrappers)}`;
  });

  /* ---- photoless pieces are suggestible (2026-08-13 audit) ----
     `i.image_path &&` in the suggester pool made a photoless piece invisible to
     every outfit engine while the rest of the app rendered it happily through
     PHOTO_PLACEHOLDER. Measured cost on a 10-piece packing list holding ONE
     photoless shoe: 12 outfits, rising to 26 once it had a photo — and the only
     dress went 0 → 2 appearances, because that shoe was the one sharing a
     formality level with it. It also narrowed the pool with no label, no count
     and no widen, which is exactly what the rack's four conditions forbid. */
  t("a photoless piece can still be suggested", () => {
    const saved = { items: W.items, wears: W.wears, outfits: W.outfits,
                    outfitLinks: W.outfitLinks, exclusions: W.exclusions,
                    ready: W.dataReady, byId: W.itemById };
    const mk = (id, cat, sub, photo) => ({ id, name: id, category: cat, subcategory: sub,
      status: "Available", image_path: photo, color_family: "Blue", formality: [3],
      season: ["Spring", "Summer", "Fall", "Winter"], tags: [], last_washed: null });
    // Only ONE shoe, and it has no photo — so every outfit must use it or none exist.
    W.items = [mk("t1", "Tops", "Tee shirts", "t1.jpg"), mk("b1", "Bottoms", "Jeans", "b1.jpg"),
               mk("s1", "Shoes", "Flats", null)];
    W.wears = []; W.outfits = []; W.outfitLinks = []; W.exclusions = []; W.dataReady = true;
    W.itemById = new W.Map(W.items.map(i => [i.id, i]));
    W.buildOutfitIndexes(); W.buildExcludeSet(); W.buildSuggestIndexes();
    try {
      const out = W.suggestOutfits(null, null, W.items, "Summer", null, null, false,
                                   null, null, { all: true, uniqueCap: 50 });
      return out.length && out.every(cb => cb.pieces.some(p => p.id === "s1"))
        ? true : `got ${out.length} combos; the photoless shoe was filtered out`;
    } finally {
      W.items = saved.items; W.wears = saved.wears; W.outfits = saved.outfits;
      W.outfitLinks = saved.outfitLinks; W.exclusions = saved.exclusions;
      W.dataReady = saved.ready; W.itemById = saved.byId;
      W.buildOutfitIndexes(); W.buildExcludeSet(); W.buildSuggestIndexes();
    }
  });

  /* Structural guard, not a behavioural one: the filter lived in seven places
     across three modules and the rack's copy explicitly "mirrors the suggester's
     pool", so putting it back in ANY of them re-breaks the others silently. */
  t("no outfit engine filters its pool on image_path", () => {
    const src = window.__src || {};
    const guarded = ["js/12-looks.js", "js/20-rack.js", "js/21-pack.js"];
    const guilty = [];
    for (const p of guarded) {
      const code = (src[p] || "")
        .replace(/\/\*[\s\S]*?\*\//g, "").replace(/(^|[^:])\/\/[^\n]*/g, "$1");
      for (const m of code.matchAll(/[\w.]*image_path\s*&&|&&\s*[\w.]*\.image_path\b/g))
        guilty.push(`${p}: ${m[0].trim()}`);
    }
    return guarded.every(p => src[p]) && !guilty.length
      ? true : `pool filter on image_path is back: ${JSON.stringify(guilty)}`;
  });

  /* ---- the Home weather offer fits the screen (2026-08-13 audit) ----
     `.btn-sec` sets width:100%, and `flex:none` (= flex 0 0 auto) takes its
     BASIS from that width — so "Not now" claimed the whole 332px row and ran
     41.6px off a 390px screen while "Look it up" was crushed to 62.6px and both
     labels wrapped to four lines. Same family as the .log-cta trap from the
     opposite direction. Detached nodes in a fixed-width host, so no app state
     is touched. */
  /* ⚠️ This case MUST lift the two buttons out of the real source. Written with
     its own hand-typed markup it passed happily while the app shipped the broken
     version — it was asserting that the string in the test had width:auto, which
     is the "test that can't fail" trap in its purest form (caught by its own
     mutation check, 2026-08-13). */
  t("the weather-offer buttons fit inside the card", () => {
    const src = (window.__src || {})["js/06-home.js"] || "";
    const row = src.match(/<div style="display:flex;gap:8px;margin-top:10px">([\s\S]*?)<\/div>/);
    const btns = row && row[1].match(/<button[^>]*id="homeWx(?:Fill|No)"[^>]*>[^<]*<\/button>/g);
    if (!btns || btns.length !== 2) return "couldn't find both homeWx buttons in js/06-home.js";
    const d = W.document;
    const host = d.createElement("div");
    // 390px screen − 2×16px card margin − 2×12px card padding = 332px inner row
    host.style.cssText = "width:332px;position:absolute;left:-9999px;top:0";
    host.innerHTML = `<div style="display:flex;gap:8px">${btns.join("")}</div>`;
    d.body.appendChild(host);
    const [a, b] = [...host.querySelectorAll("button")].map(el => el.getBoundingClientRect());
    const hostR = host.getBoundingClientRect();
    host.remove();
    return b.right <= hostR.right + 0.5 && a.width > 120
      ? true : `"Look it up" is ${Math.round(a.width)}px and "Not now" overhangs the card by ${Math.round(b.right - hostR.right)}px`;
  });

  /* ---- the trip screen's dead ends (2026-08-13 audit) ----
     First coverage of tripOutfitsHtml — the r6 rework shipped deliberately
     without cases ("this round REMOVES surface"), which left the app's entire
     packing feature untested.

     The level chips are gated on poolCoversLevel so a chip can never come back
     empty, but the "All" chip is NOT gated — so it is the only one that can, and
     the copy it landed on said "try All" while All was already selected.
     Reachable on day one of every trip: add a few tops before anything else. */
  const withTripList = (subs, fn) => {
    const saved = { items: W.items, caps: W.capsules, links: W.capsuleLinks,
                    wears: W.wears, outfits: W.outfits, outfitLinks: W.outfitLinks,
                    exclusions: W.exclusions, ready: W.dataReady, byId: W.itemById,
                    lvl: W._tripSuggLevel };
    W.items = subs.map(([cat, sub], n) => ({ id: "x" + n, name: sub + " " + n, category: cat,
      subcategory: sub, status: "Available", image_path: "x" + n + ".jpg", color_family: "Blue",
      formality: [3], season: ["Spring", "Summer", "Fall", "Winter"], tags: [], last_washed: null }));
    W.capsules = [{ id: "tc", name: "Trip", kind: "travel", start_date: today,
                    end_date: W.shiftDate(today, 4), locations: [], plan: {} }];
    W.capsuleLinks = W.items.map(i => ({ capsule_id: "tc", item_id: i.id, packed: false }));
    W.wears = []; W.outfits = []; W.outfitLinks = []; W.exclusions = []; W.dataReady = true;
    W.itemById = new W.Map(W.items.map(i => [i.id, i]));
    W.buildOutfitIndexes(); W.buildExcludeSet(); W.buildSuggestIndexes(); W.buildCapsuleIndexes();
    try { return fn(W.capsuleById.get("tc")); }
    finally {
      W.items = saved.items; W.capsules = saved.caps; W.capsuleLinks = saved.links;
      W.wears = saved.wears; W.outfits = saved.outfits; W.outfitLinks = saved.outfitLinks;
      W.exclusions = saved.exclusions; W.dataReady = saved.ready; W.itemById = saved.byId;
      W._tripSuggLevel = saved.lvl;
      W.buildOutfitIndexes(); W.buildExcludeSet(); W.buildSuggestIndexes(); W.buildCapsuleIndexes();
    }
  };

  t("a tops-only trip list is told what it's missing, not to 'try All'", () =>
    withTripList([["Tops", "Tee shirts"], ["Tops", "Tee shirts"], ["Tops", "Blouses"]], c => {
      W._tripSuggLevel = null;
      const html = W.tripOutfitsHtml(c);
      if (/try All/i.test(html)) return "still says 'try All' while All is the selected chip";
      // must name BOTH gaps: no shoes, and no bottom
      return /shoes/i.test(html) && /bottom/i.test(html)
        ? true : `didn't name the missing slots: ${html.replace(/<[^>]*>/g, " ").slice(0, 200)}`;
    }));

  t("on a LEVEL chip, widening back to All is still the advice", () =>
    withTripList([["Tops", "Tee shirts"], ["Bottoms", "Jeans"], ["Shoes", "Flats"]], c => {
      W._tripSuggLevel = 6;               // nothing in the list covers Dressed Up
      const html = W.tripOutfitsHtml(c);
      return /tap All|try All/i.test(html)
        ? true : `a level dead end should point back at All: ${html.replace(/<[^>]*>/g, " ").slice(0, 200)}`;
    }));

  // ---- dates ----
  t("shiftDate crosses month boundaries", () =>
    eq([W.shiftDate("2026-07-01", -3), W.shiftDate("2026-07-31", 2)], ["2026-06-28", "2026-08-02"]));

  // ---- trip phases ----
  const trip = { start_date: "2026-07-16", end_date: "2026-07-20" };
  t("tripPhase: trip / pack / null / unpack / null", () =>
    eq([W.tripPhase(trip, "2026-07-18"), W.tripPhase(trip, "2026-07-14"), W.tripPhase(trip, "2026-07-12"),
        W.tripPhase(trip, "2026-07-22"), W.tripPhase(trip, "2026-07-28")],
       ["trip", "pack", null, "unpack", null]));
  t("tripPhase: undated capsule has no phases", () => eq(W.tripPhase({ start_date: null, end_date: null }), null));
  t("tripDayNum is 1-based", () => eq(W.tripDayNum(trip, "2026-07-18"), 3));

  // ---- sort keys ----
  t("gridSortKey maps legacy 'color' → 'category'", () => {
    const gsk = W._gridSortKeys;  // real object — mutate directly, not via the proxy
    gsk.closet = "color";
    const a = W.gridSortKey("closet");
    gsk.closet = "colorfam";
    const b = W.gridSortKey("closet");
    delete gsk.closet;
    return eq([a, b, W.gridSortKey("closet")], ["category", "colorfam", "category"]);
  });
  const mockSort = [
    { name: "b-tee", category: "Tops", subcategory: "Tee shirts", color_family: "Blue" },
    { name: "g-jean", category: "Bottoms", subcategory: "Jeans", color_family: "Green" },
    { name: "b-jean", category: "Bottoms", subcategory: "Jeans", color_family: "Blue" },
  ];
  t("colorfam = true color sort (spectrum, then category)", () =>
    eq(W.sortItems(mockSort, "colorfam").map(i => i.name), ["g-jean", "b-tee", "b-jean"]));
  t("category = composite (cat > sub > color)", () =>
    eq(W.sortItems(mockSort, "category").map(i => i.name), ["b-tee", "g-jean", "b-jean"]));

  // ---- filters ----
  t("clearFilterState empties every Set + q in place", () => {
    // Sets must come from the IFRAME's realm — instanceof is realm-specific.
    const S = W.Set;
    const st = { q: "hi", brand: new S(["X"]), color: new S(["Blue"]) };
    W.clearFilterState(st);
    return eq([st.q, st.brand.size, st.color.size], ["", 0, 0]);
  });

  // ---- laundry derivation ----
  function laundrySetup() {
    W.items = [{ id: "i1", name: "Tee", category: "Tops", subcategory: "Tee shirts", status: "Available",
                 last_washed: D(-10), laundry_state: null }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.wears = [];
  }
  t("null last_washed = clean (opt-in tracking)", () => {
    laundrySetup();
    W.items[0].last_washed = null;
    W.wears = [{ item_id: "i1", worn_on: D(-1) }, { item_id: "i1", worn_on: D(-2) }];
    return eq(W.isDirty(W.items[0]), false);
  });
  t("wears since wash ≥ tolerance ⇒ dirty (tee tolerance 1)", () => {
    laundrySetup();
    W.wears = [{ item_id: "i1", worn_on: D(-2) }];
    return eq(W.isDirty(W.items[0]), true);
  });
  t("'hamper' override forces dirty with zero wears", () => {
    laundrySetup();
    W.items[0].laundry_state = "hamper";

  // ---- Round C: weekly rhythm ----

  // ---- stats back-nav + the "no lying funnel" rule ----
  // `statsNavBack` picks a return target and THEN re-renders it. Only the pick
  // is under test here, so the render is stubbed out: with no signed-in data the
  // destination pages have nothing to draw, and `renderStatsReportDetailPage`
  // legitimately bounces an empty group back to "report" — which would report a
  // green nav bug as a red one. Restored in a finally, or every later test that
  // renders goes silently blind.
  function navBackFrom(flags) {
    const saved = { sv: W.statsView, fp: W.statsFromPalette, ff: W.statsFromField, fr: W.statsFromReport };
    const realRender = W.renderStats;
    W.renderStats = () => {};
    try {
      W.statsView = "grid";
      W.statsFromReport = !!flags.report;
      W.statsFromPalette = !!flags.palette;
      W.statsFromField = !!flags.field;
      W.statsNavBack();
      return { view: W.statsView, palette: W.statsFromPalette };
    } finally {
      W.renderStats = realRender;
      W.statsView = saved.sv; W.statsFromPalette = saved.fp;
      W.statsFromField = saved.ff; W.statsFromReport = saved.fr;
    }
  }

    const g = W.buildThinSpots(null, ws).find(x => x.ctx === "Gala");

  // ---- Round D: where you were (season × weather truth) ----
  // A synthetic home climate: 20 days per season at that season's typical
  // high, so the derived bands are predictable without depending on her data.
  const bandLog = () => {
    const log = {};
    const anchor = { Winter: ["2026-01-", 25], Spring: ["2026-04-", 58],
                     Summer: ["2026-07-", 82], Fall: ["2026-10-", 55] };
    for (const [, [pre, base]] of Object.entries(anchor))
      for (let k = 1; k <= 20; k++)
        log[pre + String(k).padStart(2, "0")] = { maxT: base + (k % 5) - 2, minT: base - 15, code: 0 };
    return log;
  };
  t("seasonBands: percentiles per season, and a thin season has no opinion", () => {
    const log = bandLog();
    delete log["2026-01-20"];           // still 19 — above the floor
    const b = W.seasonBands(log);
    const thin = {}; for (let k = 1; k <= 5; k++) thin["2026-01-0" + k] = { maxT: 20, minT: 5, code: 0 };
    return eq([b.Summer.p10 <= 80, b.Summer.p90 >= 83, b.Winter.median <= 27,
               W.seasonBands(thin).Winter],
              [true, true, true, null]);
  });
  t("seasonBands ignores away days (they describe somewhere else)", () => {
    const log = bandLog();
    for (let k = 1; k <= 20; k++) log["2026-01-" + String(k).padStart(2, "0")].away = 1;
    return eq(W.seasonBands(log).Winter, null);   // every winter day now away
  });

              ["Summer", "Winter"]);

  t("effectiveSeasonOf falls back to the calendar with no usable bands", () => {

  /* ---- Round D.4: the ONE flag criterion ----
     Everything that tested the guessing layer (day anomalies, clustering, trip
     guesses, home marks, per-day culprits, the margin-based temp test) was
     deleted with the code it covered. The case count DROPS here, on purpose.
     What remains is her criterion: a piece's commonly-worn range vs the general
     range of each season it claims. Overlap with any = no flag. */
  const auditFix = (over) => {
    const log = bandLog();
    const days = [];
    for (let k = 1; k <= 8; k++) {                    // 8 July days at 82° (home summer)
      const d = `2026-07-${String(k).padStart(2, "0")}`;
      days.push(d); log[d] = { maxT: 82, minT: 68, code: 0 };
    }
    const item = Object.assign({ id: "w1", name: "Wool coat", season: ["Winter"],
      status: "Available", image_path: "" }, over || {});
    return { log, days, item, rows: days.map(d => ({ item_id: "w1", worn_on: d })) };
  };
  const flagsOf = (f, over) => W.buildSeasonWxFlags(
    Object.assign({ pool: [f.item], wearRows: f.rows, log: f.log, dismissed: {} }, over || {}));

  t("pieceCommonRange is the middle half, so one freak day can't define it", () => {
    const log = {};
    const rows = [];
    for (let k = 1; k <= 9; k++) {
      const d = `2026-07-0${k}`;
      log[d] = { maxT: k === 1 ? 20 : 80 + k, minT: 60, code: 0 };   // one 20° outlier
      rows.push({ item_id: "x", worn_on: d });
    }
    const c = W.pieceCommonRange("x", log, rows);
    return eq([c.n, c.lo >= 80, c.hi <= 90], [9, true, true]);
  });
  t("pieceCommonRange stays null under the wear floor", () => {
    const log = { "2026-07-01": { maxT: 80, minT: 60, code: 0 } };
    return eq(W.pieceCommonRange("x", log, [{ item_id: "x", worn_on: "2026-07-01" }]), null);
  });

  t("worn far hotter than every claimed season → flagged, with the fix", () => {
    const r = flagsOf(auditFix());                    // tagged Winter, worn at 82°
    return eq([r.length, r[0].dir, r[0].missing, r[0].id], [1, "hot", ["Summer"], "w1"]);
  });
  t("worn far colder than every claimed season → flagged", () => {
    const f = auditFix({ season: ["Summer"] });
    const log = f.log, days = [];
    for (let k = 1; k <= 8; k++) {                    // 8 January days at 24°
      const d = `2026-01-${String(k).padStart(2, "0")}`;
      days.push(d); log[d] = { maxT: 24, minT: 10, code: 0 };
    }
    const r = W.buildSeasonWxFlags({ pool: [f.item], wearRows: days.map(d => ({ item_id: "w1", worn_on: d })),
      log, dismissed: {} });
    return eq([r.length, r[0].dir, r[0].missing], [1, "cold", ["Winter"]]);
  });
  t("OVERLAP WITH ANY TAGGED SEASON = no flag (the unactionable-flag killer)", () => {
    // Tagged Winter AND Summer, worn hot. Summer overlaps, so there is nothing
    // to say — this is the case she reported as "nothing I can do about these".
    return eq(flagsOf(auditFix({ season: ["Winter", "Summer"] })).length, 0);
  });
  t("a piece worn at the mild end of its own season isn't flagged", () => {
    // Tagged Winter, worn on the warmer winter days. Its common range still
    // overlaps winter's general range, so no margin tuning is needed at all.

  const withGearCloset = (fn) => {

                    sugg: W._sugg, cap: W.activeCapsuleId, trip: W.tripModeId, ready: W.dataReady,

    for (let n = 0; n < 30; n++) { W.items.push(mk("tp" + n, "Tops", "Tee shirts"));
      W.items.push(mk("bt" + n, "Bottoms", "Jeans")); W.items.push(mk("sh" + n, "Shoes", "Sneakers")); }

    W.kvData.delete("rack");
    W.buildOutfitIndexes(); W.buildCapsuleIndexes(); W.buildSuggestIndexes();

      W.outfitLinks = saved.outfitLinks; W._sugg = saved.sugg; W.activeCapsuleId = saved.cap;
      W.tripModeId = saved.trip; W.dataReady = saved.ready; W.capsules = saved.caps;

  // ---- kv concurrent-write safety (2026-07-26 audit H2) ----
  // Every kv key is one JSONB blob rewritten whole, so a plain last-write-wins
  // upsert silently destroys the other device's edit. kvUpdate re-applies the
  // caller's mutation on top of the server's value when they've diverged.
  // These stub rest() so no network is touched.
  // ⚠️ These MUST be awaited one at a time (note the `await ta(...)` below):
  // they all replace the same global rest(), so running them concurrently makes
  // each one observe the others' stubs. First written without it and all three
  // failed with cross-talk (calls=4 for a two-call test).
  const withStubbedRest = async (serverValue, fn) => {
    const realRest = W.rest, realSession = W.session, realSnap = W.saveDataSnapshot;
    let posted;
    W.session = { user: { id: "u" } };
    W.saveDataSnapshot = () => {};
    W.rest = async (path, opts) => {
      if (!opts || !opts.method) return serverValue === undefined ? [] : [{ value: serverValue }];
      posted = JSON.parse(opts.body)[0].value;   // the upsert
      return null;
    };
    try { await fn(); } finally { W.rest = realRest; W.session = realSession; W.saveDataSnapshot = realSnap; }
    return posted;
  };

  await ta("kvUpdate merges a concurrent writer instead of clobbering", async () => {
    const saved = W.kvData.get("dayplan");
    W.kvData.set("dayplan", { "2026-01-01": ["mine-base"] });          // what THIS device loaded
    // meanwhile the other device added a different day and wrote it
    const server = { "2026-01-01": ["mine-base"], "2026-01-02": ["theirs"] };
    const posted = await withStubbedRest(server, () =>
      W.kvUpdate("dayplan", prev => ({ ...(prev || {}), "2026-01-03": ["mine-new"] })));
    if (saved === undefined) W.kvData.delete("dayplan"); else W.kvData.set("dayplan", saved);
    return eq(Object.keys(posted || {}).sort(), ["2026-01-01", "2026-01-02", "2026-01-03"]);
  });

  await ta("kvUpdate writes the plain value when the server matches", async () => {
    const saved = W.kvData.get("dayplan");

    W.session = { user: { id: "u" } }; W.saveDataSnapshot = () => {};
    W.rest = async (path, opts) => {

  /* ================= TRIP BUILDER / pack plan (2026-07-29 r2) =================
     Spec: TRIP_BUILDER.md. These cover the three inversions, because getting any
     of them backwards produces a plausible WRONG answer rather than a crash:
       ① outfits first — every packed piece must be in a real outfit
       ② schedule, don't divide — violations carry a date, seeded from last_washed
       ③ the solve is an event — same inputs, same pack
     Case "a 10-day trip with two dressy evenings doesn't pack one pair of shoes"
     is a GATE on decision D2, not a regression test. */
  /* Install the fixture and hand back its teardown, so the sync and async
     wrappers below share ONE setup — two copies would drift, and the closet
     these cases assert against is half the assertion. */
  const packClosetInstall = (opt = {}) => {
    const saved = { items: W.items, wears: W.wears, outfits: W.outfits, outfitLinks: W.outfitLinks,
                    caps: W.capsules, links: W.capsuleLinks, excl: W.exclusions,

    const mk = (id, cat, sub, fml, extra) => ({
      id, name: id, category: cat, subcategory: sub, status: "Available",
      image_path: id + ".jpg", color_family: (extra && extra.color) || "Blue",
      formality: fml, season: ["Spring", "Summer", "Fall", "Winter"],
      tags: (extra && extra.tags) || [],
      last_washed: (extra && extra.last_washed) || null,
      laundry_state: (extra && extra.laundry_state) || null,
    });
    W.items = [];
    const add = (...a) => { const it = mk(...a); W.items.push(it); return it; };
    // Casual + smart tops (tolerance 1 tees, 4 sweaters), bottoms, shoes across
    // two formality bands, dresses, outerwear. Generous enough that outfits form.
    for (let n = 0; n < 8; n++) add("tee" + n, "Tops", "Tee shirts", [2, 3]);
    for (let n = 0; n < 4; n++) add("blo" + n, "Tops", "Blouses", [4, 5]);
    for (let n = 0; n < 3; n++) add("swt" + n, "Tops", "Sweaters", [3, 4, 5]);
    for (let n = 0; n < 3; n++) add("jea" + n, "Bottoms", "Jeans", [2, 3, 4]);
    for (let n = 0; n < 2; n++) add("pnt" + n, "Bottoms", "Pants", [4, 5, 6]);
    for (let n = 0; n < 2; n++) add("skt" + n, "Bottoms", "Skirts", [4, 5, 6]);
    for (let n = 0; n < 3; n++) add("snk" + n, "Shoes", "Sneakers", [2, 3]);
    for (let n = 0; n < 2; n++) add("fla" + n, "Shoes", "Flats", [3, 4, 5]);
    for (let n = 0; n < 2; n++) add("hee" + n, "Shoes", "Heels", [5, 6]);
    for (let n = 0; n < 2; n++) add("drs" + n, "Dresses", "Short", [4, 5]);
    for (let n = 0; n < 2; n++) add("ckt" + n, "Dresses", "Cocktail", [5, 6]);
    for (let n = 0; n < 2; n++) add("blz" + n, "Outerwear", "Blazers", [5, 6]);
    if (opt.mutate) opt.mutate(W.items, add);
    // `replace` swaps the whole closet out, for cases that need a deliberately
    // SCARCE wardrobe (the general fixture is roomy enough that most tradeoffs
    // never bind, which silently made the tightness-dial case untestable).
    if (opt.replace) { W.items = []; opt.replace(add); }

    W.wears = [];
    // A little history so contextFormalityLevel / rackWarmth / travel stats have
    // something to read, without making any one piece dominant.
    for (let n = 0; n < 20; n++) {
      W.wears.push({ id: "pw" + n, item_id: "tee" + (n % 8), worn_on: W.shiftDate(today, -(n + 2)),
                     outfit_id: null, context: ["Errands"], formality_for: 3 });
    }
    for (let n = 0; n < 6; n++) {
      W.wears.push({ id: "pwk" + n, item_id: "blo" + (n % 4), worn_on: W.shiftDate(today, -(n * 3 + 2)),
                     outfit_id: null, context: ["Work"], formality_for: 5 });
    }
    if (opt.wears) opt.wears(W.wears);

    W.outfits = []; W.outfitLinks = [];
    W.capsules = opt.capsules || []; W.capsuleLinks = opt.capsuleLinks || [];
    W.exclusions = opt.exclusions || [];
    W.dataReady = true;
    W.kvData.delete("rack");
    if (opt.dayplan) W.kvData.set("dayplan", opt.dayplan); else W.kvData.delete("dayplan");
    W.buildOutfitIndexes(); W.buildCapsuleIndexes(); W.buildSuggestIndexes(); W.buildExcludeSet();
    return () => {
      W.items = saved.items; W.wears = saved.wears; W.outfits = saved.outfits;
      W.outfitLinks = saved.outfitLinks; W.capsules = saved.caps; W.capsuleLinks = saved.links;
      W.exclusions = saved.excl; W.dataReady = saved.ready;
      if (saved.rack === undefined) W.kvData.delete("rack"); else W.kvData.set("rack", saved.rack);
      if (saved.plan === undefined) W.kvData.delete("dayplan"); else W.kvData.set("dayplan", saved.plan);
      W.buildOutfitIndexes(); W.buildCapsuleIndexes(); W.buildSuggestIndexes(); W.buildExcludeSet();
    };

  const withPackCloset = (fn, opt = {}) => {
    const restore = packClosetInstall(opt);

  /* ⚠️ THE ASYNC TWIN, and it is not optional. withPackCloset restores in a
     `finally`, so an `async` body hands back a promise and the fixture is torn
     down before the first `await` resumes — the documented trap, and it cost a
     measurement on 2026-08-10: every candidate list came back empty because the
     app was reading her real closet by then, which looked exactly like a bug in
     the code under test. Anything that awaits an app handler (packChooseOutfit,
     packPersist) must use this one. */
  const withPackClosetA = async (fn, opt = {}) => {
    const restore = packClosetInstall(opt);
    try { return await fn(); } finally { restore(); }

  t("two dressy evenings on a 10-day trip force shoes for BOTH bands", () => withPackCloset(() => {

    // ⚠️ Asserting "≥2 pairs of shoes" is NOT enough and passed vacuously: the
