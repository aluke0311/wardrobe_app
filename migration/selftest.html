<!DOCTYPE html>
<!-- Wardrobe app self-test harness (2026-07-18). NOT shipped — lives in
     migration/ like all tooling. Run it with the local preview server:
         http://localhost:4173/migration/selftest.html
     It loads the real app in an iframe (login screen is fine — these are
     pure-helper tests over mock state) and asserts the derivation logic that
     the app's correctness hangs on. Add a test here whenever a session's
     ad-hoc console verification proves something worth keeping true. -->
<html>
<head>
<meta charset="utf-8">
<title>Wardrobe self-test</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 24px; max-width: 720px; }
  h1 { font-size: 18px; }
  .pass { color: #2f9e5e; }
  .fail { color: #c0392b; font-weight: 700; }
  #summary { font-size: 16px; font-weight: 700; margin: 12px 0; }
  li { margin: 2px 0; }
  iframe { display: none; }
</style>
</head>
<body>
<h1>Wardrobe self-test</h1>
<div id="summary">Loading app…</div>
<ul id="results"></ul>
<iframe id="app"></iframe>
<script>
const results = [];
function t(name, fn) {
  try {
    const r = fn();
    if (r === true) results.push({ name, ok: true });
    else results.push({ name, ok: false, msg: JSON.stringify(r) });
  } catch (e) {
    results.push({ name, ok: false, msg: e.message });
  }
}
function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b) ? true : `${JSON.stringify(a)} ≠ ${JSON.stringify(b)}`; }

// The iframe src is set here, with a cache-bust, rather than in the markup:
// the preview server's browser caches index.html hard, and a fixed
// "?selftest=1" would let a green run be scored against a stale copy of the
// app. A gate that can pass on last deploy's code is worse than no gate.
//
// Since the 2026-07-25 split, busting index.html is NOT enough — it is 278
// lines of markup pointing at 21 cached sub-resources, and those carry a "?v="
// that only changes on deploy, so mid-session edits to js/*.js would be
// invisible here. Re-fetch each one with cache:"reload" first, which refreshes
// the browser's HTTP cache entry; the iframe then loads the fresh copies.
const frameEl = document.getElementById("app");
frameEl.addEventListener("load", () => setTimeout(run, 300));

(async () => {
  try {
    const html = await (await fetch(`/index.html?_=${Date.now()}`, { cache: "reload" })).text();
    const srcs = [...html.matchAll(/(?:src|href)="((?:js|css)\/[^"]+)"/g)].map(m => m[1]);
    if (!srcs.length) throw new Error("no js/ or css/ tags found in index.html");
    await Promise.all(srcs.map(s => fetch(s, { cache: "reload" })));
  } catch (e) {
    // Don't fail silently into a stale run — a fresh iframe is the whole point.
    document.getElementById("summary").textContent = `FAIL: could not refresh app sources — ${e.message}`;
    return;
  }
  frameEl.src = `/index.html?selftest=1&_=${Date.now()}`;
})();

function run() {
  const frame = document.getElementById("app");
  // The app's globals are top-level const/let — lexical bindings, NOT
  // contentWindow properties. Inject a classic script (shares the page's
  // global lexical scope) exposing an eval bridge, wrapped in a Proxy so
  // tests can read/write app globals naturally as W.name.
  const doc = frame.contentDocument;
  const bridge = doc.createElement("script");
  bridge.textContent = `window.__app = new Proxy({}, {
    get(_, k) { if (k === "__isBridge") return true; try { return eval(k); } catch { return undefined; } },
    set(_, k, v) { window.__tmpv = v; try { eval(k + " = window.__tmpv"); } catch (e) { console.error(e); } return true; },
  });`;
  doc.body.appendChild(bridge);
  const W = frame.contentWindow.__app;
  if (!W || typeof W.todayStr !== "function") {
    document.getElementById("summary").textContent = "FAIL: app script did not parse (todayStr missing)";
    return;
  }
  const today = W.todayStr();
  const D = (n) => W.shiftDate(today, n);

  // ---- version lockstep (phantom update-toast guard) ----
  t("APP_VERSION matches <meta app-version>", () =>
    eq(W.APP_VERSION, W.document.querySelector('meta[name="app-version"]').content));
  // Since the split there are 21 more places the version lives: the "?v=" on
  // every js/ and css/ tag. Miss one and GitHub Pages happily serves a fresh
  // index.html beside a stale module — a half-updated app, which is worse than
  // an un-updated one. The deploy skill rewrites them with sed; this is what
  // stops a missed one from shipping.
  t("every js/ + css/ tag is cache-busted to the current APP_VERSION", () => {
    const want = W.APP_VERSION.replace(/\s+/g, "");
    const tags = [...W.document.querySelectorAll('script[src], link[rel="stylesheet"]')]
      .map(el => el.getAttribute("src") || el.getAttribute("href"))
      .filter(u => /^(js|css)\//.test(u));
    const wrong = tags.filter(u => new URLSearchParams(u.split("?")[1] || "").get("v") !== want);
    return tags.length >= 21 && !wrong.length
      ? true : `${tags.length} tags, want v=${want}, wrong: ${JSON.stringify(wrong)}`;
  });

  // ---- dates ----
  t("shiftDate crosses month boundaries", () =>
    eq([W.shiftDate("2026-07-01", -3), W.shiftDate("2026-07-31", 2)], ["2026-06-28", "2026-08-02"]));

  // ---- trip phases ----
  const trip = { start_date: "2026-07-16", end_date: "2026-07-20" };
  t("tripPhase: trip / pack / null / unpack / null", () =>
    eq([W.tripPhase(trip, "2026-07-18"), W.tripPhase(trip, "2026-07-14"), W.tripPhase(trip, "2026-07-12"),
        W.tripPhase(trip, "2026-07-22"), W.tripPhase(trip, "2026-07-28")],
       ["trip", "pack", null, "unpack", null]));
  t("tripPhase: undated capsule has no phases", () => eq(W.tripPhase({ start_date: null, end_date: null }), null));
  t("tripDayNum is 1-based", () => eq(W.tripDayNum(trip, "2026-07-18"), 3));

  // ---- sort keys ----
  t("gridSortKey maps legacy 'color' → 'category'", () => {
    const gsk = W._gridSortKeys;  // real object — mutate directly, not via the proxy
    gsk.closet = "color";
    const a = W.gridSortKey("closet");
    gsk.closet = "colorfam";
    const b = W.gridSortKey("closet");
    delete gsk.closet;
    return eq([a, b, W.gridSortKey("closet")], ["category", "colorfam", "category"]);
  });
  const mockSort = [
    { name: "b-tee", category: "Tops", subcategory: "Tee shirts", color_family: "Blue" },
    { name: "g-jean", category: "Bottoms", subcategory: "Jeans", color_family: "Green" },
    { name: "b-jean", category: "Bottoms", subcategory: "Jeans", color_family: "Blue" },
  ];
  t("colorfam = true color sort (spectrum, then category)", () =>
    eq(W.sortItems(mockSort, "colorfam").map(i => i.name), ["g-jean", "b-tee", "b-jean"]));
  t("category = composite (cat > sub > color)", () =>
    eq(W.sortItems(mockSort, "category").map(i => i.name), ["b-tee", "g-jean", "b-jean"]));

  // ---- filters ----
  t("clearFilterState empties every Set + q in place", () => {
    // Sets must come from the IFRAME's realm — instanceof is realm-specific.
    const S = W.Set;
    const st = { q: "hi", brand: new S(["X"]), color: new S(["Blue"]) };
    W.clearFilterState(st);
    return eq([st.q, st.brand.size, st.color.size], ["", 0, 0]);
  });

  // ---- laundry derivation ----
  function laundrySetup() {
    W.items = [{ id: "i1", name: "Tee", category: "Tops", subcategory: "Tee shirts", status: "Available",
                 last_washed: D(-10), laundry_state: null }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.wears = [];
  }
  t("null last_washed = clean (opt-in tracking)", () => {
    laundrySetup();
    W.items[0].last_washed = null;
    W.wears = [{ item_id: "i1", worn_on: D(-1) }, { item_id: "i1", worn_on: D(-2) }];
    return eq(W.isDirty(W.items[0]), false);
  });
  t("wears since wash ≥ tolerance ⇒ dirty (tee tolerance 1)", () => {
    laundrySetup();
    W.wears = [{ item_id: "i1", worn_on: D(-2) }];
    return eq(W.isDirty(W.items[0]), true);
  });
  t("'hamper' override forces dirty with zero wears", () => {
    laundrySetup();
    W.items[0].laundry_state = "hamper";
    return eq(W.isDirty(W.items[0]), true);
  });
  t("'extra:<n>' grants one more wear, expires on a newer wear-day", () => {
    laundrySetup();
    W.wears = [{ item_id: "i1", worn_on: D(-3) }];
    W.items[0].laundry_state = "extra:1";      // set when 1 wear-day existed
    const clean = W.isDirty(W.items[0]);
    W.wears.push({ item_id: "i1", worn_on: D(-1) });  // newer wear lands
    const dirty = W.isDirty(W.items[0]);
    return eq([clean, dirty], [false, true]);
  });
  t("shoes/outerwear never dirty (Infinity tolerance)", () => {
    W.items = [{ id: "s1", category: "Shoes", subcategory: "Sneakers", status: "Available", last_washed: D(-300), laundry_state: null }];
    W.itemById = new Map([["s1", W.items[0]]]);
    W.wears = Array.from({ length: 40 }, (_, k) => ({ item_id: "s1", worn_on: D(-k - 1) }));
    return eq(W.isDirty(W.items[0]), false);
  });
  // Laundry Control round (2026-07-22): D3 — per-item tolerance override tag.
  t("wearTolerance: tol:<n> tag beats subcat/category defaults", () => {
    const withTag = { category: "Bottoms", subcategory: "Jeans", tags: ["tol:2"] };
    const withoutTag = { category: "Bottoms", subcategory: "Jeans", tags: [] };
    return eq([W.wearTolerance(withTag), W.wearTolerance(withoutTag)], [2, 5]);
  });
  t("tolTagValue: absent/invalid tag = null (falls back to derived)", () => {
    return eq([W.tolTagValue({ tags: [] }), W.tolTagValue({ tags: ["tol:0"] }), W.tolTagValue({ tags: ["tol:3"] })],
              [null, null, 3]);
  });
  // A — planRewearFlags must reset its running count on a REAL wash stamp
  // (items.last_washed), not just the planned-laundry-day sentinel.
  t("planRewearFlags: real last_washed resets the trip rewear count", () => {
    const item = { id: "p1", name: "Shorts", category: "Bottoms", subcategory: "Shorts", tags: [] };
    W.items = [item];
    W.itemById = new Map([["p1", item]]);
    W.outfits = [{ id: "o1", name: "L" }];
    W.outfitById = new Map([["o1", W.outfits[0]]]);
    W.outfitItemMap = new Map([["o1", ["p1"]]]);
    const dates = [D(0), D(1), D(2)];
    const c = { id: "c1", plan: { [dates[0]]: ["o1"], [dates[1]]: ["o1"], [dates[2]]: ["o1"] } };
    item.last_washed = null;
    const noWashFlagged = !!W.planRewearFlags(c, dates).get(dates[2]);
    item.last_washed = dates[1];  // washed partway through the trip
    const washedFlagged = !!W.planRewearFlags(c, dates).get(dates[2]);
    return eq([noWashFlagged, washedFlagged], [true, false]);
  });

  // ---- formality ----
  t("matchesFormality reads the explicit level set", () => {
    // (formalityOk itself is a closure-local inside suggestOutfits — the
    // canonical global predicate is matchesFormality.)
    const it = { formality: [3, 5], name: "x", category: "Tops", subcategory: "Blouses" };
    return eq([W.matchesFormality(it, 3), W.matchesFormality(it, 5), W.matchesFormality(it, 4)],
              [true, true, false]);
  });
  t("deriveWearFormality: shared level wins", () => {
    W.items = [
      { id: "a", formality: [3, 4], category: "Tops", name: "x" },
      { id: "b", formality: [4, 5], category: "Bottoms", name: "y" },
    ];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    return eq(W.deriveWearFormality(["a", "b"]), 4);
  });

  // ---- looks ----
  t("itemSetKey is order-independent and dedups", () =>
    eq(W.itemSetKey(["b", "a", "b"]), W.itemSetKey(["a", "b"])));
  t("outfitFullyInCapsule requires every piece", () => {
    W.itemById = new Map([["a", { id: "a" }], ["b", { id: "b" }]]);
    W.outfitItemMap = new Map([["o1", ["a", "b"]], ["o2", ["a"]]]);
    W.capsuleLinkMap = new Map([["c1", [{ item_id: "a" }]]]);
    return eq([W.outfitFullyInCapsule({ id: "o1" }, "c1"), W.outfitFullyInCapsule({ id: "o2" }, "c1")], [false, true]);
  });

  // ---- contexts ----
  t("ctxArr handles null / string / array", () =>
    eq([W.ctxArr(null), W.ctxArr({ context: "Work" }), W.ctxArr({ context: ["a", "b"] })],
       [[], ["Work"], ["a", "b"]]));

  // ---- trip mode helpers ----
  function tripSetup() {
    const c = { id: "c1", name: "Trip", start_date: D(-2), end_date: D(4), plan: {} };
    W.capsules = [c];
    W.capsuleById = new Map([["c1", c]]);
    W.items = [{ id: "a", name: "A" }, { id: "b", name: "B" }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.capsuleLinks = [{ capsule_id: "c1", item_id: "a" }];
    W.capsuleLinkMap = new Map([["c1", W.capsuleLinks]]);
    return c;
  }
  t("tripWearContext stamps Travel only inside trip dates + mode", () => {
    tripSetup();
    W.tripModeId = "c1";
    const inRange = W.tripWearContext(today);
    const outRange = W.tripWearContext(D(30));
    W.tripModeId = null;
    const off = W.tripWearContext(today);
    return eq([inRange, outRange, off], [["Travel"], null, null]);
  });
  t("tripMissingPieces: member → null, non-member → offer", () => {
    tripSetup();
    W.tripModeId = "c1";
    const m1 = W.tripMissingPieces(["a"]);
    const m2 = W.tripMissingPieces(["a", "b"]);
    W.tripModeId = null;
    return eq([m1, m2 && m2.missing], [null, ["b"]]);
  });

  // ---- trip recap ----
  t("tripRecapData: worn/dead split, most-worn, repeated look", () => {
    const c = { id: "c1", name: "T", start_date: D(-8), end_date: D(-2) };
    W.capsuleById = new Map([["c1", c]]);
    W.items = [{ id: "a", name: "A" }, { id: "b", name: "B" }, { id: "c", name: "C" }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.capsuleLinkMap = new Map([["c1", ["a", "b", "c"].map(id => ({ capsule_id: "c1", item_id: id }))]]);
    W.outfits = [{ id: "o1", name: "L" }];
    W.outfitById = new Map([["o1", W.outfits[0]]]);
    W.wears = [
      { item_id: "a", worn_on: D(-7), outfit_id: "o1" },
      { item_id: "a", worn_on: D(-5), outfit_id: "o1" },
      { item_id: "b", worn_on: D(-5) },
      { item_id: "a", worn_on: D(30) },   // outside range — ignored
    ];
    const r = W.tripRecapData(c);
    return eq([r.worn.map(i => i.id), r.dead.map(i => i.id), r.mostWorn.id, r.mostN, r.topLook.id, r.topLookN, r.days],
              [["a", "b"], ["c"], "a", 2, "o1", 2, 7]);
  });

  // ---- exclusions ----
  t("isExcluded normalizes pair order", () => {
    W.exclusions = [{ item_a: "a", item_b: "b" }];
    W.buildExcludeSet();
    return eq([W.isExcluded("a", "b"), W.isExcluded("b", "a"), W.isExcluded("a", "c")], [true, true, false]);
  });

  // ---- suggester correctness (2026-07-19 fix pack) ----
  t("targetLevel is a HARD filter — no casual fallback at Dressed Up", () => {
    const mk = (id, cat, sub) => ({ id, name: id, category: cat, subcategory: sub, color_family: "Blue",
      status: "Available", image_path: "x", formality: [3], tags: [], season: [] });
    W.items = [mk("t", "Tops", "Blouses"), mk("b", "Bottoms", "Jeans"), mk("s", "Shoes", "Flats")];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.wears = []; W.outfits = []; W.outfitLinks = []; W.exclusions = [];
    W.buildOutfitIndexes(); W.buildExcludeSet(); W.buildSuggestIndexes();
    const none = W.suggestOutfits(6, null, null, null, null, null, false).length;
    const some = W.suggestOutfits(3, null, null, null, null, null, false).length;
    return eq([none, some > 0], [0, true]);
  });
  t("layerPieceOf: with two flagged tops, the LAST (ow-slot) one is the layer", () => {
    const top = (id, tags) => ({ id, category: "Tops", subcategory: "Blouses", tags: tags || [] });
    const got = W.layerPieceOf([top("base", ["layer"]), { id: "b", category: "Bottoms" }, top("lay", ["layer"])]);
    return eq(got && got.id, "lay");
  });

  // ---- suggester session state (2026-07-19 round) ----
  t("_suggPool excludes banned pieces", () => {
    W.items = [{ id: "a", status: "Available" }, { id: "b", status: "Available" }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W._sugg.capsuleId = null;
    W._sugg.banned = new (W.Set)(["b"]);
    const ids = W._suggPool().map(i => i.id);
    W._sugg.banned = new (W.Set)();
    return eq(ids, ["a"]);
  });
  t("variety salt is stable within a session and bounded", () => {
    W._suggSessionSalt = new (W.Map)();
    const v1 = W._saltFor("x"), v2 = W._saltFor("x");
    return eq([v1 === v2, v1 >= 0 && v1 <= 0.35], [true, true]);
  });

  // ---- catch-up strip ----
  t("missedDays: last 3 days minus logged minus skipped", () => {
    W.wears = [{ item_id: "i", worn_on: D(-2) }];
    W.store.setItem(W.SKIP_DAYS_KEY, JSON.stringify([D(-3)]));
    const miss = W.missedDays();
    W.store.removeItem(W.SKIP_DAYS_KEY);
    return eq(miss, [D(-1)]);
  });

  // ---- closet-vs-life gap ----
  t("buildGapStats: shares, delta, noise floor", () => {
    W.items = [
      { id: "c1", status: "Available", formality: [3], category: "Tops", subcategory: "Blouses" },
      { id: "c2", status: "Available", formality: [5], category: "Tops", subcategory: "Blouses" },
      { id: "c3", status: "Available", formality: [5], category: "Tops", subcategory: "Blouses" },
      { id: "c4", status: "Available", formality: [5], category: "Tops", subcategory: "Blouses" },
    ];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.wears = [
      ...Array.from({ length: 6 }, (_, k) => ({ item_id: "c1", worn_on: D(-k - 1), context: ["Campus"], formality_for: 3 })),
      { item_id: "c2", worn_on: D(-1), context: ["Work"], formality_for: 5 },  // under noise floor
    ];
    const g = W.buildGapStats();
    return eq([g.rows.length, g.rows[0].ctx, g.rows[0].closetN,
               Math.round(g.rows[0].wearShare * 100), Math.round(g.rows[0].closetShare * 100)],
              [1, "Campus", 1, 86, 25]);
  });

  // ---- year in review ----
  t("longestStreak counts consecutive days", () => {
    const s = new (W.Set)(["2026-03-01", "2026-03-02", "2026-03-03", "2026-03-07", "2026-03-08"]);
    return eq(W.longestStreak(s), 3);
  });
  t("buildWrappedStats: year scoping, gift-free CPW, dead weight", () => {
    const Y = +today.slice(0, 4);
    W.items = [
      { id: "h", name: "h", status: "Available", price: "40", acquisition: "New" },
      { id: "g", name: "g", status: "Available", price: "40", acquisition: "Gift" },
      { id: "z", name: "z", status: "Available", price: "10", acquisition: "New", purchase_date: `${Y - 1}-01-01` },
    ];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.outfits = []; W.outfitById = new Map();
    W.wears = [
      { item_id: "h", worn_on: `${Y}-02-01` }, { item_id: "h", worn_on: `${Y}-02-02` }, { item_id: "h", worn_on: `${Y}-02-03` },
      { item_id: "g", worn_on: `${Y}-03-01` }, { item_id: "g", worn_on: `${Y}-03-02` }, { item_id: "g", worn_on: `${Y}-03-03` },
      { item_id: "h", worn_on: `${Y - 1}-06-01` },  // out of year
    ];
    const s = W.buildWrappedStats(Y);
    return eq([s.daysLogged, s.topItems[0].item.id, s.cpw.length, s.cpw[0] && s.cpw[0].item.id,
               s.dead.map(i => i.id), s.streak],
              [6, "h", 1, "h", ["z"], 3]);
  });

  // ---- Round A: gear + day plans (2026-07-20) ----
  t("suggestSlot: workout subcats map to real slots, bras/swim to none", () => {
    return eq([
      W.suggestSlot({ category: "Workout", subcategory: "Workout tops" }),
      W.suggestSlot({ category: "Workout", subcategory: "Active shorts" }),
      W.suggestSlot({ category: "Workout", subcategory: "Sports bras" }),
      W.suggestSlot({ category: "Workout", subcategory: "Swimwear" }),
      W.suggestSlot({ category: "Tops", subcategory: "Cardigans" }),
    ], ["Tops", "Bottoms", null, null, "Outerwear"]);
  });
  t("gear helpers: tags + gear-only formality", () => {
    const run = { tags: ["gear:workout"], formality: [1] };
    const dual = { tags: ["gear:workout"], formality: [1, 2] };
    const rain = { tags: ["gear:rain"], formality: [2] };
    return eq([W.isWorkoutGear(run), W.isRainGear(run), W.isRainGear(rain),
               W.isGearOnly(run), W.isGearOnly(dual)],
              [true, false, true, true, false]);
  });
  t("engine: workout mode pools gear only; normal mode excludes Workout cat + dry-day rain gear", () => {
    const mk = (id, cat, sub, tags, fml) => ({ id, name: id, category: cat, subcategory: sub, tags, formality: fml, status: "Available", image_path: "x.jpg", color_family: "Black" });
    const pool = [
      mk("rt", "Workout", "Workout tops", ["gear:workout"], [1]),
      mk("rs", "Workout", "Active shorts", ["gear:workout"], [1]),
      mk("sn", "Shoes", "Sneakers", ["gear:workout"], [1]),
      mk("tee", "Tops", "Tee shirts", [], [2, 3]),
      mk("jean", "Bottoms", "Jeans", [], [2, 3]),
      mk("flat", "Shoes", "Flats", [], [2, 3]),
      mk("rj", "Outerwear", "Jackets", ["gear:rain"], [2, 3]),
    ];
    W.itemById = new Map(pool.map(i => [i.id, i]));
    W._excludeSet = new (W.Set)();
    const act = W.suggestOutfits(null, null, pool, null, null, null, false, "workout");
    const actIds = new (W.Set)(act.flatMap(c => c.pieces.map(p => p.id)));
    const dry = W.suggestOutfits(null, null, pool, null, { maxT: 70, minT: 50, code: 0 }, null, false, null);
    const dryIds = new (W.Set)(dry.flatMap(c => c.pieces.map(p => p.id)));
    const wet = W.suggestOutfits(null, null, pool, null, { maxT: 60, minT: 45, code: 61 }, null, false, null);

    const dm = new Map([
      [D(-30), [{ item_id: "a", outfit_id: "o1", context: ["Church"] }]],
      [D(-40), [{ item_id: "b", outfit_id: "o2", context: [] }]],
      [D(-50), [{ item_id: "c", outfit_id: "o3", context: [] }]],

    return { log, dayMap: dm, today, ranges: [] };
  };

  // ---- Round C: milestones ----
  // milestoneFor reads app globals, so each case swaps them in and restores.
  // `best` parks the streak rung out of the way unless a case is testing it —
  // these fixtures use runs of consecutive days, which would otherwise trip it.
  const withMs = (its, ws, seen, fn, best = 9999) => {
    const sw = W.wears, si = W.items, sb = W.itemById,
          sk = W.kvData.get("milestones"), sbs = W.kvData.get("beststreak");
    W.items = its; W.itemById = new Map(its.map(i => [i.id, i])); W.wears = ws;
    W.kvData.set("milestones", seen || {});
    W.kvData.set("beststreak", best);
    try { return fn(); }
    finally {
      W.wears = sw; W.items = si; W.itemById = sb;
      W.kvData.set("milestones", sk || {}); W.kvData.set("beststreak", sbs || 0);
    }
  };

  // ---- stats back-nav + the "no lying funnel" rule ----
  // `statsNavBack` picks a return target and THEN re-renders it. Only the pick
  // is under test here, so the render is stubbed out: with no signed-in data the
  // destination pages have nothing to draw, and `renderStatsReportDetailPage`
  // legitimately bounces an empty group back to "report" — which would report a
  // green nav bug as a red one. Restored in a finally, or every later test that
  // renders goes silently blind.
  function navBackFrom(flags) {
    const saved = { sv: W.statsView, fp: W.statsFromPalette, ff: W.statsFromField, fr: W.statsFromReport };
    const realRender = W.renderStats;
    W.renderStats = () => {};
    try {
      W.statsView = "grid";
      W.statsFromReport = !!flags.report;
      W.statsFromPalette = !!flags.palette;
      W.statsFromField = !!flags.field;
      W.statsNavBack();
      return { view: W.statsView, palette: W.statsFromPalette };
    } finally {
      W.renderStats = realRender;
      W.statsView = saved.sv; W.statsFromPalette = saved.fp;
      W.statsFromField = saved.ff; W.statsFromReport = saved.fr;
    }
  }

  // ---- Round D: where you were (season × weather truth) ----
  // A synthetic home climate: 20 days per season at that season's typical
  // high, so the derived bands are predictable without depending on her data.
  const bandLog = () => {
    const log = {};
    const anchor = { Winter: ["2026-01-", 25], Spring: ["2026-04-", 58],
                     Summer: ["2026-07-", 82], Fall: ["2026-10-", 55] };
    for (const [, [pre, base]] of Object.entries(anchor))
      for (let k = 1; k <= 20; k++)
        log[pre + String(k).padStart(2, "0")] = { maxT: base + (k % 5) - 2, minT: base - 15, code: 0 };
    return log;
  };
  t("seasonBands: percentiles per season, and a thin season has no opinion", () => {
    const log = bandLog();
    delete log["2026-01-20"];           // still 19 — above the floor
    const b = W.seasonBands(log);
    const thin = {}; for (let k = 1; k <= 5; k++) thin["2026-01-0" + k] = { maxT: 20, minT: 5, code: 0 };
    return eq([b.Summer.p10 <= 80, b.Summer.p90 >= 83, b.Winter.median <= 27,
               W.seasonBands(thin).Winter],
              [true, true, true, null]);
  });
  t("seasonBands ignores away days (they describe somewhere else)", () => {
    const log = bandLog();
    for (let k = 1; k <= 20; k++) log["2026-01-" + String(k).padStart(2, "0")].away = 1;
    return eq(W.seasonBands(log).Winter, null);   // every winter day now away
  });
  t("effectiveSeasonOf: an away December day at 85° counts as Summer", () => {

    log["2025-12-24"] = { maxT: 85, minT: 76, code: 0, away: 1, loc: "Castries" };
    log["2025-12-25"] = { maxT: 24, minT: 10, code: 0 };   // home, same week
    return eq([W.effectiveSeasonOf("2025-12-24", log), W.effectiveSeasonOf("2025-12-25", log)],
              ["Summer", "Winter"]);

  t("effectiveSeasonOf falls back to the calendar with no usable bands", () => {
    const log = { "2025-12-24": { maxT: 85, minT: 76, code: 0, away: 1 } };

  // ---- Round D: the detector ----
  const auditFix = (over) => {

    for (let k = 1; k <= 8; k++) {                    // 8 July days at 82° (home summer)

      rows: days.map(d => ({ item_id: "w1", worn_on: d })) };
  };
  t("buildSeasonWxFlags: worn far hotter than the claimed season", () => {
    const f = auditFix();
    const r = W.buildSeasonWxFlags({ pool: [f.item], wearRows: f.rows, log: f.log, ranges: [], dismissed: {} });
    return eq([r.flags.length, r.flags[0].kind, r.flags[0].dir, r.flags[0].id],

  t("buildSeasonWxFlags: the calendar flag catches a right-temp wrong-month tag", () => {

  t("mis-tagged items are flagged, but the TRIP question comes from the days", () => {

    const log = bandLog();

    const rows = pool.flatMap(i => days.map(d => ({ item_id: i.id, worn_on: d })));
    const r = W.buildSeasonWxFlags({ pool, wearRows: rows, log, ranges: [], dismissed: {} });

    const pool = [{ id: "a", name: "a", season: ["Winter"], status: "Available", image_path: "" }];

    const r = W.buildSeasonWxFlags({ pool, wearRows: rows, log, ranges: known, dismissed: {} });

  // ---- Round D r15: the untagged-trip case (her St Lucia dress) ----
  // A sundress with NO season tag and only trip wears is invisible to the
  // tagged detector by construction — the stored (home) weather and the
  // calendar agree with each other. What gives the trip away is the SANDALS:
  // years of home summer wears, suddenly worn on a "25°" December day.
  const stLuciaFix = () => {
    const log = bandLog();
    const rows = [];
    for (let k = 1; k <= 20; k++) {                       // sandals: 20 real summer days
      const d = `2026-07-${String(k).padStart(2, "0")}`;
      rows.push({ item_id: "sandals", worn_on: d });
    }
    const trip = [];
    for (let k = 20; k <= 26; k++) {                      // the trip, still recorded as HOME winter
      const d = `2025-12-${k}`;
      trip.push(d);
      log[d] = { maxT: 25, minT: 12, code: 0 };
      rows.push({ item_id: "sandals", worn_on: d });
      rows.push({ item_id: "sundress", worn_on: d });     // no season tag, no history
    }
    return { log, rows, trip };
  };
  t("itemTempCenter is the median, so a few trip days can't move it", () => {
    const f = stLuciaFix();
    const c = W.itemTempCenter("sandals", f.log,
      new Map([["sandals", new Set(f.rows.filter(r => r.item_id === "sandals").map(r => r.worn_on))]]));
    return eq([c.t, c.n], [81, 27]);   // 7 cold trip days in the tail, median unmoved
  });
  t("itemTempCenter stays null under the history minimum", () => {
    const f = stLuciaFix();
    return eq(W.itemTempCenter("zz", f.log, new Map([["zz", new Set(f.trip.slice(0, 3))]])), null);
  });
  t("a trip-only piece abstains — its habit IS the wrong weather", () => {
    // The sundress's own centre is 25°, computed from the same corrupted days,
    // so it agrees with them trivially and must not be counted either way.
    const f = stLuciaFix();
    const c = W.itemTempCenter("sundress", f.log, new Map([["sundress", new Set(f.trip)]]));
    const r = W.buildDayWxAnomalies({ wearRows: f.rows, log: f.log, ranges: [] });
    return eq([c.t, r.days[0].ids], [25, ["sandals"]]);
  });
  t("buildDayWxAnomalies finds an unlogged trip from the outfit, not the tags", () => {
    const f = stLuciaFix();
    const r = W.buildDayWxAnomalies({ wearRows: f.rows, log: f.log, ranges: [] });
    return eq([r.days.length, r.days[0].dir, r.clusters.length,
               r.clusters[0].from, r.clusters[0].to],
              [7, "warmer", 1, "2025-12-20", "2025-12-26"]);
  });
  t("buildSeasonWxFlags: an untagged trip still raises a trip guess", () => {
    const f = stLuciaFix();
    const pool = [{ id: "sundress", name: "Sundress", season: null, status: "Available", image_path: "" },
                  { id: "sandals", name: "Sandals", season: null, status: "Available", image_path: "" }];
    const r = W.buildSeasonWxFlags({ pool, wearRows: f.rows, log: f.log, ranges: [], dismissed: {} });
    return eq([r.flags.length, r.tripGuesses.length,
               r.tripGuesses[0] && r.tripGuesses[0].from, r.tripGuesses[0] && r.tripGuesses[0].to],
              [0, 1, "2025-12-20", "2025-12-26"]);
  });
  t("a day already inside a known away range is never re-asked", () => {
    const f = stLuciaFix();
    const known = [{ from: "2025-12-19", to: "2025-12-28", name: "Castries", lat: 14, lon: -60 }];
    const r = W.buildDayWxAnomalies({ wearRows: f.rows, log: f.log, ranges: known });
    return eq([r.days.length, r.clusters.length], [0, 0]);
  });
  t("an ordinary home summer day is not an anomaly", () => {
    const f = stLuciaFix();
    const r = W.buildDayWxAnomalies({ wearRows: f.rows, log: f.log, ranges: [] });
    return eq(r.days.some(d => d.d.startsWith("2026-07")), false);
  });
  t("one WELL-ESTABLISHED piece is enough; one lightly-worn one is not", () => {
    const f = stLuciaFix();
    // Sandals alone (27 days of history) still carry the day…
    const strong = W.buildDayWxAnomalies({
      wearRows: f.rows.filter(r => r.item_id !== "sundress"), log: f.log, ranges: [] });
    // …but a piece with just 6 summer days behind it doesn't, on its own.
    const log2 = bandLog(); const rows2 = [];
    for (let k = 1; k <= 6; k++) rows2.push({ item_id: "flip", worn_on: `2026-07-0${k}` });
    for (let k = 20; k <= 26; k++) {
      const d = `2025-12-${k}`; log2[d] = { maxT: 25, minT: 12, code: 0 };
      rows2.push({ item_id: "flip", worn_on: d });
    }
    const weak = W.buildDayWxAnomalies({ wearRows: rows2, log: log2, ranges: [] });
    return eq([strong.days.length > 0, weak.days.length], [true, 0]);
  });
  t("the temp flag needs fewer days than the calendar flag", () =>
    eq(W.WXA_TEMP_MIN_DAYS < W.WXA_MIN_DAYS, true));

  /* ---- Round D r16: the false-positive test that matters ----
     User-reported: the trip detector "guessed huge swaths of dates". Two
     causes, and this fixture reproduces both — a realistic two-year wardrobe
     with year-round basics, genuine cold snaps and heat waves, and exactly ONE
     real trip. Anything other than that one window is a false positive. */
  const realisticYear = () => {
    let seed = 12345;
    const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
    const log = {}, rows = [];
    const days = [];
    const start = new Date("2024-01-01T00:00:00");
    for (let k = 0; k < 730; k++) {
      const dt = new Date(start.getTime() + k * 86400000);
      const ds = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
      const doy = k % 365;
      let maxT = Math.round(55 - 30 * Math.cos(2 * Math.PI * (doy - 15) / 365) + (rnd() * 16 - 8));
      if (ds.slice(5) >= "02-05" && ds.slice(5) <= "02-09") maxT = 4;    // real cold snap
      if (ds.slice(5) >= "08-10" && ds.slice(5) <= "08-14") maxT = 101;  // real heat wave
      log[ds] = { maxT, minT: maxT - 14, code: 0 };
      days.push({ ds, maxT });
    }
    for (const { ds, maxT } of days) {
      if (days.indexOf(days.find(x => x.ds === ds)) % 3 === 0) rows.push({ item_id: "jeans", worn_on: ds });
      if (maxT < 42) rows.push({ item_id: "coat", worn_on: ds });
      if (maxT > 74) rows.push({ item_id: "sandals", worn_on: ds });
    }
    // ONE real trip: sandals + an untagged sundress, in a December still on record
    // as home weather. This is the only window that should be reported.
    const trip = [];
    for (let k = 20; k <= 26; k++) {
      const ds = `2025-12-${k}`;
      trip.push(ds);
      rows.push({ item_id: "sandals", worn_on: ds });
      rows.push({ item_id: "sundress", worn_on: ds });
    }
    return { log, rows, trip };
  };
  t("a real cold snap and heat wave are NOT mistaken for travel", () => {
    const f = realisticYear();
    const r = W.buildDayWxAnomalies({ wearRows: f.rows, log: f.log, ranges: [] });
    const bad = r.days.map(d => d.d).filter(d => !f.trip.includes(d));
    return bad.length ? `false positives: ${JSON.stringify(bad.slice(0, 12))} (${bad.length})` : true;
  });
  t("the realistic wardrobe yields exactly ONE trip window, the real one", () => {
    const f = realisticYear();
    const r = W.buildDayWxAnomalies({ wearRows: f.rows, log: f.log, ranges: [] });
    return eq(r.clusters.map(c => [c.from, c.to]), [["2025-12-20", "2025-12-26"]]);
  });
  t("year-round basics are judged against their OWN spread, so extremes don't fire", () => {
    const f = realisticYear();
    const byItem = new Map();
    for (const w of f.rows) {
      if (!byItem.has(w.item_id)) byItem.set(w.item_id, new Set());
      byItem.get(w.item_id).add(w.worn_on);
    }
    const jeans = W.itemTempCenter("jeans", f.log, byItem);
    const sandals = W.itemTempCenter("sandals", f.log, byItem);
    // Jeans span the year, so their bar is wide; sandals are picky, so theirs is the floor.
    return eq([jeans.iqr > 25, sandals.iqr < 25], [true, true]);
  });
  t("clustering can't chain scattered days into a giant window", () => {
    // 8 lone anomalies, each 3 days apart — gap-chaining alone would merge all
    // 8 into a 22-day 'trip'. Density has to reject it.
    const e = [];
    for (let k = 0; k < 8; k++) e.push({ d: W.shiftDate("2025-03-01", k * 3), id: "x" });
    const c = W._clusterAwayDays(e);
    return eq(c.length, 0);
  });
  t("a genuine run of consecutive days still clusters", () => {
    const e = [];
    for (let k = 0; k < 6; k++) e.push({ d: W.shiftDate("2025-03-01", k), id: "x" });
    const c = W._clusterAwayDays(e);
    return eq(c.map(x => [x.from, x.to]), [["2025-03-01", "2025-03-06"]]);
  });

  /* ---- Round D r17: null-weather days, and saying WHY ----
     User-reported "some of the dates have 0/0 for degrees". Open-Meteo returns
     null for days it has no reading and Math.round(null) is 0, so gaps were
     stored as a hard freeze — which poisons the bands, every "usually worn"
     range, and the trip detector all at once. */
  t("_wxDay drops a null reading instead of rounding it to 0°", () => {
    const daily = { temperature_2m_max: [72, null, 68], temperature_2m_min: [55, null, 51],
                    weather_code: [0, 0, 0] };
    return eq([W._wxDay(daily, 0).maxT, W._wxDay(daily, 1), W._wxDay(daily, 2).maxT], [72, null, 68]);
  });
  t("purgeNullWxDays clears 0/0 artifacts and keeps a real cold day", () => {
    const log = { "2026-01-01": { maxT: 0, minT: 0, code: 0 },      // artifact
                  "2026-01-02": { maxT: 3, minT: -9, code: 0 },     // genuinely freezing
                  "2026-01-03": { maxT: 41, minT: 22, code: 0 } };
    const r = W.purgeNullWxDays(log);
    return eq([r.n, Object.keys(r.log).sort()], [1, ["2026-01-02", "2026-01-03"]]);
  });
  t("a 0/0 artifact can't drag a season band or an item's range", () => {
    const log = bandLog();
    const ds = [];
    for (let k = 1; k <= 6; k++) { const d = `2026-07-${String(20 + k)}`; ds.push(d); log[d] = { maxT: 84, minT: 70, code: 0 }; }
    const clean = W.seasonBands(log).Summer;
    log["2026-07-19"] = { maxT: 0, minT: 0, code: 0 };   // artifact inside Summer
    ds.push("2026-07-19");
    const withArtifact = W.seasonBands(log).Summer;
    const savedWears = W.wears;
    W.wears = ds.map(d => ({ item_id: "x", worn_on: d }));
    const prof = W.itemWxProfile("x", log);
    W.wears = savedWears;
    return eq([clean.p10 === withArtifact.p10, prof.lo >= 80], [true, true]);
  });
  t("no flag when the seasons the weather suggests are ALREADY tagged", () => {
    // Worn on hot July days, tagged Winter AND Summer. Summer is already there,
    // so there is nothing to propose — and an unactionable warning is noise.
    const f = auditFix({ season: ["Winter", "Summer"] });
    const r = W.buildSeasonWxFlags({ pool: [f.item], wearRows: f.rows, log: f.log, ranges: [], dismissed: {} });
    return eq(r.flags.length, 0);
  });
  t("every flag carries a concrete season to add", () => {
    const f = auditFix();
    const r = W.buildSeasonWxFlags({ pool: [f.item], wearRows: f.rows, log: f.log, ranges: [], dismissed: {} });
    return eq(r.flags.every(x => x.missing && x.missing.length > 0), true);
  });
  t("a piece worn at the mild end of its own season isn't flagged", () => {
    // Tagged Winter, worn on the warmer winter days. The old flat 3° margin
    // called that a contradiction; the season's own spread says it isn't.
    const log = {};
    for (let k = 1; k <= 30; k++)                                  // winter spans 10°–50°
      log[`2026-01-${String(k).padStart(2, "0")}`] = { maxT: 10 + k + (k % 3) * 3, minT: 0, code: 0 };
    const days = [];
    for (let k = 24; k <= 30; k++) days.push(`2026-01-${k}`);      // the mild end
    const item = { id: "wc", name: "Wool coat", season: ["Winter"], status: "Available", image_path: "" };
    const rows = days.map(d => ({ item_id: "wc", worn_on: d }));
    const r = W.buildSeasonWxFlags({ pool: [item], wearRows: rows, log, ranges: [], dismissed: {} });
    return eq(r.flags.length, 0);
  });
  t("a flag says what's probably MISSING, not just that something is off", () => {
    const f = auditFix();   // 8 July days at 82°, tagged Winter
    const r = W.buildSeasonWxFlags({ pool: [f.item], wearRows: f.rows, log: f.log, ranges: [], dismissed: {} });
    const txt = W.wxFlagText(r.flags[0]);
    return eq([r.flags[0].fit, r.flags[0].missing, /That's Summer weather here/.test(txt)],
              [["Summer"], ["Summer"], true]);
  });
  t("a mis-tagged seasonal item flags the ITEM but invents no trips", () => {
    /* A winter coat tagged Summer is worn on consecutive cold days, so if a
       flag's contradicting days fed the trip clusterer its own history would
       cluster into dense, entirely spurious "were you away?" windows. */
    const f = realisticYear();
    const pool = [{ id: "coat", name: "Wool coat", season: ["Summer"], status: "Available", image_path: "" }];
    const rows = f.rows.filter(r => r.item_id === "coat");
    const r = W.buildSeasonWxFlags({ pool, wearRows: rows, log: f.log, ranges: [], dismissed: {} });
    return eq([r.flags.length, r.flags[0].kind, r.tripGuesses.length], [1, "temp", 0]);
  });
  t("buildSeasonWxFlags exposes per-DAY culprits for the day view", () => {
    const f = stLuciaFix();
    const pool = [{ id: "sandals", name: "Sandals", season: null, status: "Available", image_path: "" }];
    const r = W.buildSeasonWxFlags({ pool, wearRows: f.rows, log: f.log, ranges: [], dismissed: {} });
    const day = (r.dayAnomalies || []).find(o => o.d === "2025-12-20");
    return eq([!!day, day && day.ids, day && day.dir], [true, ["sandals"], "warmer"]);
  });

  // ---- Round D: temperature-eligible rescue ----
  t("inSeasonWx rescues an out-of-season piece the forecast actually fits", () => {
    const savedWears = W.wears;
    const log = {};
    const ds = [];
    for (let k = 0; k < 6; k++) { const d = D(-10 - k); ds.push(d); log[d] = { maxT: 82, minT: 70, code: 0 }; }
    W.wears = ds.map(d => ({ item_id: "sd", worn_on: d }));
    const savedKv = W.kvData.get("wxlog");
    W.kvData.set("wxlog", log);
    const i = { id: "sd", name: "Sundress", season: ["Summer"] };
    const cold = W.inSeasonWx(i, "Winter", { maxT: 30, minT: 20, code: 0 });
    const warm = W.inSeasonWx(i, "Winter", { maxT: 84, minT: 76, code: 0 });
    const noWx = W.inSeasonWx(i, "Winter", null);
    const noProfile = W.inSeasonWx({ id: "zz", season: ["Summer"] }, "Winter", { maxT: 84, minT: 76, code: 0 });
    W.wears = savedWears;
    if (savedKv === undefined) W.kvData.delete("wxlog"); else W.kvData.set("wxlog", savedKv);
    return eq([cold, warm, noWx, noProfile], [false, true, false, false]);
  });
  t("inSeasonWx never narrows: in-season is eligible regardless of weather", () => {
    const i = { id: "zz", name: "Parka", season: ["Winter"] };
    return eq([W.inSeasonWx(i, "Winter", { maxT: 95, minT: 80, code: 0 }), W.inSeasonWx(i, "Winter", null)],
              [true, true]);
  });

  // ---- render summary ----
  const ul = document.getElementById("results");
  let pass = 0;
  for (const r of results) {
    const li = document.createElement("li");
    li.className = r.ok ? "pass" : "fail";
    li.textContent = (r.ok ? "✓ " : "✗ ") + r.name + (r.ok ? "" : " — " + r.msg);
    ul.appendChild(li);
    if (r.ok) pass++;
  }
  const sum = document.getElementById("summary");
  sum.textContent = `${pass}/${results.length} passed`;
  sum.className = pass === results.length ? "pass" : "fail";
  document.title = `${pass}/${results.length} — Wardrobe self-test`;
}
</script>
</body>
