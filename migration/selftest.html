    const rack = W.packRack(c, slate);
    const res = W.packSolve({ c, demand, rack, restarts: 8, K: 1 });
    const gaps = W.packGaps(demand, rack.ids);
    const u = res.unmet.find(x => x.level === 8);
    return res.pack.length > 0 && !!u && u.date === D(2)
        && gaps.some(g => g.level === 8 && g.nearest && g.nearest < 8)
      ? true : `pack=${res.pack.length} unmet=${JSON.stringify(res.unmet)} gaps=${JSON.stringify(gaps)}`;
  }));

  t("packOutfitCount only counts outfits buildable from the pack itself", () => withPackCloset(() => {
    const { demand, res } = solveFor(packTrip(5));
    const n = W.packOutfitCount(res.pack, demand);
    const all = W.packOutfitCount(W.items.map(i => i.id), demand);
    return n > 0 && n <= all ? true : `pack=${n} closet=${all}`;
  }));

  t("packLeftOut names a proven-unused piece as a fact, and never one in the pack", () => withPackCloset(() => {
    // Two finished trips that both packed ckt0 and never wore it.
    const c = packTrip(4);
    const left = W.packLeftOut(c, ["tee0", "jea0"]);
    const names = left.map(e => e.item.id);
    return names.includes("ckt0") && left.every(e => e.worn === 0 && e.packed >= 2)
      ? true : `left=${JSON.stringify(left.map(e => [e.item.id, e.packed, e.worn]))}`;
  }, {
    capsules: [
      { id: "old1", name: "T1", kind: "packing", start_date: "2026-05-01", end_date: "2026-05-05", locations: [] },
      { id: "old2", name: "T2", kind: "packing", start_date: "2026-06-01", end_date: "2026-06-05", locations: [] },
    ],
    capsuleLinks: [
      { capsule_id: "old1", item_id: "ckt0" }, { capsule_id: "old1", item_id: "tee0" },
      { capsule_id: "old2", item_id: "ckt0" }, { capsule_id: "old2", item_id: "tee0" },
    ],
    wears: (ws) => { ws.push({ id: "o1", item_id: "tee0", worn_on: "2026-05-02", context: ["Errands"], formality_for: 3 });
                     ws.push({ id: "o2", item_id: "tee0", worn_on: "2026-06-02", context: ["Errands"], formality_for: 3 }); },
  }));

  /* ================= ITEMS FIRST (2026-07-30 redesign) =================
     Her ask: "start with clothing not outfits... Start with items and number of
     slots THEN make sure the outfits cover the required occasions."
     ⚠️ packCoverage is what keeps this honest. Inversion ① is not repealed — a
     pack chosen only to satisfy per-slot counts can still contain no wearable
     outfit; the guarantee just moved from the generator to a check. */
  const itemsFirst = (c, opt = {}) => {
    const slate = W.packSlate(c, { mix: opt.mix });
    const demand = W.packDemand(slate);
    const rack = W.packRack(c, slate);
    const counts = W.packCounts(demand, { K: opt.K == null ? 2 : opt.K });
    const targets = opt.targets || counts.slots;
    const fill = W.packFill(targets, { c, demand, rack, pinned: opt.pinned, subTargets: opt.subTargets });
    const cov = W.packCoverage(fill.pack, demand, {});
    return { slate, demand, rack, counts, targets, fill, cov };
  };

  t("the app proposes a count for every slot before anything is picked", () => withPackCloset(() => {
    const r = itemsFirst(packTrip(5));
    const missing = W.PACK_COUNT_SLOTS.filter(s => !(s in r.counts.slots));
    const noWhy = W.PACK_COUNT_SLOTS.filter(s => !r.counts.why[s]);
    // Every dial needs a number AND a reason — the reason is what she revises against.
    return !missing.length && !noWhy.length && r.counts.slots.Tops > 0
      ? true : `missing=${JSON.stringify(missing)} noWhy=${JSON.stringify(noWhy)} counts=${JSON.stringify(r.counts.slots)}`;
  }));

  t("Cushion proposes strictly more pieces than Lean", () => withPackCloset(() => {
    const c = packTrip(6);
    const lean = itemsFirst(c, { K: 1 }).counts.slots;
    const cush = itemsFirst(c, { K: 3 }).counts.slots;
    const sum = (o) => W.PACK_COUNT_SLOTS.reduce((n, s) => n + (o[s] || 0), 0);
    // STRICT: `>=` would hold even if the dial were ignored entirely, which is
    // the failure worth catching (it happened once already with repW).
    return sum(cush) > sum(lean) ? true : `lean=${sum(lean)} cushion=${sum(cush)}`;
  }));

  t("the count proposal has a laundry floor, not just her average", () => withPackCloset(() => {
    // 10 days of one level: tolerance can't be met by her per-day rate alone.
    const c = packTrip(10);
    const r = itemsFirst(c, { mix: [{ context: "Errands", per: 1 }] });
    const tol = W.PACK_TYPICAL_TOL.Tops;
    const occ = r.demand.length;
    return r.counts.slots.Tops >= Math.ceil((occ * 0.8) / tol)
      ? true : `tops=${r.counts.slots.Tops} occasions=${occ} tol=${tol}`;
  }));

  t("packFill hits the targets it was given", () => withPackCloset(() => {
    const targets = { Tops: 5, Bottoms: 3, Dresses: 1, Shoes: 2, Outerwear: 1 };
    const r = itemsFirst(packTrip(5), { targets });
    const off = W.PACK_COUNT_SLOTS.filter(s => (r.fill.bySlot[s] || []).length !== targets[s]);
    return !off.length
      ? true : `slots off target: ${JSON.stringify(off.map(s => [s, (r.fill.bySlot[s] || []).length, targets[s]]))}`;
  }));

  t("a kept piece survives the fill and counts toward its slot", () => withPackCloset(() => {
    // "keep" is the whole point of the per-item control — it must be honoured
    // even when the optimiser would never have chosen it.
    const targets = { Tops: 3, Bottoms: 2, Dresses: 0, Shoes: 2, Outerwear: 0 };
    const r = itemsFirst(packTrip(5), { targets, pinned: ["ckt0", "hee0"] });
    const shoes = r.fill.bySlot.Shoes || [];
    return r.fill.pack.includes("hee0") && shoes.includes("hee0") && shoes.length === 2
      ? true : `pack=${JSON.stringify(r.fill.pack)} shoes=${JSON.stringify(shoes)}`;
  }));

  /* ⚠️ THE REGRESSION THIS ENGINE WAS REWRITTEN FOR. Scoring bare "does anything
     else reach this level" packed five tees and one sweater for a trip with a
     work day: every level was technically covered, the remaining picks fell
     through to warmth, and the whole L5 day hung on a single sweater. Coverage is
     a per-level CAPACITY question. */
  /* Composed behaviour: a level with several occasions must not hang on one top.
     ⚠️ Two earlier versions of this case were VACUOUS and both were caught by
     mutation, which is worth recording because the reason is architectural:
     when the pool comes from buildRack, the rack's own formality top-up
     (RACK_LEVEL_MIN = 2) already guarantees two L5 tops, so nothing in packFill
     is on trial. This case therefore guards the COMPOSED pipeline; the case
     below isolates packFill's own scoring against a hand-built pool. */
  t("a level with several occasions never hangs on a single top (end to end)", () => withPackCloset(() => {
    const c = packTrip(6);
    const r = itemsFirst(c, { mix: [{ context: "Work", per: 0.9 }] });
    const occAt = new Map();
    for (const o of r.demand) if (o.level) occAt.set(o.level, (occAt.get(o.level) || 0) + 1);
    const piecesAt = new Map();
    for (const id of r.fill.pack) {
      const i = W.itemById.get(id);
      const slot = W.suggestSlot(i);
      if (slot !== "Tops" && slot !== "Dresses") continue;
      for (const lv of (W.itemFormalitySet(i) || [])) {
        if (!occAt.has(lv)) continue;
        piecesAt.set(lv, (piecesAt.get(lv) || 0) + 1);
      }
    }
    const thin = [...occAt.entries()]
      .filter(([lv, n]) => n >= 2 && (piecesAt.get(lv) || 0) < 2)
      .map(([lv, n]) => [lv, n, piecesAt.get(lv) || 0]);
    return !thin.length
      ? true : `[level, occasions, topsReachingIt]: ${JSON.stringify(thin)}`;
  }));

  /* packFill's OWN scoring, with the rack's guarantee deliberately removed: the
     pool is handed in directly and is tee-heavy, so bare-coverage scoring fills
     up on tees and leaves one L5 top. This is the case that actually goes red
     when the deficit term or the subcategory penalty is disabled. */
  /* Isolates the per-level CAPACITY term specifically. Every candidate is the
     same subcategory and the same tolerance, so the subcategory-diversity
     penalty is uniform and cannot be what produces the answer — only counting
     how many wear-days each level still needs can. Without it, bare coverage
     stops caring once each level has one piece and fills the rest arbitrarily.
     ⚠️ This case exists because measurement showed the capacity term carried
     NOTHING on any other case: sub-diversity was doing all the work. Deleting
     the capacity maths is a legitimate simplification only if this goes with it. */
  t("packFill weights levels by how many wear-days they still need", () => withPackCloset(() => {
    const c = packTrip(5);
    // 1 occasion at L3, 3 at L5 — so L5 needs roughly three times the capacity.
    const demand = [
      { id: "o1", date: D(1), level: 3, context: "Friends", contexts: ["Friends"] },
      { id: "o2", date: D(2), level: 5, context: "Work", contexts: ["Work"] },
      { id: "o3", date: D(3), level: 5, context: "Work", contexts: ["Work"] },
      { id: "o4", date: D(4), level: 5, context: "Work", contexts: ["Work"] },
    ];
    const poolIds = ["lo0", "lo1", "lo2", "hi0", "hi1", "hi2"];
    const fill = W.packFill({ Tops: 4, Bottoms: 0, Dresses: 0, Shoes: 0, Outerwear: 0 },
      { c, demand, rack: { ids: poolIds, cold: [], legs: 1 } });
    const tops = (fill.bySlot.Tops || []).map(id => W.itemById.get(id));
    const atL5 = tops.filter(i => (W.itemFormalitySet(i) || []).includes(5)).length;
    return tops.length === 4 && atL5 >= 3
      ? true : `tops=${JSON.stringify(tops.map(i => i.id))} reachingL5=${atL5}`;
  }, {
    // All Blouses (tolerance 1, one wear each) so only the LEVEL differs.
    replace: (add) => {
      for (let n = 0; n < 3; n++) add("lo" + n, "Tops", "Blouses", [3]);
      for (let n = 0; n < 3; n++) add("hi" + n, "Tops", "Blouses", [5]);
      add("padBot", "Bottoms", "Jeans", [3, 5]);
      add("padSho", "Shoes", "Flats", [3, 5]);
    },
  }));

  t("packFill spreads across levels even when the pool is stacked against it", () => withPackCloset(() => {
    const c = packTrip(6);
    const demand = W.packDemand(W.packSlate(c, { mix: [{ context: "Work", per: 0.9 }] }));
    // 6 tees (L2-3) + 1 sweater (L3-5) + 3 blouses (L4-5). Asking for 4 tops:
    // covering L5 once is trivial, covering it twice needs real scoring.
    const poolIds = ["tee0", "tee1", "tee2", "tee3", "tee4", "tee5", "swt0", "blo0", "blo1", "blo2"];
    const fill = W.packFill({ Tops: 4, Bottoms: 0, Dresses: 0, Shoes: 0, Outerwear: 0 },
      { c, demand, rack: { ids: poolIds, cold: [], legs: 1 } });
    const l5 = (fill.bySlot.Tops || []).map(id => W.itemById.get(id))
      .filter(i => (W.itemFormalitySet(i) || []).includes(5));
    return (fill.bySlot.Tops || []).length === 4 && l5.length >= 2
      ? true : `tops=${JSON.stringify((fill.bySlot.Tops || []))} reachingL5=${JSON.stringify(l5.map(i => i.id))}`;
  }));

  t("packCoverage names the blocking slot when a level can't be dressed", () => withPackCloset(() => {
    // Tops only: nothing to put on the bottom half, so every occasion is blocked
    // on Bottoms — and "add a bottom" is the actionable half of the message.

    const cov = W.packCoverage(tops, demand, {});
    return cov.uncovered.length === demand.length
      && cov.uncovered.every(u => u.blocker === "Bottoms") && cov.outfits === 0
      ? true : `uncovered=${cov.uncovered.length}/${demand.length} blockers=${JSON.stringify([...new Set(cov.uncovered.map(u => u.blocker))])} outfits=${cov.outfits}`;
  }));

  t("packCoverage only counts outfits the pack itself can build", () => withPackCloset(() => {
    const r = itemsFirst(packTrip(5));
    const whole = W.packCoverage(W.items.map(i => i.id), r.demand, {});
    return r.cov.outfits > 0 && r.cov.outfits <= whole.outfits
      ? true : `pack=${r.cov.outfits} closet=${whole.outfits}`;
  }));

  t("packFill never puts an excluded pair in the same slot", () => withPackCloset(() => {
    const targets = { Tops: 4, Bottoms: 2, Dresses: 0, Shoes: 2, Outerwear: 0 };
    const r = itemsFirst(packTrip(5), { targets });

  /* ⚠️ The fallback used to be "the first three subcategories in the taxonomy",
     which proposed 2 Graphic tees for a closet containing none — the app
     confidently naming clothes she doesn't own, which is worse than silence. */
  t("the expanded dial never proposes a subcategory she owns none of", () => withPackCloset(() => {
    const owned = new Set(W.items.filter(i => W.suggestSlot(i) === "Tops").map(i => i.subcategory));
    const subs = W.packSubCounts("Tops", 6, {});
    const phantom = Object.keys(subs).filter(s => !owned.has(s));
    return !phantom.length && Object.values(subs).reduce((a, b) => a + b, 0) === 6
      ? true : `phantom=${JSON.stringify(phantom)} subs=${JSON.stringify(subs)}`;
  }));

  t("the expanded dial's subcategory counts add up to the slot count", () => withPackCloset(() => {
    const bad = [];
    for (const n of [1, 3, 5, 8]) {
      const subs = W.packSubCounts("Tops", n, {});
      const tot = Object.values(subs).reduce((a, b) => a + b, 0);
      if (tot !== n) bad.push([n, tot]);
    }
    return !bad.length ? true : `[want,got]: ${JSON.stringify(bad)}`;
  }));

  t("subcategory targets are respected by the fill", () => withPackCloset(() => {
    const targets = { Tops: 3, Bottoms: 2, Dresses: 0, Shoes: 1, Outerwear: 0 };
    const r = itemsFirst(packTrip(5), { targets, subTargets: { Tops: { Blouses: 3 } } });
    const tops = (r.fill.bySlot.Tops || []).map(id => W.itemById.get(id));
    return tops.length === 3 && tops.every(i => i.subcategory === "Blouses")
      ? true : `tops=${JSON.stringify(tops.map(i => i.subcategory))}`;
  }));

  /* ---- mid-trip wash plan (r4) ----
     Turns "6 things are dirty" into "wash these six, the back half needs them".
     ⚠️ Like tripUnwornNow, the derivation owns whether to speak at all — a
     laundry row that always shows is a row she stops reading. */
  const midTripCloset = (fn, opt = {}) => withPackCloset(fn, {
    ...opt,
    capsules: [{ id: "onnow", name: "Now", kind: "packing",
                 start_date: D(-2), end_date: D(3), locations: [], plan: opt.plan || {} }],
    capsuleLinks: (opt.members || ["tee0", "jea0", "snk0"]).map(id => ({ capsule_id: "onnow", item_id: id })),
  });

  t("mid-trip wash plan names the pieces the rest of the trip needs", () => midTripCloset(() => {
    const c = W.capsuleById.get("onnow");
    // A tee at tolerance 1, already worn since its wash, and planned again later.
    const tee = W.itemById.get("tee0");
    tee.last_washed = D(-5);
    W.wears.push({ id: "mt1", item_id: "tee0", worn_on: D(-1), context: ["Errands"], formality_for: 3 });
    W.kvData.set("pack:onnow", {
      built: D(-3), K: 2, pieces: ["tee0", "jea0", "snk0"],
      assign: { [D(1) + "#0"]: ["tee0", "jea0", "snk0"], [D(2) + "#0"]: ["tee0", "jea0", "snk0"] },
    });
    const m = W.packMidTripWash(c, W.todayStr());
    return m && m.items.some(i => i.id === "tee0")
      ? true : `plan=${m ? JSON.stringify(m.items.map(i => i.id)) : "null"}`;
  }));

  t("mid-trip wash plan says nothing on the last day", () => midTripCloset(() => {
    const c = W.capsuleById.get("onnow");
    const tee = W.itemById.get("tee0");
    tee.last_washed = D(-5);
    W.wears.push({ id: "mt2", item_id: "tee0", worn_on: D(-1), context: ["Errands"], formality_for: 3 });
    // ⚠️ The final day MUST carry an assignment with a dirty piece, or the
    // "no assignment → null" path answers instead of the guard and the case
    // passes without testing anything (found by mutation).
    W.kvData.set("pack:onnow", {
      built: D(-3), K: 2, pieces: ["tee0", "jea0", "snk0"],
      assign: { [D(3) + "#0"]: ["tee0", "jea0", "snk0"] },
    });
    const spoke = W.packMidTripWash(c, D(3));
    // Sanity: the same state one day earlier DOES speak, so the only difference
    // being tested is "is this the last day".
    const earlier = W.packMidTripWash(c, D(2));
    return spoke === null && earlier !== null
      ? true : `lastDay=${JSON.stringify(spoke && spoke.items.map(i => i.id))} dayBefore=${earlier ? "spoke" : "silent"}`;
  }));

  t("mid-trip wash plan stays quiet when nothing would run out", () => midTripCloset(() => {
    const c = W.capsuleById.get("onnow");
    // Everything freshly washed today — no reason to speak.
    for (const id of ["tee0", "jea0", "snk0"]) W.itemById.get(id).last_washed = W.todayStr();
    W.kvData.set("pack:onnow", {
      built: D(-3), K: 2, pieces: ["tee0", "jea0", "snk0"],
      assign: { [D(1) + "#0"]: ["tee0", "jea0", "snk0"] },
    });
    return W.packMidTripWash(c, W.todayStr()) === null
      ? true : `spoke anyway: ${JSON.stringify((W.packMidTripWash(c, W.todayStr()) || {}).list)}`;
  }));

  t("mid-trip wash plan is null outside the trip phase", () => midTripCloset(() => {
    const c = W.capsuleById.get("onnow");
    return W.packMidTripWash(c, D(-30)) === null ? true : "spoke before the trip";
  }));

  /* ⚠️ Found by rendering the trip dash and reading it: "🧼 Wash 1 piece · white
     tee" sat directly above "🧺 1 of 7 pieces in the hamper" — two rows for one
     fact. The wash-plan row is the actionable version, so the generic one folds
     when it adds nothing. */
  t("the generic hamper row folds when the wash plan already names everything dirty", () => midTripCloset(() => {
    const c = W.capsuleById.get("onnow");
    W.itemById.get("tee0").last_washed = D(-5);
    W.wears.push({ id: "mtf", item_id: "tee0", worn_on: D(-1), context: ["Errands"], formality_for: 3 });
    W.kvData.set("pack:onnow", {
      built: D(-3), K: 2, pieces: ["tee0", "jea0", "snk0"],
      assign: { [D(1) + "#0"]: ["tee0", "jea0", "snk0"], [D(2) + "#0"]: ["tee0", "jea0", "snk0"] },
    });
    const savedTrip = W.tripModeId;
    W.tripModeId = "onnow";
    let html = "";
    try { html = W.tripDashHtml(c); } finally { W.tripModeId = savedTrip; }
    const plan = (html.match(/data-td-washplan/g) || []).length;
    const generic = (html.match(/data-td-laundry/g) || []).length;
    return plan === 1 && generic === 0
      ? true : `washplanRows=${plan} genericHamperRows=${generic}`;
  }, { members: ["tee0", "jea0", "snk0"] }));

  /* ---- what the bag line says (r4) ----
     Stage B adds pieces purely to raise the option count. Those rows read
     "another option", which is true and unusable — §13 flagged it and nothing in
     the suite would have caught it, because no case read the copy. */
  t("a spare piece's why-line names the occasion it buys an option for", () => withPackCloset(() => {
    const c = packTrip(5);
    const i = W.itemById.get("blo0");
    const why = W.packWhyLine(i, undefined, c, new W.Set(["Work"]));
    return /spare option for Work/.test(why) && !/another option/.test(why)
      ? true : `why="${why}"`;
  }));

  t("a piece in no outfit at all says so rather than claiming to be an option", () => withPackCloset(() => {
    const c = packTrip(5);
    const why = W.packWhyLine(W.itemById.get("blo0"), undefined, c, null);
    return /not in any outfit/.test(why) ? true : `why="${why}"`;
  }));

  /* ⚠️ A far-out trip is packed against ERA5 normals, not a forecast, and has to
     say so where she reads the summary. The per-day chip's terse "avg" appears on
     every one of fifteen days, and a label repeated fifteen times is one she
     stops seeing (r19: the guess is fine, an unlabelled guess is not). */
  t("a beyond-forecast trip is labelled typical-for, never forecast", () => withPackCloset(() => {
    const c = W.capsuleById.get("farc");
    const savedWx = W._planWx, savedFor = W._planWxLoadedFor;
    const wx = {};
    for (const d of W.tripDates(c)) wx[d] = { maxT: 82, minT: 68, code: 0, hist: true, locName: "Javea" };
    W._planWx = wx; W._planWxLoadedFor = c.id;
    W.capsuleId = c.id; W.capsuleView = "pack"; W._packView = "days";
    let html = "";
    try { W.packLoadState(c.id); html = W.renderCapsulePack(); }
    finally { W._planWx = savedWx; W._planWxLoadedFor = savedFor; }
    // Must name it as normals AND disclaim explicitly. (Don't try to ban the
    // WORD "forecast" — the copy legitimately says "beyond the forecast range".)
    return /typical for/.test(html) && /not a forecast/.test(html)
      ? true : `missing typical-for/disclaimer (len=${html.length})`;
  }, {
    capsules: [{ id: "farc", name: "Javea", kind: "packing",
                 start_date: D(50), end_date: D(55),
                 locations: [{ name: "Javea", lat: 38.79, lon: 0.16 }], plan: {} }],
  }));

  t("packGrade stays silent until the trip has enough logged days", () => withPackCloset(() => {
    const c = { id: "old1", name: "T1", kind: "packing", start_date: "2026-05-01", end_date: "2026-05-05", locations: [] };
    return W.packGrade(c) === null ? true : `graded=${JSON.stringify(W.packGrade(c))}`;
  }, {
    capsules: [{ id: "old1", name: "T1", kind: "packing", start_date: "2026-05-01", end_date: "2026-05-05", locations: [] }],
    capsuleLinks: [{ capsule_id: "old1", item_id: "tee0" }],
    wears: (ws) => ws.push({ id: "g1", item_id: "tee0", worn_on: "2026-05-02", context: ["Errands"], formality_for: 3 }),
  }));

  /* ---- pack plan: persistence, consequences, capture (phases 2–4) ---- */
  t("pruneDayPlan keeps dates inside a dated capsule past the 30-day window", () => {
    // A September trip planned in July must survive. Without the exemption the
    // slate — and any fixed event she declared at booking — is silently deleted.
    const far = D(90), near = D(5), old = D(-40);
    const caps = [{ id: "t", start_date: D(88), end_date: D(95) }];
    const all = { [far]: [{ contexts: ["Wedding"] }], [near]: [{ contexts: ["Work"] }],
                  [old]: [{ contexts: ["Work"] }], [D(200)]: [{ contexts: ["Work"] }] };
    W.pruneDayPlan(all, today, caps);
    return eq(Object.keys(all).sort(), [near, far].sort());
  });

  t("a trip-window date is dropped once no capsule covers it", () => {
    const far = D(90);
    const all = { [far]: [{ contexts: ["Wedding"] }] };
    W.pruneDayPlan(all, today, []);
    return eq(Object.keys(all), []);
  });

  t("the pack screen reuses the stored solve instead of re-solving", () => withPackCloset(() => {
    // Inversion ③: reopening a trip must not hand her a different pack. The
    // record is the source of truth; only an explicit re-solve calls packSolve.
    const c = packTrip(5);
    W.capsules = [c]; W.buildCapsuleIndexes();
    const first = solveFor(c);
    const assign = {};
    for (const [k, cd] of first.res.assign) assign[k] = cd.ids;
    W.kvData.set("pack:" + c.id, { built: today, K: 2, pieces: first.res.pack, assign, unmet: [], locked: [], pinned: [] });
    W.capsuleId = c.id;
    const st = W.packLoadState(c.id);
    W.kvData.delete("pack:" + c.id);
    return st && eq(st.res.pack.slice().sort(), first.res.pack.slice().sort());
  }));

  t("dropping a piece breaks its days instead of silently re-solving", () => withPackCloset(() => {
    const c = packTrip(5);
    const { demand, res } = solveFor(c);
    const victim = res.pack.find(id => [...res.assign.values()].some(cd => cd.ids.includes(id)));
    const before = [...res.assign.keys()].length;
    // Simulate the drop the way packDropPiece does, then ask for consequences.
    const st = { cid: c.id, c, demand, res, rack: null, K: 2 };
    res.pack = res.pack.filter(id => id !== victim);
    const broken = demand.filter(o => { const cd = res.assign.get(o.id); return cd && cd.ids.includes(victim); });
    for (const o of broken) res.assign.delete(o.id);
    const cons = W.packConsequences(st);
    return broken.length > 0 && [...res.assign.keys()].length === before - broken.length
        && cons.broken.length === broken.length
      ? true : `broken=${broken.length} cons=${cons.broken.length}`;
  }));

  t("swap candidates only offer pieces that fit the slot and the level", () => withPackCloset(() => {
    const c = packTrip(5);
    const st = solveFor(c);
    const full = { cid: c.id, c, demand: st.demand, res: st.res, rack: st.rack, K: 2 };
    const occ = st.demand.find(o => st.res.assign.has(o.id) && o.level >= 4) || st.demand[0];
    const cd = st.res.assign.get(occ.id);
    if (!cd) return "no assignment to swap";
    const piece = cd.ids[0];
    const cands = W.packSwapCandidates(full, occ, cd, piece);
    const oldSlot = W.suggestSlot(W.itemById.get(piece));
    const bad = cands.filter(i => W.suggestSlot(i) !== oldSlot && !(oldSlot === "Outerwear" && W.isLayer(i)));
    const wrongLevel = cands.filter(i => !(W.itemFormalitySet(i) || []).includes(occ.level));
    return !bad.length && !wrongLevel.length && !cands.some(i => i.id === piece)
      ? true : `n=${cands.length} wrongSlot=${bad.length} wrongLevel=${wrongLevel.length}`;
  }));

  t("packSyncMembers never un-packs something already ticked", () => withPackCloset(() => {
    // It's physically in the bag. Removing it because the optimiser changed its
    // mind would be the app arguing with the suitcase.
    const c = packTrip(4);
    W.capsules = [c];
    W.capsuleLinks = [{ capsule_id: c.id, item_id: "ckt0", packed: true },
                      { capsule_id: c.id, item_id: "tee0", packed: false }];
    W.buildCapsuleIndexes();
    const links = W.capsuleLinkMap.get(c.id) || [];
    const packedAlready = new Set(links.filter(l => l.packed).map(l => l.item_id));
    const want = new Set(["tee1"]);
    const drop = links.map(l => l.item_id).filter(id => !want.has(id) && !packedAlready.has(id));
    return eq(drop, ["tee0"]);
  }));

  t("the character chip changes the occasion mix the slate is built from", () => withPackCloset(() => {
    const c = packTrip(7);
    const work = W.packOccasionSeed("work trip", {});
    const beach = W.packOccasionSeed("beach week", {});
    const wk = work.mix.map(e => e.context).join(",");
    const bk = beach.mix.map(e => e.context).join(",");
    return work.source === "seed" && wk !== bk ? true : `work=${wk} beach=${bk}`;
  }));

  t("packOccasionSeed prefers real trips once there are enough of them", () => withPackCloset(() => {
    const kinds = new Map([["old1", "work trip"], ["old2", "work trip"]]);
    const s = W.packOccasionSeed("work trip", { kinds, today });
    return s.source === "history" && s.trips === 2 && s.mix.some(e => e.context === "Symphony")
      ? true : `${JSON.stringify(s)}`;
  }, {
    capsules: [
      { id: "old1", name: "T1", kind: "packing", start_date: "2026-05-01", end_date: "2026-05-04", locations: [] },
      { id: "old2", name: "T2", kind: "packing", start_date: "2026-06-01", end_date: "2026-06-04", locations: [] },
    ],
    wears: (ws) => {
      for (const d of ["2026-05-01", "2026-05-02", "2026-06-01", "2026-06-02"])
        ws.push({ id: "h" + d, item_id: "blo0", worn_on: d, context: ["Symphony"], formality_for: 4 });
    },
  }));

  t("packDiff reports what moved since the pack was built", () => withPackCloset(() => {
    const c = packTrip(5);
    W.capsules = [c]; W.buildCapsuleIndexes();
    const b = W.itemById.get("blo0");
    b.last_washed = D(-9); b.laundry_state = "hamper";
    W.kvData.set("pack:" + c.id, { built: D(-2), K: 2, pieces: ["blo0", "jea0"], assign: {}, slateHash: 0 });
    const df = W.packDiff(c.id);
    W.kvData.delete("pack:" + c.id);
    return df && df.changed > 0 && df.nowDirty.includes("blo0")
      ? true : `${JSON.stringify(df)}`;
  }));

  t("packGrade counts what was worn against what was packed", () => withPackCloset(() => {
    const c = { id: "old1", name: "T1", kind: "packing", start_date: "2026-05-01", end_date: "2026-05-05", locations: [] };
    const g = W.packGrade(c);
    return g && g.suggested === 2 && g.worn === 1 && g.unpacked === 1 && g.loggedDays === 3
      ? true : `${JSON.stringify(g && { s: g.suggested, w: g.worn, u: g.unpacked, d: g.loggedDays })}`;
  }, {
    capsules: [{ id: "old1", name: "T1", kind: "packing", start_date: "2026-05-01", end_date: "2026-05-05", locations: [] }],
    capsuleLinks: [{ capsule_id: "old1", item_id: "tee0" }, { capsule_id: "old1", item_id: "ckt0" }],
    wears: (ws) => {
      ws.push({ id: "q1", item_id: "tee0", worn_on: "2026-05-01", context: ["Errands"], formality_for: 3 });
      ws.push({ id: "q2", item_id: "tee0", worn_on: "2026-05-02", context: ["Errands"], formality_for: 3 });
      ws.push({ id: "q3", item_id: "jea2", worn_on: "2026-05-03", context: ["Errands"], formality_for: 3 });
    },
  }));

  /* ⚠️ Found by rendering the screen and reading it: the bag line said "needs a
     wash mid-trip" for a tee used in two outfits on ONE day, while the schedule
     correctly reported no violation. A line that contradicts the warning above it
     is worse than no line. Both must count (item, DAY). */
  t("the why-line counts wear-DAYS, so it can't contradict the schedule", () => withPackCloset(() => {
    const tee = W.itemById.get("tee0");   // tolerance 1
    const oneDayTwice = { days: new Set([D(1)]), labels: new Set(["Friends", "Date Night"]) };
    const twoDays = { days: new Set([D(1), D(2)]), labels: new Set(["Friends"]) };
    const a = W.packWhyLine(tee, oneDayTwice, null);
    const b = W.packWhyLine(tee, twoDays, null);
    // And the schedule must agree with each.
    const sA = W.packSchedule([{ date: D(1), ids: ["tee0"] }, { date: D(1), ids: ["tee0"] }], { dates: [D(1)] });
    const sB = W.packSchedule([{ date: D(1), ids: ["tee0"] }, { date: D(2), ids: ["tee0"] }], { dates: [D(1), D(2)] });
    return !/wash/.test(a) && sA.violations.length === 0
        && /wash/.test(b) && sB.violations.length === 1
      ? true : `oneDay="${a}" (${sA.violations.length}) twoDays="${b}" (${sB.violations.length})`;
  }));

  t("the why-line stays quiet about laundry when it doesn't bind", () => withPackCloset(() => {
    const jean = W.itemById.get("jea0");  // tolerance 5
    const l = W.packWhyLine(jean, { days: new Set([D(1)]), labels: new Set(["Friends"]) }, null);
    return !/wash/.test(l) && !/of 5/.test(l) ? true : `"${l}"`;
  }));

  t("the character mix never stacks three occasions onto the travel day", () => withPackCloset(() => {
    const c = packTrip(8);
    const slate = W.packSlate(c, { mix: [{ context: "Friends", per: 0.4 }, { context: "Date Night", per: 0.2 }] });
    const worst = Math.max(...slate.map(s => s.occasions.length));
    return worst <= 2 ? true : `busiest day has ${worst} occasions: ${JSON.stringify(slate.map(s => s.occasions.length))}`;
  }));

  /* ⚠️ Also found by looking at the screen: Travel and Friends on the same day
     came out in the same clothes and rendered as two identical cards, which
     reads as a bug. dayplan already settles the semantics — "one outfit across
     contexts = one multi-context entry" — so they merge for display while the
     laundry and options math still sees both occasions. */
  const packDayFixture = (sameOutfit) => {
    const c = packTrip(3);
    const slate = [{ date: D(1), leg: null, occasions: [
      { context: "Travel", contexts: ["Travel"], level: 3, placed: true, source: "travel" },
      { context: "Friends", contexts: ["Friends"], level: 2, placed: false, source: "rhythm" }] }];
    const demand = W.packDemand(slate);
    const a = ["tee0", "jea0", "snk0"].sort();
    const b = ["tee1", "jea1", "snk1"].sort();
    const assign = new W.Map();
    demand.forEach((o, k) => {
      const ids = (sameOutfit || k === 0) ? a : b;
      assign.set(o.id, { ids, pieces: ids.map(x => W.itemById.get(x)).filter(Boolean), score: 0 });
    });
    const options = new W.Map();
    for (const o of demand) options.set(o.id, 3);
    return { cid: c.id, c, slate, demand, rack: { ids: [] }, K: 2,
             res: { pack: a.concat(b), assign, options, unmet: [], violations: [], stats: {} } };
  };

  t("same-day occasions in the same clothes render as ONE card, named for both", () => withPackCloset(() => {
    const html = W.packDaysHtml(packDayFixture(true));
    const cards = (html.match(/data-pack-reroll=/g) || []).length;
    return cards === 1 && /Travel \+ Friends/.test(html)
      ? true : `cards=${cards} labelled=${/Travel \+ Friends/.test(html)}`;
  }));

  t("same-day occasions in different clothes stay two cards", () => withPackCloset(() => {
    const html = W.packDaysHtml(packDayFixture(false));
    const cards = (html.match(/data-pack-reroll=/g) || []).length;
    return cards === 2 ? true : `cards=${cards}`;
  }));

  t("a merged card names the dressiest level it had to clear", () => withPackCloset(() => {
    // Travel is Casual (3), Friends Very Casual (2) — the outfit had to clear 3.
    const html = W.packDaysHtml(packDayFixture(true));
    return /Casual/.test(html) && !/Very Casual/.test(html)
      ? true : html.slice(html.indexOf("pack-occ-hd"), html.indexOf("pack-occ-hd") + 220);
  }));

  t("the options label is capped rather than printing a big number", () => {
    return eq([W.packOptLabel(0), W.packOptLabel(1), W.packOptLabel(3), W.packOptLabel(20)],
              ["", "", " · 3 options", " · plenty of options"]);
  });

  t("no js/ module reintroduces a hardcoded white", () => {
    // The redesign routed every literal through a token; a new #fff looks fine
    // while you're building and then glows on a dark screen.
    const src = window.__src || {};
    const bad = [];
    for (const path of Object.keys(src).filter(p => p.startsWith("js/21-pack"))) {
      const hits = [...src[path].matchAll(/#(?:fff|ffffff|f4f4f7|faf9f8)\b/gi)].map(m => m[0]);
      if (hits.length) bad.push(`${path}: ${hits.join(",")}`);
    }
    return !bad.length ? true : bad.join(" | ");
  });

  // ---- render summary ----
  await Promise.all(pending);
  const ul = document.getElementById("results");
  let pass = 0;
  for (const r of results) {
    const li = document.createElement("li");
    li.className = r.ok ? "pass" : "fail";
    li.textContent = (r.ok ? "✓ " : "✗ ") + r.name + (r.ok ? "" : " — " + r.msg);
    ul.appendChild(li);
    if (r.ok) pass++;
  }
  const sum = document.getElementById("summary");
  sum.textContent = `${pass}/${results.length} passed`;
  sum.className = pass === results.length ? "pass" : "fail";
  document.title = `${pass}/${results.length} — Wardrobe self-test`;
}
</script>
</body>
</html>
