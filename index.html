<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<meta name="app-version" content="2026-08-05 r10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wardrobe">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=2026-08-05%20r10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236b2737'/%3E%3Cg transform='translate(16 16.4) scale(0.62) translate(-12 -12)'%3E%3Cpath d='M8.2 2.4 3 5.6l2 4.4 2.2-1v12h9.6V9l2.2 1 2-4.4-5.2-3.2a3.3 3.3 0 0 1-7.6 0z' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
<title>Wardrobe</title>
<link rel="stylesheet" href="css/styles.css?v=2026-08-05%20r10">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<section id="login">
  <div class="box stack">
    <div class="center">
      <h1>Wardrobe</h1>
      <div class="muted">Sign in to your closet.</div>
    </div>
    <form id="loginForm" class="card stack" autocomplete="on">
      <div>
        <label class="fld" for="email">Email</label>
        <input class="inp" id="email" type="email" inputmode="email" autocomplete="username" required>
      </div>
      <div>
        <label class="fld" for="pw">Password</label>
        <input class="inp" id="pw" type="password" autocomplete="current-password" required>
      </div>
      <div id="loginErr" class="err" hidden></div>
      <button class="btn" id="loginBtn" type="submit">Sign in</button>
    </form>
    <div class="center muted" style="font-size:12px"><span class="appver"></span></div>
  </div>
</section>

<!-- ===================== APP ===================== -->
<div id="app" hidden>
  <header class="bar">
    <button id="headerAdd" class="addbtn" aria-label="Add item" hidden>＋</button>
    <h1 id="title">Wardrobe</h1>
    <button id="headerGear" class="gear" aria-label="Settings">⚙</button>
  </header>

  <main class="tabbody">
    <!-- HOME -->
    <section class="screen active" id="tab-home">
      <div id="homeBody"></div>
    </section>

    <!-- CLOSET -->
    <section class="screen" id="tab-closet">
      <div id="closetBody"></div>
    </section>

    <!-- LOOKS -->
    <section class="screen" id="tab-looks">
      <div id="looksBody"></div>
    </section>

    <!-- CALENDAR -->
    <section class="screen" id="tab-calendar">
      <div id="calendarBody"></div>
    </section>

    <!-- CAPSULES -->
    <section class="screen" id="tab-capsules">
      <div id="capsulesBody"></div>
    </section>

    <!-- STATS -->
    <section class="screen" id="tab-stats">
      <div id="statsBody"></div>
    </section>

    <!-- ADD / EDIT ITEM -->
    <section class="screen" id="tab-add">
      <div id="addBody"></div>
    </section>

    <!-- BUILD A LOOK (canvas) -->
    <section class="screen" id="tab-builder">
      <div id="builderBody"></div>
    </section>

    <!-- PLAN THE WEEK -->
    <section class="screen" id="tab-week">
      <div id="weekBody"></div>
    </section>

    <!-- SETTINGS -->
    <section class="screen" id="tab-settings">
      <div id="settingsBody"></div>
    </section>
  </main>

  <!-- grid action bar (shown only when a grid is visible in closet) -->
  <div id="gridBar" hidden>
    <div class="gb-acts">
      <button id="gbMove" title="Move to folder">
        <svg viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><path d="M3 7v13"/></svg>
      </button>
      <button id="gbEdit" title="Bulk edit">
        <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button id="gbDelete" title="Delete selected">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
      <button id="gbCapsule" title="Add to capsule">
        <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V5h6v3"/><path d="M12 11v6M9 14h6"/></svg>
      </button>
      <!-- Contextual laundry action — only in the Worn tray (→ hamper) and the
           Hamper (→ washed). updateGridBar swaps its icon/title per view. -->
      <button id="gbLaundry" hidden>
        <svg id="gbLaundryToHamper" viewBox="0 0 24 24"><path d="M4 8h16l-1.6 12H5.6z"/><path d="M9 8V5.5a3 3 0 0 1 6 0V8"/><path d="M9.5 12v4M14.5 12v4"/></svg>
        <svg id="gbLaundryWashed" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.7 2.8L16 9"/></svg>
      </button>
      <span id="gbCount" class="gb-count"></span>
    </div>
    <div class="gb-right" style="margin-left:auto">
      <button class="gb-filter" id="gbFilter" title="Filter" hidden>
        <svg viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
      </button>
      <button id="gbGrid" title="Grid density">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <div id="gridPickerPop" hidden>
        <button data-cols="2">2 per row</button>
        <button data-cols="3">3 per row</button>
        <button data-cols="4">4 per row</button>
        <button data-cols="5">5 per row</button>
      </div>
      <button id="gbAll" hidden>All</button>
      <button id="gbSelect">Select</button>
    </div>
  </div>

  <!-- bottom nav -->
  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg>
      Home
    </button>
    <button data-tab="closet">
      <svg viewBox="0 0 24 24"><path d="M12 3l-1.5 3L4 9v11h16V9l-6.5-3z"/><path d="M12 6v14"/></svg>
      Closet
    </button>
    <button data-tab="looks">
      <svg viewBox="0 0 24 24"><path d="M7 4l5 3 5-3 2 5-3 1v10H8V10L5 9z"/></svg>
      Looks
    </button>
    <button data-tab="calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      Calendar
    </button>
    <button data-tab="capsules">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V5h6v3"/></svg>
      Capsules
    </button>
    <button data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M3 18h4v-7H3z"/><path d="M10 18h4V5h-4z"/><path d="M17 18h4v-4h-4z"/></svg>
      Stats
    </button>
  </nav>
</div>

<div id="toast"></div>

<!-- ===== BULK EDIT SHEET ===== -->
<div id="bulkSheet" hidden>
  <div class="sheet-bg" id="bulkBg"></div>
  <div class="sheet" id="bulkInner"></div>
</div>

<!-- ===== MOVE-TO-FOLDER SHEET ===== -->
<div id="moveSheet" hidden>
  <div class="sheet-bg" id="moveBg"></div>
  <div class="sheet" id="moveInner"></div>
</div>

<!-- ===== QUICK ACTIONS SHEET (long-press tile) ===== -->
<div id="quickActSheet" hidden>
  <div class="sheet-bg" id="qaSheetBg"></div>
  <div class="sheet" id="qaSheetInner">
    <div class="sheet-hdr">
      <div style="width:60px"></div>
      <h2 id="qaTitle" style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px"></h2>
      <button class="lnk" id="qaCancel">Cancel</button>
    </div>
    <button class="qa-row" id="qaLog">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      Log today's wear
    </button>
    <button class="qa-row" id="qaLogDate">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01"/></svg>
      Log on a date…
    </button>
    <button class="qa-row" id="qaLook">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Add to a look
    </button>
    <button class="qa-row" id="qaMove">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Move to folder
    </button>
    <div style="height:max(env(safe-area-inset-bottom),16px)"></div>
  </div>
</div>

<!-- ===== ITEM ACTION BAR (photo view) ===== -->
<div id="itemBar" hidden>
  <button id="ibEdit" title="Details">
    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </button>
  <button id="ibMove" title="Move to folder">
    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
  </button>
  <button id="ibLog" title="Log wear">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01"/></svg>
  </button>
  <button id="ibDelete" class="danger" title="Delete">
    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
  </button>
</div>

<!-- ===== WHERE YOU'VE BEEN SHEET =====
     ⚠️ Declared BEFORE #fieldSheet on purpose. Every sheet wrapper is
     z-index 301, so DOM ORDER decides which one stacks on top. When this sat
     after #fieldSheet, tapping "Edit season" from inside it opened the field
     sheet UNDERNEATH — the button looked completely dead. Any sheet that
     hosts a field edit must be declared before #fieldSheet. -->
<div id="whereSheet" hidden>
  <div class="sheet-bg" id="whereBg"></div>
  <div class="sheet" id="whereInner" style="max-height:85vh;overflow-y:auto"></div>
</div>

<!-- ===== FIELD EDIT SHEET (stays last among sheets — see above) ===== -->
<div id="fieldSheet" hidden>
  <div class="sheet-bg" id="fieldBg"></div>
  <div class="sheet" id="fieldInner"></div>
</div>

<!-- ===== LOG WEAR SHEET ===== -->
<div id="logSheet" hidden>
  <div class="sheet-bg" id="logBg"></div>
  <div class="sheet" id="logInner"></div>
</div>

<!-- ===== STATS FILTER SHEET ===== -->
<div id="statsFilterSheet" hidden>
  <div class="sheet-bg" id="statsFilterBg"></div>
  <div class="sheet" id="statsFilterInner" style="max-height:80vh;overflow-y:auto"></div>
</div>

<!-- ===== UNIFIED FILTER SHEET ===== -->
<div id="filterSheet" hidden>
  <div class="sheet-bg" id="filterSheetBg"></div>
  <div class="sheet" id="filterSheetInner" style="max-height:85vh;overflow-y:auto"></div>
</div>

<div id="statsRangeSheet" hidden>
  <div class="sheet-bg" id="statsRangeBg"></div>
  <div class="sheet" id="statsRangeInner" style="max-height:80vh;overflow-y:auto"></div>
</div>

<script src="js/01-config.js?v=2026-08-05%20r10"></script>
<script src="js/02-api.js?v=2026-08-05%20r10"></script>

<script src="js/06-home.js?v=2026-08-05%20r10"></script>
<script src="js/07-closet.js?v=2026-08-05%20r10"></script>
<script src="js/08-trip-mode.js?v=2026-08-05%20r10"></script>
<script src="js/09-item-detail.js?v=2026-08-05%20r10"></script>
<script src="js/10-search.js?v=2026-08-05%20r10"></script>
<script src="js/11-add-item.js?v=2026-08-05%20r10"></script>
<script src="js/12-looks.js?v=2026-08-05%20r10"></script>
<script src="js/13-grid-bar.js?v=2026-08-05%20r10"></script>
<script src="js/14-calendar.js?v=2026-08-05%20r10"></script>
<script src="js/15-stats.js?v=2026-08-05%20r10"></script>
<script src="js/16-capsules.js?v=2026-08-05%20r10"></script>
<script src="js/17-builder.js?v=2026-08-05%20r10"></script>
<script src="js/18-weather.js?v=2026-08-05%20r10"></script>
<script src="js/19-wiring.js?v=2026-08-05%20r10"></script>
<script src="js/20-rack.js?v=2026-08-05%20r10"></script>
<script src="js/21-pack.js?v=2026-08-05%20r10"></script>
<script src="js/22-wear-detail.js?v=2026-08-05%20r10"></script>
<script src="js/23-boot.js?v=2026-08-05%20r10"></script>
</body>
