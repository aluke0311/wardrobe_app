<!DOCTYPE html>
<!-- Wardrobe app self-test harness (2026-07-18). NOT shipped — lives in
     migration/ like all tooling. Run it with the local preview server:
         http://localhost:4173/migration/selftest.html
     It loads the real app in an iframe (login screen is fine — these are
     pure-helper tests over mock state) and asserts the derivation logic that
     the app's correctness hangs on. Add a test here whenever a session's
     ad-hoc console verification proves something worth keeping true. -->
<html>
<head>
<meta charset="utf-8">
<title>Wardrobe self-test</title>
<style>
  body { font: 14px/1.5 -apple-system, sans-serif; margin: 24px; max-width: 720px; }
  h1 { font-size: 18px; }
  .pass { color: #2f9e5e; }
  .fail { color: #c0392b; font-weight: 700; }
  #summary { font-size: 16px; font-weight: 700; margin: 12px 0; }
  li { margin: 2px 0; }
  /* Off-screen rather than display:none. A display:none subtree has NO layout,
     so every getBoundingClientRect() inside it returns 0 and any layout
     assertion silently "passes" on zeros (2026-07-26). Parked off-screen at a
     realistic phone width, the app lays out normally and stays invisible. */
  iframe { position: absolute; left: -10000px; top: 0; width: 390px; height: 844px; border: 0; }
</style>
</head>
<body>
<h1>Wardrobe self-test</h1>
<div id="summary">Loading app…</div>
<ul id="results"></ul>
<iframe id="app"></iframe>
<script>
const results = [];
function t(name, fn) {
  try {
    const r = fn();
    if (r === true) results.push({ name, ok: true });
    else results.push({ name, ok: false, msg: JSON.stringify(r) });
  } catch (e) {
    results.push({ name, ok: false, msg: e.message });
  }
}
function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b) ? true : `${JSON.stringify(a)} ≠ ${JSON.stringify(b)}`; }
// Async variant of t(). Returns the promise so run() can await them all before
// rendering — an async assertion that lands after the summary is drawn would be
// silently dropped, which is the "test that can't fail" trap all over again.
const pending = [];
function ta(name, fn) {
  const p = (async () => {
    try {
      const r = await fn();
      results.push(r === true ? { name, ok: true } : { name, ok: false, msg: JSON.stringify(r) });
    } catch (e) { results.push({ name, ok: false, msg: e.message }); }
  })();
  pending.push(p);
  return p;
}

// The iframe src is set here, with a cache-bust, rather than in the markup:
// the preview server's browser caches index.html hard, and a fixed
// "?selftest=1" would let a green run be scored against a stale copy of the
// app. A gate that can pass on last deploy's code is worse than no gate.
//
// Since the 2026-07-25 split, busting index.html is NOT enough — it is 278
// lines of markup pointing at 21 sub-resources whose "?v=" only changes on
// deploy. Every edit made WITHOUT a version bump — i.e. every edit during a
// working session — keeps the same URL, so the iframe replays the cached copy
// and the suite scores code that is not on disk.
//
// ⚠️ Re-fetching each module with cache:"reload" does NOT fix this (it was the
// fix from 2026-07-25 and it is not sufficient — measured 2026-07-26: with a
// freshly edited js/14-calendar.js on disk and on the wire, the iframe still
// executed the previous copy). The iframe navigation does not necessarily
// consult the same cache entry the fetch refreshed.
//
// So don't rely on cache semantics at all: rewrite the markup to carry a
// per-run token on every js/ and css/ URL, and hand that to the iframe via
// srcdoc. A URL nothing has ever requested cannot be served from cache.
// srcdoc needs <base href="/"> — relative URLs would otherwise resolve against
// /migration/, and the app would silently load nothing.
const frameEl = document.getElementById("app");
frameEl.addEventListener("load", () => setTimeout(run, 300));

(async () => {
  const token = Date.now();
  try {
    const html = await (await fetch(`/index.html?_=${token}`, { cache: "reload" })).text();
    const srcs = [...html.matchAll(/(?:src|href)="((?:js|css)\/[^"]+)"/g)].map(m => m[1]);
    if (!srcs.length) throw new Error("no js/ or css/ tags found in index.html");
    // Keep the text so source-level invariants (icon vocabulary, banned
    // patterns) can be asserted synchronously inside run().
    // ⚠️ LEADING SLASH. This harness lives at /migration/selftest.html, so a
    // relative "js/01-config.js" resolves to /migration/js/01-config.js — a 404.
    // That is what the 2026-07-25 "re-fetch with cache:reload" fix actually did:
    // 21 silent 404s, refreshing nothing, which is why stale modules survived it
    // (found 2026-07-26). fetch() does not throw on 404, so it looked fine.
    window.__src = {};
    await Promise.all(srcs.map(async s => {
      const r = await fetch(`/${s}${s.includes("?") ? "&" : "?"}_=${token}`, { cache: "reload" });
      if (!r.ok) throw new Error(`${s} → HTTP ${r.status}`);
      window.__src[s.split("?")[0]] = await r.text();
    }));
    const busted = html
      .replace(/<head(\s[^>]*)?>/i, m => `${m}<base href="/">`)
      .replace(/((?:src|href)=")((?:js|css)\/[^"]+)(")/g,
               (m, a, u, b) => `${a}${u}${u.includes("?") ? "&" : "?"}_=${token}${b}`);
    if (!/<base href="\/">/.test(busted)) throw new Error("could not inject <base> — index.html has no <head>");
    frameEl.srcdoc = busted;
  } catch (e) {
    // Don't fail silently into a stale run — a fresh iframe is the whole point.
    document.getElementById("summary").textContent = `FAIL: could not refresh app sources — ${e.message}`;
  }
})();

async function run() {
  const frame = document.getElementById("app");
  // The app's globals are top-level const/let — lexical bindings, NOT
  // contentWindow properties. Inject a classic script (shares the page's
  // global lexical scope) exposing an eval bridge, wrapped in a Proxy so
  // tests can read/write app globals naturally as W.name.
  const doc = frame.contentDocument;
  const bridge = doc.createElement("script");
  bridge.textContent = `window.__app = new Proxy({}, {
    get(_, k) { if (k === "__isBridge") return true; try { return eval(k); } catch { return undefined; } },
    set(_, k, v) { window.__tmpv = v; try { eval(k + " = window.__tmpv"); } catch (e) { console.error(e); } return true; },
  });`;
  doc.body.appendChild(bridge);
  const W = frame.contentWindow.__app;
  if (!W || typeof W.todayStr !== "function") {
    document.getElementById("summary").textContent = "FAIL: app script did not parse (todayStr missing)";
    return;
  }
  const today = W.todayStr();
  const D = (n) => W.shiftDate(today, n);

  // ---- freshness (the gate's own gate) ----
  // Everything below is worthless if the iframe is executing a cached copy of
  // the app instead of what's on disk — that is not hypothetical, it happened
  // on 2026-07-26 and silently passed 129 cases against a stale module.
  // Function.prototype.toString() returns exact source text, so a live function
  // whose body isn't a substring of the freshly-fetched file proves the two
  // have diverged. Checks a handful per module, which is enough: staleness is
  // per-file, never per-function.
  t("the iframe is running the code on disk, not a cached copy", () => {
    const src = window.__src || {};
    const stale = [];
    for (const path of Object.keys(src).filter(p => p.endsWith(".js"))) {
      const names = [...src[path].matchAll(/^(?:async )?function (\w+)\s*\(/gm)]
        .map(m => m[1]).slice(0, 5);
      for (const n of names) {
        const fn = W[n];
        if (typeof fn !== "function") { stale.push(`${path}:${n} missing`); break; }
        if (!src[path].includes(fn.toString())) { stale.push(`${path}:${n} differs`); break; }
      }
    }
    return !stale.length ? true : `stale modules — ${JSON.stringify(stale)}`;
  });

  // ---- version lockstep (phantom update-toast guard) ----
  t("APP_VERSION matches <meta app-version>", () =>
    eq(W.APP_VERSION, W.document.querySelector('meta[name="app-version"]').content));
  // Since the split there are 21 more places the version lives: the "?v=" on
  // every js/ and css/ tag. Miss one and GitHub Pages happily serves a fresh
  // index.html beside a stale module — a half-updated app, which is worse than
  // an un-updated one. The deploy skill rewrites them with sed; this is what
  // stops a missed one from shipping.
  t("every js/ + css/ tag is cache-busted to the current APP_VERSION", () => {
    const want = W.APP_VERSION.replace(/\s+/g, "");
    const tags = [...W.document.querySelectorAll('script[src], link[rel="stylesheet"]')]
      .map(el => el.getAttribute("src") || el.getAttribute("href"))
      .filter(u => /^(js|css)\//.test(u));
    const wrong = tags.filter(u => new URLSearchParams(u.split("?")[1] || "").get("v") !== want);
    return tags.length >= 21 && !wrong.length
      ? true : `${tags.length} tags, want v=${want}, wrong: ${JSON.stringify(wrong)}`;
  });

  // ---- icon vocabulary (2026-07-26 audit C2) ----
  // ↻ used to mean three things — "wear again" (show me looks I already own) in
  // the calendar footer, "reshuffle" (generate a new combo) in the suggester,
  // and a per-piece swap — two of which are opposites. That's a recall tax on a
  // one-tap control, so the glyph was retired outright: ✨ is now the single
  // mark for "make something new", and history actions carry a plain word. The
  // weather refresh control is an inline SVG, so nothing legitimately needs ↻.
  t("↻ is retired — ✨ is the only 'make something new' glyph", () => {
    const src = window.__src || {};
    const files = Object.keys(src).filter(p => p.endsWith(".js"));
    const guilty = files.filter(p => src[p].includes("↻"));
    return files.length >= 20 && !guilty.length
      ? true : `${files.length} modules scanned, ↻ still in: ${JSON.stringify(guilty)}`;
  });

  // ---- full-width buttons (2026-07-26 audit H0) ----
  // A <button> sizes to its CONTENT regardless of `display`, so .log-cta — the
  // app's primary action — spent months rendering as a 181px stub in a 390px
  // column, and .logged-row (also laundry / backup / planned rows) at 259px.
  // Measured on detached nodes in a fixed-width host: no app state is touched,
  // so this can't perturb the fixtures the rest of the suite builds.
  t("Home's full-width buttons actually fill their column", () => {
    const d = W.document;
    const host = d.createElement("div");
    host.style.cssText = "width:390px;position:absolute;left:-9999px;top:0";
    const mk = cls => { const b = d.createElement("button"); b.className = cls; b.textContent = "x"; host.appendChild(b); return b; };
    const cta = mk("log-cta"), row = mk("logged-row");
    d.body.appendChild(host);
    const w = [cta.getBoundingClientRect().width, row.getBoundingClientRect().width].map(Math.round);
    host.remove();
    // 390 host − 2×16px side margins
    return w.every(x => x === 358) ? true : `got ${JSON.stringify(w)}, want [358,358] in a 390px column`;
  });

  // ---- sheet registry (2026-07-26 audit M5) ----
  // uiCanRefetch() suppresses the visibility-change refetch while any sheet is
  // open. It does that from a hand-maintained id list, so a NEW sheet wrapper
  // that nobody remembers to add gets its contents yanked out from under an
  // open edit. Cheap to assert, and it catches the whole class.
  t("uiCanRefetch names every sheet wrapper in index.html", () => {
    const wrappers = [...W.document.querySelectorAll('div[id$="Sheet"]')]
      .filter(d => d.querySelector(":scope > .sheet"))
      .map(d => d.id);
    const src = W.uiCanRefetch.toString();
    const missing = wrappers.filter(id => !src.includes(`"${id}"`));
    return wrappers.length >= 9 && !missing.length
      ? true : `wrappers=${JSON.stringify(wrappers)} missing=${JSON.stringify(missing)}`;
  });

  // ---- dates ----
  t("shiftDate crosses month boundaries", () =>
    eq([W.shiftDate("2026-07-01", -3), W.shiftDate("2026-07-31", 2)], ["2026-06-28", "2026-08-02"]));

  // ---- trip phases ----
  const trip = { start_date: "2026-07-16", end_date: "2026-07-20" };
  t("tripPhase: trip / pack / null / unpack / null", () =>
    eq([W.tripPhase(trip, "2026-07-18"), W.tripPhase(trip, "2026-07-14"), W.tripPhase(trip, "2026-07-12"),
        W.tripPhase(trip, "2026-07-22"), W.tripPhase(trip, "2026-07-28")],
       ["trip", "pack", null, "unpack", null]));
  t("tripPhase: undated capsule has no phases", () => eq(W.tripPhase({ start_date: null, end_date: null }), null));
  t("tripDayNum is 1-based", () => eq(W.tripDayNum(trip, "2026-07-18"), 3));

  // ---- sort keys ----
  t("gridSortKey maps legacy 'color' → 'category'", () => {
    const gsk = W._gridSortKeys;  // real object — mutate directly, not via the proxy
    gsk.closet = "color";
    const a = W.gridSortKey("closet");
    gsk.closet = "colorfam";
    const b = W.gridSortKey("closet");
    delete gsk.closet;
    return eq([a, b, W.gridSortKey("closet")], ["category", "colorfam", "category"]);
  });
  const mockSort = [
    { name: "b-tee", category: "Tops", subcategory: "Tee shirts", color_family: "Blue" },
    { name: "g-jean", category: "Bottoms", subcategory: "Jeans", color_family: "Green" },
    { name: "b-jean", category: "Bottoms", subcategory: "Jeans", color_family: "Blue" },
  ];
  t("colorfam = true color sort (spectrum, then category)", () =>
    eq(W.sortItems(mockSort, "colorfam").map(i => i.name), ["g-jean", "b-tee", "b-jean"]));
  t("category = composite (cat > sub > color)", () =>
    eq(W.sortItems(mockSort, "category").map(i => i.name), ["b-tee", "g-jean", "b-jean"]));

  // ---- filters ----
  t("clearFilterState empties every Set + q in place", () => {
    // Sets must come from the IFRAME's realm — instanceof is realm-specific.
    const S = W.Set;
    const st = { q: "hi", brand: new S(["X"]), color: new S(["Blue"]) };
    W.clearFilterState(st);
    return eq([st.q, st.brand.size, st.color.size], ["", 0, 0]);
  });

  // ---- laundry derivation ----
  function laundrySetup() {
    W.items = [{ id: "i1", name: "Tee", category: "Tops", subcategory: "Tee shirts", status: "Available",
                 last_washed: D(-10), laundry_state: null }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.wears = [];
  }
  t("null last_washed = clean (opt-in tracking)", () => {
    laundrySetup();
    W.items[0].last_washed = null;
    W.wears = [{ item_id: "i1", worn_on: D(-1) }, { item_id: "i1", worn_on: D(-2) }];
    return eq(W.isDirty(W.items[0]), false);
  });
  t("wears since wash ≥ tolerance ⇒ dirty (tee tolerance 1)", () => {
    laundrySetup();
    W.wears = [{ item_id: "i1", worn_on: D(-2) }];
    return eq(W.isDirty(W.items[0]), true);
  });
  t("'hamper' override forces dirty with zero wears", () => {
    laundrySetup();
    W.items[0].laundry_state = "hamper";
    return eq(W.isDirty(W.items[0]), true);
  });
  t("'extra:<n>' grants one more wear, expires on a newer wear-day", () => {
    laundrySetup();
    W.wears = [{ item_id: "i1", worn_on: D(-3) }];
    W.items[0].laundry_state = "extra:1";      // set when 1 wear-day existed
    const clean = W.isDirty(W.items[0]);
    W.wears.push({ item_id: "i1", worn_on: D(-1) });  // newer wear lands
    const dirty = W.isDirty(W.items[0]);
    return eq([clean, dirty], [false, true]);
  });
  t("shoes/outerwear never dirty (Infinity tolerance)", () => {
    W.items = [{ id: "s1", category: "Shoes", subcategory: "Sneakers", status: "Available", last_washed: D(-300), laundry_state: null }];
    W.itemById = new Map([["s1", W.items[0]]]);
    W.wears = Array.from({ length: 40 }, (_, k) => ({ item_id: "s1", worn_on: D(-k - 1) }));
    return eq(W.isDirty(W.items[0]), false);
  });
  // Laundry Control round (2026-07-22): D3 — per-item tolerance override tag.
  t("wearTolerance: tol:<n> tag beats subcat/category defaults", () => {
    const withTag = { category: "Bottoms", subcategory: "Jeans", tags: ["tol:2"] };
    const withoutTag = { category: "Bottoms", subcategory: "Jeans", tags: [] };
    return eq([W.wearTolerance(withTag), W.wearTolerance(withoutTag)], [2, 5]);
  });
  t("tolTagValue: absent/invalid tag = null (falls back to derived)", () => {
    return eq([W.tolTagValue({ tags: [] }), W.tolTagValue({ tags: ["tol:0"] }), W.tolTagValue({ tags: ["tol:3"] })],
              [null, null, 3]);
  });
  // A — planRewearFlags must reset its running count on a REAL wash stamp
  // (items.last_washed), not just the planned-laundry-day sentinel.
  t("planRewearFlags: real last_washed resets the trip rewear count", () => {
    const item = { id: "p1", name: "Shorts", category: "Bottoms", subcategory: "Shorts", tags: [] };
    W.items = [item];
    W.itemById = new Map([["p1", item]]);
    W.outfits = [{ id: "o1", name: "L" }];
    W.outfitById = new Map([["o1", W.outfits[0]]]);
    W.outfitItemMap = new Map([["o1", ["p1"]]]);
    const dates = [D(0), D(1), D(2)];
    const c = { id: "c1", plan: { [dates[0]]: ["o1"], [dates[1]]: ["o1"], [dates[2]]: ["o1"] } };
    item.last_washed = null;
    const noWashFlagged = !!W.planRewearFlags(c, dates).get(dates[2]);
    item.last_washed = dates[1];  // washed partway through the trip
    const washedFlagged = !!W.planRewearFlags(c, dates).get(dates[2]);
    return eq([noWashFlagged, washedFlagged], [true, false]);
  });

  // ---- formality ----
  t("matchesFormality reads the explicit level set", () => {
    // (formalityOk itself is a closure-local inside suggestOutfits — the
    // canonical global predicate is matchesFormality.)
    const it = { formality: [3, 5], name: "x", category: "Tops", subcategory: "Blouses" };
    return eq([W.matchesFormality(it, 3), W.matchesFormality(it, 5), W.matchesFormality(it, 4)],
              [true, true, false]);
  });
  t("deriveWearFormality: shared level wins", () => {
    W.items = [
      { id: "a", formality: [3, 4], category: "Tops", name: "x" },
      { id: "b", formality: [4, 5], category: "Bottoms", name: "y" },
    ];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    return eq(W.deriveWearFormality(["a", "b"]), 4);
  });

  // ---- looks ----
  t("itemSetKey is order-independent and dedups", () =>
    eq(W.itemSetKey(["b", "a", "b"]), W.itemSetKey(["a", "b"])));
  t("outfitFullyInCapsule requires every piece", () => {
    W.itemById = new Map([["a", { id: "a" }], ["b", { id: "b" }]]);
    W.outfitItemMap = new Map([["o1", ["a", "b"]], ["o2", ["a"]]]);
    W.capsuleLinkMap = new Map([["c1", [{ item_id: "a" }]]]);
    return eq([W.outfitFullyInCapsule({ id: "o1" }, "c1"), W.outfitFullyInCapsule({ id: "o2" }, "c1")], [false, true]);
  });

  // ---- contexts ----
  t("ctxArr handles null / string / array", () =>
    eq([W.ctxArr(null), W.ctxArr({ context: "Work" }), W.ctxArr({ context: ["a", "b"] })],
       [[], ["Work"], ["a", "b"]]));

  // ---- trip mode helpers ----
  function tripSetup() {
    const c = { id: "c1", name: "Trip", start_date: D(-2), end_date: D(4), plan: {} };
    W.capsules = [c];
    W.capsuleById = new Map([["c1", c]]);
    W.items = [{ id: "a", name: "A" }, { id: "b", name: "B" }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.capsuleLinks = [{ capsule_id: "c1", item_id: "a" }];
    W.capsuleLinkMap = new Map([["c1", W.capsuleLinks]]);
    return c;
  }
  t("tripWearContext stamps Travel only inside trip dates + mode", () => {
    tripSetup();
    W.tripModeId = "c1";
    const inRange = W.tripWearContext(today);
    const outRange = W.tripWearContext(D(30));
    W.tripModeId = null;
    const off = W.tripWearContext(today);
    return eq([inRange, outRange, off], [["Travel"], null, null]);
  });
  t("tripMissingPieces: member → null, non-member → offer", () => {
    tripSetup();
    W.tripModeId = "c1";
    const m1 = W.tripMissingPieces(["a"]);
    const m2 = W.tripMissingPieces(["a", "b"]);
    W.tripModeId = null;
    return eq([m1, m2 && m2.missing], [null, ["b"]]);
  });

  // ---- trip recap ----
  t("tripRecapData: worn/dead split, most-worn, repeated look", () => {
    const c = { id: "c1", name: "T", start_date: D(-8), end_date: D(-2) };
    W.capsuleById = new Map([["c1", c]]);
    W.items = [{ id: "a", name: "A" }, { id: "b", name: "B" }, { id: "c", name: "C" }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.capsuleLinkMap = new Map([["c1", ["a", "b", "c"].map(id => ({ capsule_id: "c1", item_id: id }))]]);
    W.outfits = [{ id: "o1", name: "L" }];
    W.outfitById = new Map([["o1", W.outfits[0]]]);
    W.wears = [
      { item_id: "a", worn_on: D(-7), outfit_id: "o1" },
      { item_id: "a", worn_on: D(-5), outfit_id: "o1" },
      { item_id: "b", worn_on: D(-5) },
      { item_id: "a", worn_on: D(30) },   // outside range — ignored
    ];
    const r = W.tripRecapData(c);
    return eq([r.worn.map(i => i.id), r.dead.map(i => i.id), r.mostWorn.id, r.mostN, r.topLook.id, r.topLookN, r.days],
              [["a", "b"], ["c"], "a", 2, "o1", 2, 7]);
  });

  // ---- trip retrospective + mid-trip unworn (2026-07-29) ----
  // Shared fixture: a 7-day trip that started 3 days ago and has 3 days left.
  const liveTrip = () => {
    const c = { id: "c9", name: "Live", start_date: D(-3), end_date: D(3) };
    W.capsuleById = new Map([["c9", c]]);
    const mk = (id, cat, sub) => ({ id, name: id, category: cat, subcategory: sub, status: "Available", tags: [] });
    W.items = [mk("t1", "Tops", "Blouses"), mk("t2", "Tops", "Tee shirts"), mk("b1", "Bottoms", "Jeans"),
               mk("s1", "Shoes", "Flats"), mk("x1", "Tops", "Sweaters")];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.capsuleLinkMap = new Map([["c9", ["t1", "t2", "b1", "s1"].map(id => ({ capsule_id: "c9", item_id: id }))]]);
    W.outfits = []; W.outfitById = new Map();
    W.wears = [
      { item_id: "t1", worn_on: D(-3) }, { item_id: "b1", worn_on: D(-3) },
      { item_id: "t1", worn_on: D(-2) }, { item_id: "b1", worn_on: D(-2) },
      { item_id: "t1", worn_on: D(-1) },
      { item_id: "x1", worn_on: D(-1) },  // worn, never packed
    ];
    return c;
  };

  t("tripRecapData: `through` bounds the window (mid-trip ≠ whole trip)", () => {
    const c = liveTrip();
    W.wears.push({ item_id: "t2", worn_on: D(2) });   // a FUTURE day inside the trip
    const mid = W.tripRecapData(c, { through: today });
    const all = W.tripRecapData(c);

  });
  t("buildRotationStats: per-item wear DAYS ride along for the drill-in", () => {
    const pool = [{ id: "a", status: "Available" }, { id: "b", status: "Available" }];
    const ws = [{ item_id: "a", worn_on: D(-5) }, { item_id: "a", worn_on: D(-5) },  // same day twice
                { item_id: "a", worn_on: D(-6) }];
    const r = W.buildRotationStats(90, pool, ws, today);
    return eq([r.counts.get("a"), r.wornIds.has("a"), r.wornIds.has("b"), r.pool.length],
              [2, true, false, 2]);
  });

  // ---- Round C: weather memory ----
  const wxFix = () => {
    // 3 past days: a near match, a far-too-cold day, and a wet day at the same temp.
    const log = {};
    log[D(-30)] = { maxT: 60, minT: 45, code: 0 };   // near match
    log[D(-40)] = { maxT: 20, minT: 5,  code: 0 };   // way off → cut
    log[D(-50)] = { maxT: 60, minT: 45, code: 61 };  // same temp, but raining
    log[D(-3)]  = { maxT: 60, minT: 45, code: 0 };   // too recent → excluded
    const dm = new Map([
      [D(-30), [{ item_id: "a", outfit_id: "o1", context: ["Church"] }]],
      [D(-40), [{ item_id: "b", outfit_id: "o2", context: [] }]],
      [D(-50), [{ item_id: "c", outfit_id: "o3", context: [] }]],
      [D(-3),  [{ item_id: "d", outfit_id: "o4", context: [] }]],
    ]);
    return { log, dayMap: dm, today, ranges: [] };
  };
  t("similarDays: ranks the closest day first and drops the far one", () => {
    const r = W.similarDays({ maxT: 62, minT: 47, code: 0 }, { ...wxFix() });
    return eq(r.map(d => d.date), [D(-30), D(-50)]);   // -40 over the cut, -3 too recent
  });
  t("similarDays: a wet/dry mismatch is penalised, not ignored", () => {
    const r = W.similarDays({ maxT: 60, minT: 45, code: 0 }, { ...wxFix() });
    return eq([r[0].date, r[0].score, r[1].score], [D(-30), 0, W.WX_WET_PENALTY]);
  });
  t("similarDays: nothing similar returns nothing (no stretch match)", () =>
    eq(W.similarDays({ maxT: 95, minT: 80, code: 0 }, { ...wxFix() }), []));
  t("similarDays: an away day we could NOT correct is excluded", () => {
    const f = wxFix();
    const away = [{ from: D(-31), to: D(-29), name: "Away", lat: 1, lon: 1 }];
    const r = W.similarDays({ maxT: 62, minT: 47, code: 0 }, { ...f, ranges: away });
    return eq(r.map(d => d.date), [D(-50)]);
  });
  t("similarDays: a CORRECTED away day counts, and carries its place", () => {
    const f = wxFix();
    f.log[D(-30)] = { maxT: 60, minT: 45, code: 0, away: 1, loc: "Castries, Saint Lucia" };
    const away = [{ from: D(-31), to: D(-29), name: "Castries, Saint Lucia", lat: 1, lon: 1 }];
    const r = W.similarDays({ maxT: 62, minT: 47, code: 0 }, { ...f, ranges: away });
    return eq([r.map(d => d.date), r[0].loc],
              [[D(-30), D(-50)], "Castries, Saint Lucia"]);
  });
  t("similarDays: contexts filter to matching days", () => {
    const r = W.similarDays({ maxT: 60, minT: 45, code: 0 }, { ...wxFix(), contexts: ["Church"] });
    return eq(r.map(d => d.date), [D(-30)]);
  });
  t("similarDays: one row per look (no four copies of the same outfit)", () => {
    const f = wxFix();
    f.dayMap.set(D(-31), [{ item_id: "a", outfit_id: "o1", context: [] }]);  // same look again
    f.log[D(-31)] = { maxT: 61, minT: 46, code: 0 };
    const r = W.similarDays({ maxT: 62, minT: 47, code: 0 }, f);
    return eq(r.filter(d => d.outfitId === "o1").length, 1);
  });
  t("itemWxProfile: stays quiet under the minimum, then reports a band", () => {
    const savedWears = W.wears;
    const log = {};
    const ds = [];
    for (let k = 0; k < 6; k++) { const d = D(-10 - k); ds.push(d); log[d] = { maxT: 50 + k * 4, minT: 40, code: 0 }; }
    W.wears = ds.map(d => ({ item_id: "x", worn_on: d }));
    const enough = W.itemWxProfile("x", log);
    W.wears = W.wears.slice(0, 3);
    const notEnough = W.itemWxProfile("x", log);
    W.wears = savedWears;
    // 10th/90th percentile of [50,54,58,62,66,70] — a trimmed band, not min/max.
    return eq([enough.n, enough.lo, enough.hi, notEnough], [6, 54, 70, null]);
  });
  t("wxlog window is wide enough to hold a backfill", () => W.WXLOG_DAYS >= 1000 || `${W.WXLOG_DAYS}`);

  // ---- Round C: milestones ----
  // milestoneFor reads app globals, so each case swaps them in and restores.
  // `best` parks the streak rung out of the way unless a case is testing it —
  // these fixtures use runs of consecutive days, which would otherwise trip it.
  const withMs = (its, ws, seen, fn, best = 9999) => {
    const sw = W.wears, si = W.items, sb = W.itemById,
          sk = W.kvData.get("milestones"), sbs = W.kvData.get("beststreak");
    W.items = its; W.itemById = new Map(its.map(i => [i.id, i])); W.wears = ws;
    W.kvData.set("milestones", seen || {});
    W.kvData.set("beststreak", best);
    try { return fn(); }
    finally {
      W.wears = sw; W.items = si; W.itemById = sb;
      W.kvData.set("milestones", sk || {}); W.kvData.set("beststreak", sbs || 0);
    }
  };
  const mItem = (over) => Object.assign({ id: "m1", name: "Linen shirt", category: "Tops",
    status: "Available", price: null, acquisition: "New" }, over || {});

  t("milestoneFor: first outing fires, then never again", () => {
    const rows = [{ item_id: "m1", worn_on: today }];
    const a = withMs([mItem()], rows, {}, () => W.milestoneFor(rows));
    const b = withMs([mItem()], rows, { "first:m1": today }, () => W.milestoneFor(rows));
    return eq([a.key, /First outing/.test(a.text), b], ["first:m1", true, null]);
  });
  t("milestoneFor: paid off fires only on the wear that crosses $1", () => {
    const ws = [];
    for (let k = 0; k < 30; k++) ws.push({ item_id: "m1", worn_on: D(-k) });
    const at30 = withMs([mItem({ price: 30 })], ws, {}, () => W.milestoneFor([{ item_id: "m1", worn_on: today }]));
    const at29 = withMs([mItem({ price: 30 })], ws.slice(1), {}, () => W.milestoneFor([{ item_id: "m1", worn_on: D(-1) }]));
    return eq([at30 && at30.key, at29], ["paidoff:m1", null]);
  });
  t("milestoneFor: a gift never gets a money milestone", () => {
    const ws = [];
    for (let k = 0; k < 30; k++) ws.push({ item_id: "m1", worn_on: D(-k) });
    const r = withMs([mItem({ price: 30, acquisition: "Gift" })], ws, {}, () => W.milestoneFor([{ item_id: "m1", worn_on: today }]));
    return eq(r, null);
  });
  t("milestoneFor: rescued after a long dormancy", () => {
    const ws = [{ item_id: "m1", worn_on: D(-400) }, { item_id: "m1", worn_on: today }];
    const r = withMs([mItem()], ws, {}, () => W.milestoneFor([{ item_id: "m1", worn_on: today }]));
    return eq([r && r.key.startsWith("rescued:m1:"), /back after/i.test(r.text)], [true, true]);
  });
  t("milestoneFor: round numbers land on 10 but not 11", () => {
    const mk = n => { const a = []; for (let k = 0; k < n; k++) a.push({ item_id: "m1", worn_on: D(-k) }); return a; };
    const at10 = withMs([mItem()], mk(10), {}, () => W.milestoneFor([{ item_id: "m1", worn_on: today }]));
    const at11 = withMs([mItem()], mk(11), {}, () => W.milestoneFor([{ item_id: "m1", worn_on: today }]));
    return eq([at10 && at10.key, at11], ["round:m1:10", null]);
  });
  t("milestoneFor: only one fires per log, highest rung wins", () => {
    const ws = [{ item_id: "m1", worn_on: today }];
    for (let k = 0; k < 10; k++) ws.push({ item_id: "m2", worn_on: D(-k) });
    const r = withMs([mItem(), mItem({ id: "m2", name: "Jeans" })], ws, {},
      () => W.milestoneFor([{ item_id: "m2", worn_on: today }, { item_id: "m1", worn_on: today }]));
    return eq(r && r.key, "first:m1");   // first outing outranks m2's 10th day
  });
  t("milestoneFor: a new best streak is the last rung, and needs 5+ days", () => {
    const mk = n => { const a = []; for (let k = 0; k < n; k++) a.push({ item_id: "m1", worn_on: D(-k) }); return a; };
    // 7 consecutive days, nothing else eligible (price null, 7 isn't a round number)
    const beats = withMs([mItem()], mk(7), {}, () => W.milestoneFor([{ item_id: "m1", worn_on: today }]), 3);
    const under = withMs([mItem()], mk(4), {}, () => W.milestoneFor([{ item_id: "m1", worn_on: today }]), 0);
    return eq([beats && beats.key, under], ["streak:7", null]);
  });

  // ---- Round C: weekly rhythm ----
  // 2026-07-25 is a Saturday, so these dates are pinned, not relative.
  const rhythmWears = [
    { worn_on: "2026-06-07", context: ["Church"] },   // Sundays
    { worn_on: "2026-06-14", context: ["Church"] },
    { worn_on: "2026-06-21", context: ["Church"] },
    { worn_on: "2026-06-28", context: ["Church", "Friends"] },
    { worn_on: "2026-06-02", context: ["Chorus"] },   // Tuesdays — only 2, under the floor
    { worn_on: "2026-06-09", context: ["Chorus"] },
  ];
  t("weeklyRhythm: a weekly habit surfaces, a twice-only one doesn't", () => {
    const r = W.weeklyRhythm(rhythmWears);
    return eq([r.get(0).contexts, r.get(0).n, r.has(2)], [["Church"], 4, false]);
  });
  t("weeklyRhythm: caps at two contexts per day, most frequent first", () => {
    const sundays = ["2026-06-07", "2026-06-14", "2026-06-21", "2026-06-28"];
    const ws = sundays.map(d => ({ worn_on: d, context: ["Church", "Brunch"] }));
    ws.push({ worn_on: sundays[0], context: ["Errands"] });   // 1 day only — under the floor
    ws.push({ worn_on: sundays[1], context: ["Errands"] });
    ws.push({ worn_on: sundays[2], context: ["Errands"] });   // now 3 days, but third-ranked
    const r = W.weeklyRhythm(ws);
    return eq(r.get(0).contexts, ["Brunch", "Church"]);       // 4 days each, alphabetical tiebreak
  });
  t("weeklyRhythm: same day of week counted once per date, not per piece", () => {
    const ws = [
      { worn_on: "2026-06-07", context: ["Church"] }, { worn_on: "2026-06-07", context: ["Church"] },
      { worn_on: "2026-06-14", context: ["Church"] }, { worn_on: "2026-06-21", context: ["Church"] },
    ];
    return eq(W.weeklyRhythm(ws).get(0).n, 3);   // 3 Sundays, not 4 rows
  });
  t("rhythmFor: picks the weekday of the given date", () => {
    const r = W.weeklyRhythm(rhythmWears);
    return eq([W.rhythmFor("2026-08-02", r).contexts, W.rhythmFor("2026-08-04", r)], [["Church"], null]);
  });

  // ---- Round C: closet keyword search ----
  const si = { id: "s1", name: "Linen Shirt", brand: "Everlane", retailer: "Nordstrom",
               category: "Tops", subcategory: "Blouses", color_family: "Blue",
               size: "M", notes: "gift from mum", tags: ["layer"] };
  t("itemMatchesText: matches across every searched field", () =>
    eq(["linen", "everlane", "nordstrom", "blouses", "blue", "mum", "layer"].map(q => W.itemMatchesText(si, q)),
       [true, true, true, true, true, true, true]));
  t("itemMatchesText: all terms must match, in any field", () =>
    eq([W.itemMatchesText(si, "blue linen"), W.itemMatchesText(si, "blue jeans")], [true, false]));
  t("itemMatchesText: case and whitespace insensitive; empty matches all", () =>
    eq([W.itemMatchesText(si, "  LINEN   sHiRt "), W.itemMatchesText(si, ""), W.itemMatchesText(si, "   ")],
       [true, true, true]));
  t("itemMatchesText: survives missing fields", () =>
    eq([W.itemMatchesText({ id: "x" }, "linen"), W.itemMatchesText({ id: "x" }, "")], [false, true]));

  // Mending was REMOVED in 2026-07-26 r8 (she dropped it when asked which of 12
  // features to cut), so its two cases went with it. The "mend" tag may still sit
  // on items in the live DB as an unread orphan; this asserts that is harmless —
  // such a piece is simply suggestible again, which is the point of removing it.
  t("a leftover 'mend' tag no longer hides a piece from suggestions", () => {
    const savedItems = W.items, savedById = W.itemById;
    W.items = [
      { id: "ok", name: "Tee", category: "Tops", subcategory: "Tee shirts", status: "Available", image_path: "a.jpg", tags: [] },
      { id: "torn", name: "Torn tee", category: "Tops", subcategory: "Tee shirts", status: "Available", image_path: "b.jpg", tags: ["mend"] },
    ];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    const pool = W.items.filter(i => i.image_path && !W.isNoSuggest(i));
    W.items = savedItems; W.itemById = savedById;
    return eq(pool.map(i => i.id), ["ok", "torn"]);
  });

  // ---- Round C: year in pixels ----
  t("pixelDayLevels: one entry per logged DAY of that year, not per wear row", () => {
    const savedWears = W.wears, savedItems = W.items, savedById = W.itemById;
    W.items = [{ id: "p1", category: "Tops", subcategory: "Tee shirts", formality: [3] },
               { id: "p2", category: "Bottoms", subcategory: "Jeans", formality: [3] }];
    W.itemById = new Map(W.items.map(i => [i.id, i]));

  // ---- Round C: taxonomy rename guard ----
  t("TAXONOMY_LOCKED_SUBCATS covers exactly the hard-keyed names", () => {
    const S = W.TAXONOMY_LOCKED_SUBCATS;
    return eq([S.has("Workout tops"), S.has("Sports bras"), S.has("Sneakers"), S.has("Coats"),
               S.has("Tee shirts"), S.has("Jeans")],

  t("LAUNDRY_LOADS is keyed on colour, so renames can't reach it", () => {
    const fams = Object.values(W.LAUNDRY_LOADS).flat();
    // every value is a colour family, never a subcategory
    return eq([fams.includes("White"), fams.includes("Blue"), fams.includes("Jeans")],
              [true, true, false]);

  // ---- Palette: colours owned vs colours worn ----
  const palPool = [
    { id: "b1", color_family: "Black", status: "Available" },
    { id: "b2", color_family: "Black", status: "Available" },
    { id: "g1", color_family: "Beige", status: "Available" },
    { id: "g2", color_family: "Beige", status: "Available" },
    { id: "n1", status: "Available" },                        // no colour set
  ];
  t("buildPaletteStats: counts PIECE-DAYS, not wear rows and not wear days", () => {
    // one day, two black pieces → 2 black piece-days (a per-item closet share
    // has to be compared against a per-item wear share)
    const ws = [{ item_id: "b1", worn_on: "2026-06-01" }, { item_id: "b2", worn_on: "2026-06-01" },
                { item_id: "b1", worn_on: "2026-06-01" }];   // duplicate row, must not double
    const r = W.buildPaletteStats(palPool, ws);
    const black = r.rows.find(x => x.color === "Black");
    return eq([black.pieceDays, r.totalWorn], [2, 2]);
  });
  t("buildPaletteStats: colourless pieces are excluded from both sides", () => {
    const r = W.buildPaletteStats(palPool, [{ item_id: "n1", worn_on: "2026-06-01" }]);
    return eq([r.totalOwned, r.totalWorn, r.rows.length], [4, 0, 2]);
  });
  t("buildPaletteStats: own-heavy vs wear-heavy colours sort by the gap", () => {
    const ws = [{ item_id: "b1", worn_on: "2026-06-01" }, { item_id: "b2", worn_on: "2026-06-02" },
                { item_id: "b1", worn_on: "2026-06-03" }, { item_id: "g1", worn_on: "2026-06-04" }];
    const r = W.buildPaletteStats(palPool, ws);
    // Black: owns 50%, wears 75% → over. Beige: owns 50%, wears 25% → under.
    return eq([r.rows[0].color, r.rows[0].delta > 0, r.rows[1].color, r.rows[1].delta < 0,
               r.topOwned[0], r.topWorn[0]],
              ["Black", true, "Beige", true, "Black", "Black"]);
  });
  t("buildPaletteStats: a never-worn colour still appears, at zero", () => {
    const r = W.buildPaletteStats(palPool, [{ item_id: "b1", worn_on: "2026-06-01" }]);
    const beige = r.rows.find(x => x.color === "Beige");
    return eq([beige.pieceDays, beige.wearShare, beige.index], [0, 0, 0]);
  });

  // ---- What's missing: thin spots + mileage ----
  t("buildThinSpots: a context is only as served as its THINNEST slot", () => {
    const pool = [
      { id: "t1", category: "Tops", formality: [6], status: "Available", tags: [] },

      { id: "p2", category: "Bottoms", formality: [6], status: "Available", tags: [] },
      { id: "s1", category: "Shoes", formality: [6], status: "Available", tags: [] },

    const r = W.buildThinSpots(pool, ws);
    const gala = r.find(x => x.ctx === "Gala");

    return eq([gala.thinnest.slot, gala.thinnest.n, gala.slots.Tops, gala.slots.Bottoms],
              ["Shoes", 1, 3, 2]);
  });
  t("buildThinSpots: a dress counts toward both top and bottom", () => {
    const pool = [
      { id: "d1", category: "Dresses", formality: [6], status: "Available", tags: [] },
      { id: "s1", category: "Shoes", formality: [6], status: "Available", tags: [] },
      { id: "s2", category: "Shoes", formality: [6], status: "Available", tags: [] },
    ];
    const ws = [];
    for (let k = 0; k < 6; k++) ws.push({ item_id: "d1", worn_on: D(-k), context: ["Gala"], formality_for: 6 });
    const g = W.buildThinSpots(pool, ws).find(x => x.ctx === "Gala");
    return g ? eq([g.slots.Tops, g.slots.Bottoms, g.slots.Shoes], [1, 1, 2]) : "Gala row missing";
  });
  t("buildMileage: sorts by wear DAYS and honours the floor", () => {
    const savedWears = W.wears;
    const pool = [{ id: "hi", name: "Jeans", price: 100 }, { id: "lo", name: "Blazer" }];
    const ws = [];
    for (let k = 0; k < 40; k++) ws.push({ item_id: "hi", worn_on: D(-k) });
    ws.push({ item_id: "hi", worn_on: D(-1) });      // duplicate row — must not count twice
    for (let k = 0; k < 3; k++) ws.push({ item_id: "lo", worn_on: D(-k) });
    W.wears = ws;
    const r = W.buildMileage(pool);
    W.wears = savedWears;
    return eq([r.length, r[0].item.id, r[0].days, r[0].cpw], [1, "hi", 40, 2.5]);
  });

  // ---- stats back-nav + the "no lying funnel" rule ----
  // `statsNavBack` picks a return target and THEN re-renders it. Only the pick
  // is under test here, so the render is stubbed out: with no signed-in data the
  // destination pages have nothing to draw, and `renderStatsReportDetailPage`
  // legitimately bounces an empty group back to "report" — which would report a
  // green nav bug as a red one. Restored in a finally, or every later test that
  // renders goes silently blind.
  function navBackFrom(flags) {
    const saved = { sv: W.statsView, fp: W.statsFromPalette, ff: W.statsFromField, fr: W.statsFromReport };
    const realRender = W.renderStats;
    W.renderStats = () => {};
    try {
      W.statsView = "grid";
      W.statsFromReport = !!flags.report;
      W.statsFromPalette = !!flags.palette;
      W.statsFromField = !!flags.field;
      W.statsNavBack();
      return { view: W.statsView, palette: W.statsFromPalette };
    } finally {
      W.renderStats = realRender;
      W.statsView = saved.sv; W.statsFromPalette = saved.fp;
      W.statsFromField = saved.ff; W.statsFromReport = saved.fr;
    }
  }
  t("statsNavBack: a grid entered from Palette returns to Palette, not main", () => {
    const r = navBackFrom({ palette: true });
    return eq([r.view, r.palette], ["palette", false]);
  });
  t("statsNavBack: report and field drill-ins still win over the palette flag", () =>
    eq([navBackFrom({ report: true }).view, navBackFrom({ field: true }).view],
       ["report-detail", "field"]));
  t("buildThinSpots/buildMileage default to the full Available closet", () => {
    // The page hides the funnel, so its numbers must not depend on statsFilter.
    const savedItems = W.items, savedById = W.itemById, savedWears = W.wears;
    W.items = [
      { id: "a", category: "Shoes", formality: [6], status: "Available", tags: [] },
      { id: "b", category: "Shoes", formality: [6], status: "Storage", tags: [] },
      { id: "c", category: "Shoes", formality: [6], status: "Archive", tags: [] },
    ];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.wears = [];
    const ws = [];
    for (let k = 0; k < 6; k++) ws.push({ item_id: "a", worn_on: D(-k), context: ["Gala"], formality_for: 6 });
    const g = W.buildThinSpots(null, ws).find(x => x.ctx === "Gala");
    W.items = savedItems; W.itemById = savedById; W.wears = savedWears;
    return g ? eq(g.slots.Shoes, 1) : "Gala row missing";   // Storage + Archive excluded
  });

  // ---- Round D: where you were (season × weather truth) ----
  // A synthetic home climate: 20 days per season at that season's typical
  // high, so the derived bands are predictable without depending on her data.
  const bandLog = () => {
    const log = {};
    const anchor = { Winter: ["2026-01-", 25], Spring: ["2026-04-", 58],
                     Summer: ["2026-07-", 82], Fall: ["2026-10-", 55] };
    for (const [, [pre, base]] of Object.entries(anchor))
      for (let k = 1; k <= 20; k++)
        log[pre + String(k).padStart(2, "0")] = { maxT: base + (k % 5) - 2, minT: base - 15, code: 0 };
    return log;
  };
  t("seasonBands: percentiles per season, and a thin season has no opinion", () => {
    const log = bandLog();
    delete log["2026-01-20"];           // still 19 — above the floor
    const b = W.seasonBands(log);
    const thin = {}; for (let k = 1; k <= 5; k++) thin["2026-01-0" + k] = { maxT: 20, minT: 5, code: 0 };
    return eq([b.Summer.p10 <= 80, b.Summer.p90 >= 83, b.Winter.median <= 27,
               W.seasonBands(thin).Winter],
              [true, true, true, null]);
  });
  t("seasonBands ignores away days (they describe somewhere else)", () => {
    const log = bandLog();
    for (let k = 1; k <= 20; k++) log["2026-01-" + String(k).padStart(2, "0")].away = 1;
    return eq(W.seasonBands(log).Winter, null);   // every winter day now away
  });
  t("effectiveSeasonOf: an away December day at 85° counts as Summer", () => {
    const log = bandLog();
    log["2025-12-24"] = { maxT: 85, minT: 76, code: 0, away: 1, loc: "Castries" };
    log["2025-12-25"] = { maxT: 24, minT: 10, code: 0 };   // home, same week
    return eq([W.effectiveSeasonOf("2025-12-24", log), W.effectiveSeasonOf("2025-12-25", log)],
              ["Summer", "Winter"]);
  });
  t("effectiveSeasonOf falls back to the calendar with no usable bands", () => {
    const log = { "2025-12-24": { maxT: 85, minT: 76, code: 0, away: 1 } };
    return eq(W.effectiveSeasonOf("2025-12-24", log), "Winter");
  });
  t("itemSeasonSet: warm-trip wears derive Summer, not Winter", () => {
    const log = bandLog();
    const ds = [];
    for (let k = 20; k <= 26; k++) {
      const d = `2025-12-${k}`;
      ds.push(d); log[d] = { maxT: 84, minT: 75, code: 0, away: 1, loc: "Castries" };
    }
    const rows = ds.map(d => ({ item_id: "sd", worn_on: d }));
    const i = { id: "sd", name: "Sundress", category: "Dresses", season: null };
    return eq(W.itemSeasonSet(i, rows, log), ["Summer"]);

  t("itemSeasonSet: an explicit season still wins over derivation", () => {
    const log = bandLog();
    const i = { id: "sd", name: "Sundress", season: ["Winter"] };
    return eq(W.itemSeasonSet(i, [], log), ["Winter"]);
  });

  t("mergeWxDays: an away fetch overwrites even inside the forecast guard", () => {
    const t0 = today, keep = D(-15);
    const home = { [D(-2)]: { maxT: 70, minT: 55, code: 0 } };
    const guarded = W.mergeWxDays(home, { [D(-2)]: { maxT: 99, minT: 80, code: 0 } },
      { today: t0, keepAfter: keep });
    const away = W.mergeWxDays(home, { [D(-2)]: { maxT: 84, minT: 76, code: 0 } },
      { today: t0, keepAfter: keep, away: true, loc: "Castries" });
    return eq([guarded.log[D(-2)].maxT, guarded.n, away.log[D(-2)].maxT,
               away.log[D(-2)].away, away.log[D(-2)].loc],
              [70, 0, 84, 1, "Castries"]);
  });
  t("mergeWxDays: future days and pre-floor days are dropped", () => {
    const r = W.mergeWxDays({ [D(-900)]: { maxT: 1, minT: 1, code: 0 } },
      { [D(1)]: { maxT: 70, minT: 50, code: 0 }, [D(-2)]: { maxT: 70, minT: 50, code: 0 } },
      { today, floor: D(-400) });
    return eq([r.n, r.log[D(1)], r.log[D(-900)], !!r.log[D(-2)]], [1, undefined, undefined, true]);
  });

  t("awayRanges: a dated trip's locations become ranges; undated ones don't", () => {
    const caps = [
      { id: "c1", name: "Island", start_date: "2025-12-20", end_date: "2025-12-27",
        locations: [{ name: "Castries", lat: 14, lon: -60, from: null, to: null }] },
      { id: "c2", name: "Vague", start_date: "2025-11-01", end_date: "2025-11-05",
        locations: [{ name: "A", lat: 1, lon: 1 }, { name: "B", lat: 2, lon: 2 }] },

    const r = W.awayRanges([{ from: "2024-03-01", to: "2024-03-08", name: "Rome", lat: 41, lon: 12 }], caps);
    return eq(r.map(x => [x.name, x.from, x.to, x.src]),
              [["Castries", "2025-12-20", "2025-12-27", "trip"],
               ["Rome", "2024-03-01", "2024-03-08", "log"]]);
  });

  /* ---- Round D.4: the ONE flag criterion ----
     Everything that tested the guessing layer (day anomalies, clustering, trip
     guesses, home marks, per-day culprits, the margin-based temp test) was
     deleted with the code it covered. The case count DROPS here, on purpose.
     What remains is her criterion: a piece's commonly-worn range vs the general
     range of each season it claims. Overlap with any = no flag. */
  const auditFix = (over) => {
    const log = bandLog();
    const days = [];
    for (let k = 1; k <= 8; k++) {                    // 8 July days at 82° (home summer)
      const d = `2026-07-${String(k).padStart(2, "0")}`;
      days.push(d); log[d] = { maxT: 82, minT: 68, code: 0 };
    }
    const item = Object.assign({ id: "w1", name: "Wool coat", season: ["Winter"],
      status: "Available", image_path: "" }, over || {});
    return { log, days, item, rows: days.map(d => ({ item_id: "w1", worn_on: d })) };
  };
  const flagsOf = (f, over) => W.buildSeasonWxFlags(
    Object.assign({ pool: [f.item], wearRows: f.rows, log: f.log, dismissed: {} }, over || {}));

  t("pieceCommonRange is the middle half, so one freak day can't define it", () => {
    const log = {};
    const rows = [];
    for (let k = 1; k <= 9; k++) {
      const d = `2026-07-0${k}`;
      log[d] = { maxT: k === 1 ? 20 : 80 + k, minT: 60, code: 0 };   // one 20° outlier
      rows.push({ item_id: "x", worn_on: d });
    }
    const c = W.pieceCommonRange("x", log, rows);
    return eq([c.n, c.lo >= 80, c.hi <= 90], [9, true, true]);
  });
  t("pieceCommonRange stays null under the wear floor", () => {
    const log = { "2026-07-01": { maxT: 80, minT: 60, code: 0 } };
    return eq(W.pieceCommonRange("x", log, [{ item_id: "x", worn_on: "2026-07-01" }]), null);
  });

  t("worn far hotter than every claimed season → flagged, with the fix", () => {
    const r = flagsOf(auditFix());                    // tagged Winter, worn at 82°
    return eq([r.length, r[0].dir, r[0].missing, r[0].id], [1, "hot", ["Summer"], "w1"]);
  });
  t("worn far colder than every claimed season → flagged", () => {
    const f = auditFix({ season: ["Summer"] });
    const log = f.log, days = [];

  t("OVERLAP WITH ANY TAGGED SEASON = no flag (the unactionable-flag killer)", () => {
    // Tagged Winter AND Summer, worn hot. Summer overlaps, so there is nothing

    return eq(flagsOf(auditFix({ season: ["Winter", "Summer"] })).length, 0);

  t("a piece worn at the mild end of its own season isn't flagged", () => {
    // Tagged Winter, worn on the warmer winter days. Its common range still

    const log = {};

    const days = [];
    for (let k = 24; k <= 30; k++) days.push(`2026-01-${k}`);

    const r = W.buildSeasonWxFlags({ pool: [item], wearRows: days.map(d => ({ item_id: "wc", worn_on: d })),
      log, dismissed: {} });
    return eq(r.length, 0);
  });
  t("a right-season item is left alone", () =>
    eq(flagsOf(auditFix({ season: ["Summer"] })).length, 0));
  t("no explicit season = nothing to contradict", () =>
    eq(flagsOf(auditFix({ season: null })).length, 0));
  t("under the wear floor it stays quiet", () => {
    const f = auditFix();
    return eq(W.buildSeasonWxFlags({ pool: [f.item], wearRows: f.rows.slice(0, 3), log: f.log, dismissed: {} }).length, 0);
  });
  t("no usable band for any claimed season = no opinion", () => {
    const f = auditFix();
    return eq(W.buildSeasonWxFlags({ pool: [f.item], wearRows: f.rows, log: f.log,
      bands: { Winter: null, Spring: null, Summer: null, Fall: null }, dismissed: {} }).length, 0);

  t("no proposable season = no flag", () => {

    return eq(r.length, 0);

  t("dismissal holds until the season is edited", () => {

    const back = flagsOf(f, { dismissed: { w1: JSON.stringify(["Fall"]) } });
    return eq([off.length, back.length], [0, 1]);

  t("the flag sentence carries evidence AND the proposal", () => {
    const txt = W.wxFlagText(flagsOf(auditFix())[0]);
    return eq([/Commonly worn/.test(txt), /generally runs/.test(txt), /Summer weather here/.test(txt)],
              [true, true, true]);

  t("a piece sitting in the gap between two claimed seasons reads 'between'", () => {

    const item = { id: "g1", name: "Trench", season: ["Winter", "Summer"], status: "Available", image_path: "" };
    const r = W.buildSeasonWxFlags({ pool: [item], wearRows: days.map(d => ({ item_id: "g1", worn_on: d })),
      log, dismissed: {} });

  /* ---- Round D.4: derived season available for EVERY item ----

              [true, ["Summer"], false, false, ["Summer"]]);

  t("the review row's one-tap answer ADDS and never deletes a chosen season", () => {
    // Tagged Winter+Summer but only ever worn cold: accepting must keep Summer.
    // Deleting a season she deliberately chose is not something a one-tap

    const savedWears = W.wears, savedKv = W.kvData.get("wxlog");

    const guess = row.guess({ id: "d5", season: ["Winter", "Summer"] });
    W.wears = savedWears;
    if (savedKv === undefined) W.kvData.delete("wxlog"); else W.kvData.set("wxlog", savedKv);
    return eq([narrow, widen, guess, row.saveKey],
              [["Summer", "Winter"], ["Summer", "Winter"], ["Summer", "Winter"], "season"]);
  });

  /* ---- Round D.4: a location answer must be reversible ----
     Deleting a logged trip used to leave its days flagged `away` carrying
     another climate's temperatures — the correction outliving the answer. */
  t("reverting an away range restores home weather and drops the away flag", () => {
    const today = W.todayStr();
    const d = W.shiftDate(today, -100);
    const home = { [d]: { maxT: 25, minT: 12, code: 0 } };
    const away = W.mergeWxDays(home, { [d]: { maxT: 84, minT: 75, code: 0 } },
      { today, away: true, loc: "Castries" }).log;
    const back = W.mergeWxDays(away, { [d]: { maxT: 25, minT: 12, code: 0 } }, { today }).log;
    return eq([away[d].away, away[d].loc, back[d].maxT, back[d].away], [1, "Castries", 25, undefined]);
  });
  t("a surviving overlapping range re-applies after a revert", () => {
    const today = W.todayStr();
    const d = W.shiftDate(today, -100);
    let log = { [d]: { maxT: 25, minT: 12, code: 0 } };
    log = W.mergeWxDays(log, { [d]: { maxT: 84, minT: 75, code: 0 } }, { today, away: true, loc: "A" }).log;
    log = W.mergeWxDays(log, { [d]: { maxT: 25, minT: 12, code: 0 } }, { today }).log;        // revert
    log = W.mergeWxDays(log, { [d]: { maxT: 79, minT: 70, code: 0 } }, { today, away: true, loc: "B" }).log;
    return eq([log[d].maxT, log[d].away, log[d].loc], [79, 1, "B"]);
  });


  // ---- Round D: temperature-eligible rescue ----
  t("inSeasonWx rescues an out-of-season piece the forecast actually fits", () => {
    const savedWears = W.wears;

    const ds = [];
    for (let k = 0; k < 6; k++) { const d = D(-10 - k); ds.push(d); log[d] = { maxT: 82, minT: 70, code: 0 }; }
    W.wears = ds.map(d => ({ item_id: "sd", worn_on: d }));

    return eq([W.inSeasonWx(i, "Winter", { maxT: 95, minT: 80, code: 0 }), W.inSeasonWx(i, "Winter", null)],
              [true, true]);
  });

  // ---- memoised effectiveArchived (2026-07-26 r11) ----
  // The memo is only safe if every optimistic mutation invalidates it. These
  // pin the two that don't go through buildOutfitIndexes().
  t("effectiveArchived: derived from pieces, and the memo tracks a status change", () => {
    const saved = { items: W.items, outfits: W.outfits, outfitLinks: W.outfitLinks };

    W.buildOutfitIndexes();

  // ---- workout never uses the rack (2026-07-26 r12, user-reported) ----
  // "if i want to go on a run, that doesn't build". buildRack excludes the
  // Workout category on purpose ("those clothes don't really mix with the rest
  // of my clothing"), so filtering the rack by isWorkoutGear left only whatever
  // gear-tagged pieces happen to live OUTSIDE that category — running shoes —
  // i.e. a pool that can never form an outfit.
  const withGearCloset = (fn) => {
    const saved = { items: W.items, wears: W.wears, outfits: W.outfits, outfitLinks: W.outfitLinks,
                    sugg: W._sugg, cap: W.activeCapsuleId, trip: W.tripModeId, ready: W.dataReady,
                    caps: W.capsules, links: W.capsuleLinks, rack: W.kvData.get("rack") };
    const mk = (id, c, sub, tags) => ({ id, name: id, category: c, subcategory: sub, status: "Available",
      image_path: id + ".jpg", color_family: "Blue", formality: c === "Workout" ? [1] : [2, 3],
      season: ["Spring", "Summer", "Fall", "Winter"], tags: tags || [] });
    W.items = [];
    for (let n = 0; n < 30; n++) { W.items.push(mk("tp" + n, "Tops", "Tee shirts"));

  // ---- kv concurrent-write safety (2026-07-26 audit H2) ----
  // Every kv key is one JSONB blob rewritten whole, so a plain last-write-wins
  // upsert silently destroys the other device's edit. kvUpdate re-applies the
  // caller's mutation on top of the server's value when they've diverged.
  // These stub rest() so no network is touched.
  // ⚠️ These MUST be awaited one at a time (note the `await ta(...)` below):
  // they all replace the same global rest(), so running them concurrently makes
  // each one observe the others' stubs. First written without it and all three
  // failed with cross-talk (calls=4 for a two-call test).
  const withStubbedRest = async (serverValue, fn) => {
    const realRest = W.rest, realSession = W.session, realSnap = W.saveDataSnapshot;
    let posted;
    W.session = { user: { id: "u" } };
    W.saveDataSnapshot = () => {};
    W.rest = async (path, opts) => {
      if (!opts || !opts.method) return serverValue === undefined ? [] : [{ value: serverValue }];
      posted = JSON.parse(opts.body)[0].value;   // the upsert
      return null;
    };
    try { await fn(); } finally { W.rest = realRest; W.session = realSession; W.saveDataSnapshot = realSnap; }
    return posted;
  };

  await ta("kvUpdate merges a concurrent writer instead of clobbering", async () => {
    const saved = W.kvData.get("dayplan");
    W.kvData.set("dayplan", { "2026-01-01": ["mine-base"] });          // what THIS device loaded
    // meanwhile the other device added a different day and wrote it
    const server = { "2026-01-01": ["mine-base"], "2026-01-02": ["theirs"] };
    const posted = await withStubbedRest(server, () =>
      W.kvUpdate("dayplan", prev => ({ ...(prev || {}), "2026-01-03": ["mine-new"] })));
    if (saved === undefined) W.kvData.delete("dayplan"); else W.kvData.set("dayplan", saved);
    return eq(Object.keys(posted || {}).sort(), ["2026-01-01", "2026-01-02", "2026-01-03"]);
  });

  await ta("kvUpdate writes the plain value when the server matches", async () => {
    const saved = W.kvData.get("dayplan");
    W.kvData.set("dayplan", { a: 1 });
    const posted = await withStubbedRest({ a: 1 }, () =>
      W.kvUpdate("dayplan", prev => ({ ...(prev || {}), b: 2 })));
    if (saved === undefined) W.kvData.delete("dayplan"); else W.kvData.set("dayplan", saved);
    return eq(posted, { a: 1, b: 2 });
  });

  await ta("kvUpdate keeps the optimistic value when the freshness read fails", async () => {

    // the right fallback here.
    const saved = W.kvData.get("dayplan");
    const realRest = W.rest, realSession = W.session, realSnap = W.saveDataSnapshot;
    let posted, calls = 0;
    W.session = { user: { id: "u" } }; W.saveDataSnapshot = () => {};
    W.rest = async (path, opts) => {
      calls++;
      if (!opts || !opts.method) throw new Error("offline");
      posted = JSON.parse(opts.body)[0].value;
      return null;
    };
    W.kvData.set("dayplan", { a: 1 });
    try { await W.kvUpdate("dayplan", prev => ({ ...(prev || {}), b: 2 })); }
    finally { W.rest = realRest; W.session = realSession; W.saveDataSnapshot = realSnap; }
    if (saved === undefined) W.kvData.delete("dayplan"); else W.kvData.set("dayplan", saved);
    return calls === 2 && JSON.stringify(posted) === JSON.stringify({ a: 1, b: 2 })

  });

  /* ================= TRIP BUILDER / pack plan (2026-07-29 r2) =================
     Spec: TRIP_BUILDER.md. These cover the three inversions, because getting any
     of them backwards produces a plausible WRONG answer rather than a crash:
       ① outfits first — every packed piece must be in a real outfit
       ② schedule, don't divide — violations carry a date, seeded from last_washed
       ③ the solve is an event — same inputs, same pack
     Case "a 10-day trip with two dressy evenings doesn't pack one pair of shoes"
     is a GATE on decision D2, not a regression test. */
  const withPackCloset = (fn, opt = {}) => {
    const saved = { items: W.items, wears: W.wears, outfits: W.outfits, outfitLinks: W.outfitLinks,

    W.items = [];
    const add = (...a) => { const it = mk(...a); W.items.push(it); return it; };
    // Casual + smart tops (tolerance 1 tees, 4 sweaters), bottoms, shoes across
    // two formality bands, dresses, outerwear. Generous enough that outfits form.
    for (let n = 0; n < 8; n++) add("tee" + n, "Tops", "Tee shirts", [2, 3]);
    for (let n = 0; n < 4; n++) add("blo" + n, "Tops", "Blouses", [4, 5]);
    for (let n = 0; n < 3; n++) add("swt" + n, "Tops", "Sweaters", [3, 4, 5]);
    for (let n = 0; n < 3; n++) add("jea" + n, "Bottoms", "Jeans", [2, 3, 4]);
    for (let n = 0; n < 2; n++) add("pnt" + n, "Bottoms", "Pants", [4, 5, 6]);
    for (let n = 0; n < 2; n++) add("skt" + n, "Bottoms", "Skirts", [4, 5, 6]);
    for (let n = 0; n < 3; n++) add("snk" + n, "Shoes", "Sneakers", [2, 3]);
    for (let n = 0; n < 2; n++) add("fla" + n, "Shoes", "Flats", [3, 4, 5]);
    for (let n = 0; n < 2; n++) add("hee" + n, "Shoes", "Heels", [5, 6]);
    for (let n = 0; n < 2; n++) add("drs" + n, "Dresses", "Short", [4, 5]);
    for (let n = 0; n < 2; n++) add("ckt" + n, "Dresses", "Cocktail", [5, 6]);
    for (let n = 0; n < 2; n++) add("blz" + n, "Outerwear", "Blazers", [5, 6]);
    if (opt.mutate) opt.mutate(W.items, add);
    // `replace` swaps the whole closet out, for cases that need a deliberately
    // SCARCE wardrobe (the general fixture is roomy enough that most tradeoffs
    // never bind, which silently made the tightness-dial case untestable).
    if (opt.replace) { W.items = []; opt.replace(add); }

    W.wears = [];
    // A little history so contextFormalityLevel / rackWarmth / travel stats have
    // something to read, without making any one piece dominant.
    for (let n = 0; n < 20; n++) {
      W.wears.push({ id: "pw" + n, item_id: "tee" + (n % 8), worn_on: W.shiftDate(today, -(n + 2)),
                     outfit_id: null, context: ["Errands"], formality_for: 3 });
    }
    for (let n = 0; n < 6; n++) {
      W.wears.push({ id: "pwk" + n, item_id: "blo" + (n % 4), worn_on: W.shiftDate(today, -(n * 3 + 2)),
                     outfit_id: null, context: ["Work"], formality_for: 5 });
    }
    if (opt.wears) opt.wears(W.wears);

    W.outfits = []; W.outfitLinks = [];
    W.capsules = opt.capsules || []; W.capsuleLinks = opt.capsuleLinks || [];
    W.exclusions = opt.exclusions || [];
    W.dataReady = true;
    W.kvData.delete("rack");
    if (opt.dayplan) W.kvData.set("dayplan", opt.dayplan); else W.kvData.delete("dayplan");
    W.buildOutfitIndexes(); W.buildCapsuleIndexes(); W.buildSuggestIndexes(); W.buildExcludeSet();
    try { return fn(); }
    finally {
      W.items = saved.items; W.wears = saved.wears; W.outfits = saved.outfits;
      W.outfitLinks = saved.outfitLinks; W.capsules = saved.caps; W.capsuleLinks = saved.links;
      W.exclusions = saved.excl; W.dataReady = saved.ready;
      if (saved.rack === undefined) W.kvData.delete("rack"); else W.kvData.set("rack", saved.rack);
      if (saved.plan === undefined) W.kvData.delete("dayplan"); else W.kvData.set("dayplan", saved.plan);
      W.buildOutfitIndexes(); W.buildCapsuleIndexes(); W.buildSuggestIndexes(); W.buildExcludeSet();
    }

  // A dated trip capsule, n days from tomorrow.
  const packTrip = (n, locs) => ({ id: "tripc", name: "Test trip", kind: "packing",

  // Solve with few restarts — the suite asserts invariants, not pack quality.

  // ---- ② schedule, don't divide ----

  /* ⚠️ GATE ON DECISION D2 (TRIP_BUILDER.md §1). "Distinct = any piece differs"

     on merit. If this goes red, D2 is insufficient and needs the visible-core or

  t("two dressy evenings on a 10-day trip force shoes for BOTH bands", () => withPackCloset(() => {

    // ⚠️ Asserting "≥2 pairs of shoes" is NOT enough and passed vacuously: the
    // laundry-aware greedy packs extra shoes anyway. The claim being guarded is
    // that a SECOND FORMALITY BAND is what pulls in a second kind of shoe, so
    // check the bands directly — and that the dressy occasions exist at all,
    // which is what the character-mix-as-target-count fix provides.
    const dressy = demand.filter(o => o.level >= 6).length;
    const shoes = res.pack.map(id => W.itemById.get(id)).filter(i => i && i.category === "Shoes");
    const reaches6 = shoes.filter(i => (W.itemFormalitySet(i) || []).includes(6));
    const casual = shoes.filter(i => !(W.itemFormalitySet(i) || []).includes(6));
    return dressy >= 2 && reaches6.length >= 1 && casual.length >= 1
      ? true : `dressyOccasions=${dressy} reaches6=${JSON.stringify(reaches6.map(i => i.id))} casual=${JSON.stringify(casual.map(i => i.id))}`;
  }));

  /* ⚠️ The case that catches a starved candidate list. Ten casual days against
     tolerance-1 tees needs a fresh top most days; the closet below can easily do
     that, so ANY violation here means the solver couldn't see enough of the
     wardrobe — which is exactly what happened when candidates were the top 8 by
     score (they shared three tops between them). Violations are a legitimate
     OUTPUT when the closet genuinely can't cover the trip; they are never
     acceptable when it can. */
  /* ⚠️ Both of these guard a defect found by RENDERING THE SCREEN, not by a test
     (2026-07-29 r4). A 5-day trip came back with Thursday and Friday as the
     IDENTICAL outfit and one sweater on 4 of 5 days at exactly its tolerance
     ceiling: zero violations, minimum pieces, and it reads as the app failing.
     The laundry counter only stops a piece EXCEEDING tolerance; sweaters (4) and
     shoes (Infinity) sail through it, and K guards how many options exist in the
     pack rather than whether consecutive days differ. See PACK_REPEAT_*. */
  t("no two consecutive days get the identical outfit", () => withPackCloset(() => {
    const c = packTrip(6);
    const { demand, res } = solveFor(c, { K: 2, mix: [{ context: "Errands", per: 0.9 }] });
    const byDate = new Map();
    for (const o of demand) {
      const cd = res.assign.get(o.id);
      if (cd) byDate.set(o.date, (byDate.get(o.date) || []).concat(cd.ids.join(",")));
    }
    const days = [...byDate.keys()].sort();
    const dup = [];
    for (let k = 1; k < days.length; k++) {
      const a = byDate.get(days[k - 1]), b = byDate.get(days[k]);
      if (a.length === 1 && b.length === 1 && a[0] === b[0]) dup.push([days[k - 1], days[k]]);
    }
    return !dup.length ? true : `identical on consecutive days: ${JSON.stringify(dup)}`;
  }));

  // Max distinct DAYS any one top/dress goes out on. Reusing bottoms and shoes
  // all week is the point of packing light, so they're deliberately excluded.
  const topSpread = (demand, res) => {
    const dayWorn = new Map();
    for (const o of demand) {
      const cd = res.assign.get(o.id);
      if (!cd) continue;
      for (const id of cd.ids) {
        const it = W.itemById.get(id);
        if (!it) continue;
        const slot = W.suggestSlot(it);
        if (slot !== "Tops" && slot !== "Dresses") continue;
        let s = dayWorn.get(id); if (!s) dayWorn.set(id, s = new Set());
        s.add(o.date);
      }
    }
    return Math.max(0, ...[...dayWorn.values()].map(s => s.size));
  };

  t("at Cushion no single top carries more than half the trip's days", () => withPackCloset(() => {
    const c = packTrip(6);
    const { demand, res } = solveFor(c, { K: 3, mix: [{ context: "Errands", per: 0.9 }] });
    const days = new Set(demand.map(o => o.date)).size;
    const worst = topSpread(demand, res);
    return worst <= Math.ceil(days / 2)
      ? true : `days=${days} cap=${Math.ceil(days / 2)} worstTop=${worst}`;
  }));

  /* The tightness dial has to DO something to the thing she'd notice. Before
     repW existed, K only changed option counts, so Lean and Cushion produced the
     same daily repetition and the dial was decorative on this axis. */
  /* ⚠️ Needs a SCARCE closet, and the reason is worth writing down: on the roomy
     general fixture the solver spreads tops perfectly at every setting, so the
     dial has nothing to trade and the case passes vacuously. The pressure comes
     from high-tolerance tops being available — a sweater (tolerance 4) makes
     reuse cheap, so Lean takes it and Cushion pays a piece to avoid it.
     This case was silently defanged once already by an unrelated change to the
     plane-day occasion's LEVEL, which split the trip across two levels and
     removed the scarcity. Hence the explicit closet. */
  const scarceTops = (add) => {
    add("swtA", "Tops", "Sweaters", [3]);      // tolerance 4 — reuse is cheap
    add("swtB", "Tops", "Sweaters", [3]);
    add("teeA", "Tops", "Tee shirts", [3]);    // tolerance 1 — one day each
    add("teeB", "Tops", "Tee shirts", [3]);
    add("jeaA", "Bottoms", "Jeans", [3]);
    add("jeaB", "Bottoms", "Jeans", [3]);
    add("snkA", "Shoes", "Sneakers", [3]);
  };
  t("Lean tolerates strictly more repetition than Cushion", () => withPackCloset(() => {
    const c = packTrip(6);
    const mix = [{ context: "Errands", per: 1 }];
    const lean = solveFor(c, { K: 1, mix });
    const cush = solveFor(c, { K: 3, mix });
    const l = topSpread(lean.demand, lean.res), u = topSpread(cush.demand, cush.res);
    // STRICT: `l >= u` held even with repW pinned to 1 (verified by mutation).
    return l > u
      ? true : `leanWorstTop=${l} cushionWorstTop=${u} leanPieces=${lean.res.pack.length} cushionPieces=${cush.res.pack.length}`;
  }, { replace: scarceTops }));

  t("a 10-day trip packs enough tops to stay inside tolerance", () => withPackCloset(() => {
    const c = packTrip(10);
    const { demand, res } = solveFor(c, { K: 1, mix: [{ context: "Errands", per: 0.9 }] });
    // Assert the OUTCOME (nothing worn dirty), not a top count — 2 sweaters at
    // tolerance 4 plus 2 tees legitimately covers 10 days, and demanding "≥5
    // tops" encoded an assumption rather than the requirement.
    return demand.length >= 9 && res.violations.length === 0
      ? true : `occasions=${demand.length} violations=${JSON.stringify(res.violations)} pack=${res.pack.length}`;
  }));

  t("pinned pieces are in the pack even when the optimiser wouldn't pick them", () => withPackCloset(() => {
    const { res } = solveFor(packTrip(4), { pinned: ["ckt1", "hee1"] });
    return res.pack.includes("ckt1") && res.pack.includes("hee1")
      ? true : `pack=${JSON.stringify(res.pack)}`;
  }));

  t("a locked occasion keeps its outfit through a re-solve", () => withPackCloset(() => {
    const c = packTrip(5);
    const first = solveFor(c);
    const occ = first.demand[2];
    const lockCombo = { ids: ["blo0", "pnt0", "fla0"].sort(), pieces: [], score: 0 };
    const locked = new W.Map();
    locked.set(occ.id, lockCombo);
    const again = solveFor(c, { locked });
    const got = again.res.assign.get(occ.id);
    return got && eq(got.ids, lockCombo.ids) === true
        && lockCombo.ids.every(id => again.res.pack.includes(id))
      ? true : `got=${JSON.stringify(got && got.ids)}`;
  }));

  // ---- the pool ----
  t("a two-leg trip draws on both climates", () => withPackCloset(() => {
    // Same dates, one leg vs two. Two legs run buildRack twice and union, so the
    // pool can only be larger — a single call with one weather band is how half
    // a multi-destination trip's wardrobe would go missing.
    const one = packTrip(8, [{ name: "A", lat: 40, lon: -3 }]);
    const two = packTrip(8, [{ name: "A", lat: 40, lon: -3, from: D(1), to: D(4) },
                         { name: "B", lat: 38, lon: 0, from: D(5), to: D(8) }]);
    const legs1 = W.tripLegs(one).length, legs2 = W.tripLegs(two).length;
    const s1 = W.packSlate(one), s2 = W.packSlate(two);
    const r1 = W.packRack(one, s1).ids.length, r2 = W.packRack(two, s2).ids.length;
    return legs1 === 1 && legs2 === 2 && r2 >= r1
      ? true : `legs=${legs1}/${legs2} rack=${r1}/${r2}`;
  }));

  t("the trip rack keeps the cold share (it can't quietly calcify)", () => withPackCloset(() => {
    const c = packTrip(6);
    const r = W.packRack(c, W.packSlate(c));
    return r.cold.length > 0 ? true : `cold=${r.cold.length} of ${r.ids.length}`;
  }));

  t("pack candidates ignore laundry — it's a schedule constraint, not a filter", () => withPackCloset(() => {
    // Hamper every blouse. They must still be CANDIDATES (a wash before
    // departure fixes them); filtering here is the divide-don't-schedule bug.
    for (let n = 0; n < 4; n++) {
      const b = W.itemById.get("blo" + n);
      b.last_washed = D(-10); b.laundry_state = "hamper";

    const usesHampered = cands.some(cd => cd.ids.some(id => id.startsWith("blo")));
    const ls = W.laundryState();

      ? true : `dirty=${reallyDirty} usesHampered=${usesHampered} cands=${cands.length}`;
  }));

  t("an uncoverable level reports as unmet with its date, never as an empty pack", () => withPackCloset(() => {
    // Nothing in this closet reaches level 8 (black tie).
    const c = packTrip(4);
    const slate = W.packSlate(c, { plans: { [D(2)]: [{ contexts: [], level: 8, outfit: null }] } });
