      W.buildOutfitIndexes(); W.buildExcludeSet(); W.buildSuggestIndexes();
      let withHeels = 0, total = 0;
      for (let k = 0; k < 12; k++)
        for (const c of W.suggestOutfits(null, null, its, null, null, null, false)) {
          total++;
          if (c.pieces.some(p => p.subcategory === "Heels")) withHeels++;
        }
      return (total > 0 && withHeels === 0) ? true : `${withHeels} of ${total} suggestions paired heels with a tee`;
    } finally {
      W.items = saved.items; W.itemById = new Map(saved.items.map(i => [i.id, i]));
      W.wears = saved.wears; W.outfits = saved.outfits; W.outfitLinks = saved.outfitLinks;
      W.exclusions = saved.exclusions; W.activeCapsuleId = saved.cap; W.dataReady = saved.ready;
      W.buildOutfitIndexes(); W.buildExcludeSet(); W.buildSuggestIndexes();
    }
  });

  /* ⚠️ THE OFF-LEVEL CEILING REINTRODUCED THE 2026-07-19 EMPTY-SHEET BUG, and I
     found it by measuring rather than by reading. Keeping clothes for rare days
     off the rack means tapping "6. Dressed Up" out of the blue — nothing in the
     planner, just looking — hit targetLevel's HARD filter against a rack with no
     heels on it. Measured on a realistic 216-piece closet: level 3 gave a full
     8 results, level 6 gave 0. Widening is rescue-only and the chip names it. */
  /* ⚠️ Uses withDressyOnlyShoes, NOT withRackCloset: the latter seeds a dressy
     piece every tenth item in every slot, and index 0 is worn recently enough to
     sit in ROTATION, so that rack CAN dress level 6 and the case would pass
     without testing anything. The guard clause below says so out loud rather
     than reporting a silent success if the fixture ever drifts back. */
  t("a level the rack can't dress widens to the closet; one it can does not", () => withDressyOnlyShoes(() => {
    const rack = W.rackItems();
    const rackCovers3 = W.poolCoversLevel(3, rack);
    const rackCovers6 = W.poolCoversLevel(6, rack);
    const pool3 = W.planningPool({ level: 3 });
    const pool6 = W.planningPool({ level: 6 });
    const allN = W.items.filter(i => W.itemStatus(i) === "Available").length;
    if (rackCovers6) return "fixture no longer isolates the case — the rack can dress level 6";
    /* Last assertion: this fixture's WHOLE CLOSET can't dress level 6 either
       (its only [6] pieces are shoes), so the sheet is still empty — and that is
       the right answer, because it is now the closet's answer rather than the
       rack quietly withholding. The rescue producing real results was measured
       separately on a realistic 216-piece closet: level 6 went 0 → 8. */
    return eq([rackCovers3, pool3.length === rack.length, pool6.length === allN,
               W.poolCoversLevel(6, W.items.filter(i => W.itemStatus(i) === "Available"))],
              [true, true, true, false]);
  }));

  t("poolCoversLevel means 'can build an outfit', not 'owns something dressy'", () => {
    const mk = (id, cat, sub, f) => ({ id, category: cat, subcategory: sub, formality: f, status: "Available" });
    const top = mk("t", "Tops", "Blouses", [6]);
    const bottom = mk("b", "Bottoms", "Pants", [6]);
    const shoe = mk("s", "Shoes", "Heels", [6]);
    const dress = mk("d", "Dresses", "Cocktail", [6]);
    const saved = { items: W.items };
    try {
      W.items = [top, bottom, shoe, dress];
      W.itemById = new Map(W.items.map(i => [i.id, i]));
      return eq([W.poolCoversLevel(6, [top, bottom, shoe]),  // top+bottom+shoes
                 W.poolCoversLevel(6, [dress, shoe]),        // dress+shoes
                 W.poolCoversLevel(6, [top, bottom]),        // no shoes → no outfit
                 W.poolCoversLevel(6, [dress]),              // no shoes → no outfit
                 W.poolCoversLevel(6, [top, shoe]),          // no bottom, no dress
                 W.poolCoversLevel(null, [])],               // no level asked → always fine
                [true, true, false, false, false, true]);
    } finally { W.items = saved.items; W.itemById = new Map(saved.items.map(i => [i.id, i])); }
  });

  /* ==== 2026-08-10 r4 — five reports from her live use ==================== */

  // A fixture for the suggester's layer/shirt picker. Photos on everything but
  // the piece deliberately missing one, so "no photo yet" is exercised.
  const withLayerCloset = (fn) => {
    const mk = (id, name, cat, sub, f, extra) => Object.assign(
      { id, name, category: cat, subcategory: sub, status: "Available",
        formality: f, image_path: "p/" + id + ".webp", tags: [], last_washed: "2026-08-01" }, extra || {});
    const saved = { items: W.items.slice(), wears: W.wears.slice(), sugg: W._sugg };
    try {
      W.items.length = 0;
      W.items.push(
        mk("tee", "White tee", "Tops", "Tee shirts", [3]),
        mk("jean", "Blue jeans", "Bottoms", "Jeans", [3]),
        mk("sneak", "Sneakers", "Shoes", "Sneakers", [3]),
        mk("card1", "Oatmeal cardigan", "Tops", "Cardigans", [3, 4]),
        mk("card2", "Navy cardigan", "Tops", "Cardigans", [3]),
        mk("blazerA", "Black blazer", "Outerwear", "Blazers", [5, 6]),
        mk("jacket", "Denim jacket", "Outerwear", "Jackets", [2, 3]),
        mk("nophoto", "Grey cardigan", "Tops", "Cardigans", [3], { image_path: null }),
        mk("btn", "Chambray button-up", "Tops", "Blouses", [3], { tags: ["layer"] }),
        mk("tank", "Black tank", "Tops", "Sleeveless", [3]));
      W.wears.length = 0;
      W.buildOutfitIndexes();
      Object.assign(W._sugg, { capsuleId: null, wholeCloset: true, targetLevel: null,
        season: null, useWx: false, useClean: false, banned: new W.Set(),
        locked: new W.Set(), unworn: null, shapeKey: null, occPrefs: null,
        layerPick: null, idx: 0 });
      return fn(mk);
    } finally {
      W.items.length = 0; W.items.push(...saved.items);
      W.wears.length = 0; W.wears.push(...saved.wears);
      W.buildOutfitIndexes();
    }
  };

  /* ⚠️ Her report: *"trying to use the suggester to add a particular layer that
     I know is in the bag but it won't add it."* ＋ Layer drew at RANDOM from a
     list she never saw, and seven filters could silently remove her piece. The
     guarantee is that the pool is ENUMERATED and a filtered-out piece is named
     with its reason rather than disappearing. */
  t("the layer picker names its candidates instead of drawing one at random", () => withLayerCloset(() => {
    const combo = { pieces: ["tee", "jean", "sneak"].map(x => W.itemById.get(x)), score: 0 };
    W._sugg.results = [combo]; W._sugg.idx = 0;
    const { cands, blocked } = W.suggestLayerCandidates(combo, { role: "layer" });
    // The button-up is layer-TAGGED, so it belongs in the layer list too — that
    // clause ("isLayer && category Tops") is what makes a shirt usable as one.
    /* ⚠️ The Grey cardigan (image_path: null) moved from BLOCKED to OFFERED on
       2026-08-13, and that is the decision changing, not a regression: a
       photoless piece is suggestible now and renders as the tee placeholder.
       The "no photo yet" reason no longer exists. Kept in the fixture on purpose
       so this case kills the filter if anyone puts it back. */
    return eq([cands.map(i => i.name), blocked.map(b => b.i.name + "|" + b.why)],
              [["Chambray button-up", "Denim jacket", "Grey cardigan", "Navy cardigan", "Oatmeal cardigan"],
               ["Black blazer|shares no level with the rest"]]);
  }));

  /* A blocked piece must stay REACHABLE — the filters are the engine's guesses,
     "I want this cardigan" is her decision. Same line as "locking an off-rack
     piece must never fail". If this ever goes red the picker has become a cage. */
  t("a piece the rules filtered out can still be chosen", () => withLayerCloset(() => {
    const combo = { pieces: ["tee", "jean", "sneak"].map(x => W.itemById.get(x)), score: 0 };
    W._sugg.results = [combo]; W._sugg.idx = 0;
    W._sugg.layerPick = { role: "layer", excludeId: null, showBlocked: true };
    const html = W.suggestLayerPickHtml(combo);
    const offered = html.includes('data-spickadd="blazerA"');   // rendered, tappable
    W.suggestPickPiece("blazerA", "layer", null);
    return eq([offered, combo.pieces.map(p => p.id), W._sugg.layerPick],
              [true, ["tee", "jean", "sneak", "blazerA"], null]);
  }));

  /* ⚠️ Her report: *"if something is used as a shirt in a suggested outfit but
     can be a layer, I should have the option to add a layer OR add a shirt (and
     this top is now used as a layer)."* The parenthesis is the assertion — the
     new shirt is spliced in BEFORE the old top, because layerPieceOf reads the
     LAST layer-flagged top as the layer. Appending would leave the button-up
     labelled "Top" and the tee labelled "Layer", i.e. backwards. */
  t("adding a shirt under a layerable top makes that top the layer", () => withLayerCloset(() => {
    const combo = { pieces: ["btn", "jean", "sneak"].map(x => W.itemById.get(x)), score: 0 };
    W._sugg.results = [combo]; W._sugg.idx = 0;
    const before = (W.layerPieceOf(combo.pieces) || {}).id || null;
    const tops = combo.pieces.filter(p => p.category === "Tops");
    const chipShows = !W.layerPieceOf(combo.pieces) && tops.length === 1 && W.isLayer(tops[0]);
    const { cands } = W.suggestLayerCandidates(combo, { role: "top" });
    W.suggestPickPiece("tee", "top", null);
    const after = (W.layerPieceOf(combo.pieces) || {}).id || null;
    return eq([before, chipShows, cands.map(i => i.id).sort(), combo.pieces.map(p => p.id), after],
              [null, true, ["tank", "tee"], ["tee", "btn", "jean", "sneak"], "btn"]);
  }));

  /* ⚠️ Her report: *"when I change an outfit in the pack planner, it offers me
     to log it today — which I never want to do — but not to save it as the
     revised version for the pack plan."* The writeback existed but lived only in
     the ✕ handler, so the one prominent button did the one thing she never
     wants. The button's LABEL is the contract; a pack occasion is usually a
     future day, so "Wear this today" is wrong about the date as well. */
  t("the pack's suggester offers to save the outfit, never to log it today", () => {
    const src = W.renderSuggestSheet.toString();
    // The label branches on packOcc, and does so BEFORE planCtx — a pack
    // occasion that also carried a plan context must still save, not log.
    const labelI = src.indexOf('_sugg.packOcc ? "Use this outfit"');
    const planI = src.indexOf("_sugg.planCtx ? (_sugg.planCtx.date === PLAN_BUCKET");
    // The primary button's handler writes the outfit back to the occasion.
    const saves = /_sugg\.packOcc\) wearBtn\.onclick[\s\S]{0,320}packSetOccasionOutfit\(cid, occId/.test(src);
    // …and ✕ no longer commits, or the sheet would have no way to back out.
    const closeCancels = /_sugg\.packOcc\) \{\s*_sugg\.packOcc = null;\s*hideSheet\("logSheet"\);\s*return;/.test(src);
    return eq([labelI > -1, planI > -1, labelI < planI, saves, closeCancels],
              [true, true, true, true, true]);
  });

  /* ⚠️ Her report: *"'what would you actually wear' only shows up sometimes
     rather than always if an outfit is unlocked."* The card used to return ""
     when the deal handed it no alternatives — which the deal legitimately does,
     since r1 gives each look to ONE card. Two things were wrong: the review bar
     still COUNTED that occasion, so it promised decisions over cards with
     nothing on them, and unlock (built in r2 to re-open the question) looked
     dead. Her decision ③ was every occasion, not the ambiguous few. */
  t("the review asks its question even when the bag offers no alternative", () => {
    const src = W.packOccCardHtml.toString();
    // the early return on an empty deal is what the bug was
    const bails = /alts\s*=\s*[^;]+;\s*if\s*\(!alts\.length\)\s*return\s*""/.test(src);
    const asksAnyway = src.includes("pack-review-q") && src.includes("pack-review-none");
    return eq([bails, asksAnyway], [false, true]);
  });

  /* ⚠️ Her report: *"the build it / change it myself should filter to what's in
     the pack — with the option to add from outside the pack too."* builderPool
     reads builder.scopeCapsuleId, which openBuilder takes from planCtx.capsuleId
     — and the pack passed only packOcc, so revising opened the whole closet. It
     LOOKED scoped whenever she was already in trip mode (builderPool also falls
     back to tripModeId), which is why it survived: planning a trip that hadn't
     started got the whole closet. The widen must exist in the RAIL too, since a
     scoped builder defaults to pickAll. */
  t("revising a pack outfit in the builder starts in the bag, with a widen", () => {
    const pack = W.packBuildOccasion.toString();
    const passesCapsule = /packOcc:\s*\{\s*cid:\s*st\.cid,\s*occId\s*\},\s*capsuleId:\s*st\.cid/.test(pack);
    const openSrc = W.openBuilder.toString();
    const readsIt = openSrc.includes("scopeCapsuleId: planCtx ? planCtx.capsuleId : null");
    const picker = W.renderBuilderPicker.toString();
    const rail = W.renderBuilderRail.toString();
    const widenBoth = picker.includes("Whole closet") && rail.includes("Whole closet");
    return eq([passesCapsule, readsIt, widenBoth], [true, true, true]);
  });

  /* ==== 2026-08-10 r4 — audit: funnels that only pretended to narrow ======= */

  /* ⚠️ A dim offered in the sheet must be APPLIED by the predicate. `laundry`
     was in FILTERS (so LOOKS_FILTER_DIMS inherited it) and in hasActiveFilter
     (so it lit the badge), and outfitMatchesFilter — which destructures the dims
     it applies by name — never mentioned it. The look below has a tee that is
     deep in the hamper and jeans that are clean; before the fix it matched BOTH
     "In the hamper" and "Clean". ⚠️ The two halves read OPPOSITE ways — "Clean"
     is ALL-pieces (wearable right now), "In the hamper" is ANY-piece (one dirty
     tee is what blocks the look). A plain ALL-pieces copy of the rack rule made
     this case go red, which is what caught it. */
  t("the laundry filter actually narrows the Looks list", () => {
    const saved = { items: W.items.slice(), outfits: W.outfits.slice(),
                    links: W.outfitLinks.slice(), wears: W.wears.slice() };
    try {
      const today = W.todayStr();
      const tee = { id: "tee1", name: "White tee", category: "Tops", subcategory: "Tee shirts",
                    status: "Available", formality: [3], last_washed: "2020-01-01" };
      const jean = { id: "jean1", name: "Jeans", category: "Bottoms", subcategory: "Jeans",
                     status: "Available", formality: [3], last_washed: "2020-01-01" };
      W.items.length = 0; W.items.push(tee, jean);
      W.outfits.length = 0; W.outfits.push({ id: "o1", name: "Tee+jeans", rating: null, archived: false });
      W.outfitLinks.length = 0;
      W.outfitLinks.push({ outfit_id: "o1", item_id: "tee1" }, { outfit_id: "o1", item_id: "jean1" });
      W.wears.length = 0;
      for (let k = 1; k <= 12; k++) W.wears.push({ id: "w" + k, item_id: "tee1", outfit_id: "o1", worn_on: W.shiftDate(today, -k), context: [] });
      W.buildOutfitIndexes();
      const st = (v) => Object.assign(W.newFilterState(), { laundry: new W.Set([v]) });
      const o = W.outfits[0];
      return eq([W.isDirty(tee), W.isDirty(jean),
                 W.outfitMatchesFilter(o, st("In the hamper")),
                 W.outfitMatchesFilter(o, st("Clean")),
                 W.LOOKS_FILTER_DIMS.some(d => d[0] === "laundry")],
                // dirty tee, clean jeans → the look IS in the hamper and is NOT clean
                [true, false, true, false, true]);
    } finally {
      W.items.length = 0; W.items.push(...saved.items);
      W.outfits.length = 0; W.outfits.push(...saved.outfits);
      W.outfitLinks.length = 0; W.outfitLinks.push(...saved.links);
      W.wears.length = 0; W.wears.push(...saved.wears);
      W.buildOutfitIndexes();
    }
  });

  /* ⚠️ The funnel/pool rule, both directions (CLAUDE.md, after r11): a page whose
     numbers ignore statsFilter must not render a funnel. Four pages were doing
     it — Year in Review, Most Worn Looks, Contexts and a context's detail — each
     one deriving from the whole wardrobe while offering a control that changed
     nothing. Asserted on the CALL, since that's where the two halves of the
     decision have to agree. */
  t("a stats page that ignores the funnel doesn't render one", () => {
    const wrapped = W.renderStatsWrapped.toString();
    const looks = W.renderStatsOutfitsPage.toString();
    const ctxs = W.renderStatsContextsPage.toString();
    const ctxd = W.renderStatsContextDetailPage.toString();
    return eq([
      /statsToolbar\("Year in Review", true, false, true\)/.test(wrapped),
      /statsToolbar\(neglected \? "Liked but Neglected" : "Most Worn Looks", true, false, true\)/.test(looks),
      /statsToolbar\("Contexts", true, true, true\)/.test(ctxs),
      /statsToolbar\(c \|\| "Context", true, false, true\)/.test(ctxd),
    ], [true, true, true, true]);
  });

  /* ⚠️ …and hiding the funnel must not take the RANGE with it. The two flags are
     independent in the signature and were not in the body, which is why the
     Contexts page — whose range genuinely works — could not drop its decorative
     funnel without losing a control that does something. */
  t("hiding the funnel keeps a page's range button", () => {
    const withRange = W.statsToolbar("Contexts", true, true, true);
    const without = W.statsToolbar("Rotation", true, false, true);
    return eq([withRange.includes('id="stRange"'), withRange.includes('id="stFilter"'),
               without.includes('id="stRange"'), without.includes('id="stBack"')],
              [true, false, false, true]);
  });

  // ---- render summary ----
  await Promise.all(pending);
  const ul = document.getElementById("results");
  let pass = 0;
  for (const r of results) {
    const li = document.createElement("li");
    li.className = r.ok ? "pass" : "fail";
    li.textContent = (r.ok ? "✓ " : "✗ ") + r.name + (r.ok ? "" : " — " + r.msg);
    ul.appendChild(li);
    if (r.ok) pass++;
  }
  const sum = document.getElementById("summary");
  sum.textContent = `${pass}/${results.length} passed`;
  sum.className = pass === results.length ? "pass" : "fail";
  document.title = `${pass}/${results.length} — Wardrobe self-test`;
}
</script>
</body>
</html>
