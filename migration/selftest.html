  /* ⚠️ The case that catches a starved candidate list. Ten casual days against
     tolerance-1 tees needs a fresh top most days; the closet below can easily do
     that, so ANY violation here means the solver couldn't see enough of the
     wardrobe — which is exactly what happened when candidates were the top 8 by
     score (they shared three tops between them). Violations are a legitimate
     OUTPUT when the closet genuinely can't cover the trip; they are never
     acceptable when it can. */
  /* ⚠️ Both of these guard a defect found by RENDERING THE SCREEN, not by a test
     (2026-07-29 r4). A 5-day trip came back with Thursday and Friday as the
     IDENTICAL outfit and one sweater on 4 of 5 days at exactly its tolerance
     ceiling: zero violations, minimum pieces, and it reads as the app failing.
     The laundry counter only stops a piece EXCEEDING tolerance; sweaters (4) and
     shoes (Infinity) sail through it, and K guards how many options exist in the
     pack rather than whether consecutive days differ. See PACK_REPEAT_*. */
  t("no two consecutive days get the identical outfit", () => withPackCloset(() => {
    const c = packTrip(6);
    const { demand, res } = solveFor(c, { K: 2, tripContexts: [{ ctx: "Errands", n: 5 }] });
    const byDate = new Map();
    for (const o of demand) {
      const cd = res.assign.get(o.id);
      if (cd) byDate.set(o.date, (byDate.get(o.date) || []).concat(cd.ids.join(",")));
    }
    const days = [...byDate.keys()].sort();
    const dup = [];
    for (let k = 1; k < days.length; k++) {
      const a = byDate.get(days[k - 1]), b = byDate.get(days[k]);
      if (a.length === 1 && b.length === 1 && a[0] === b[0]) dup.push([days[k - 1], days[k]]);
    }
    return !dup.length ? true : `identical on consecutive days: ${JSON.stringify(dup)}`;
  }));

  /* ⚠️ THE PACK IT BUILDS AND THE PACK IT SPENDS ARE THE SAME PACK (2026-08-06).
     Her report: a 5-day trip returned 19 pieces and FOUR distinct outfits — the
     same tee/pants/cardigan on two home days, the same dress on two more, and
     eight pieces that no outfit in the plan ever used.

     The cause is structural and the dial cannot reach it. Stage A chooses
     against the pack AS IT STANDS, where every alternative costs `added * 1000`
     for a piece not yet in the bag while the repetition terms top out at
     PACK_REPEAT_ANY + PACK_REPEAT_TOP = 550 — so repeating is cheaper than
     varying, always, at every tightness (repW scales the losing side). Then
     stage B added pieces to raise option counts and never revisited the
     assignment, so the options it bought were carried and never worn.
     Stage C re-walks the trip over the FINAL pack, where `added` is 0 for
     everything and the repetition terms finally decide. */
  /* ⚠️ A CLOSET THAT MAKES THE TRADE-OFF BIND. The general pack fixture is roomy
     enough that stage A never has to repeat, which is exactly the documented
     "fixture tidier than her closet" trap — three separate attempts at this case
     passed against it while the defect was live. This one is small per slot and
     high-tolerance, so laundry never binds and REPETITION is the only thing
     under test. Measured on it: stage A dressed seven occasions in TWO outfits
     while six options existed, which is her report reproduced. */
  const scarceCloset = { replace: (add) => {
    for (let n = 0; n < 6; n++) add("swt" + n, "Tops", "Sweaters", [2, 3, 4]);
    for (let n = 0; n < 4; n++) add("jea" + n, "Bottoms", "Jeans", [2, 3, 4]);
    for (let n = 0; n < 4; n++) add("boo" + n, "Shoes", "Boots", [2, 3, 4]);
  } };

  /* ⚠️ THE PACK IT BUILDS AND THE PACK IT SPENDS ARE THE SAME PACK (2026-08-06).
     Her report on a 5-day trip: 19 pieces and FOUR distinct outfits — the same
     tee/pants/cardigan on two home days, the same dress on two more.

     Stage A chooses against the pack AS IT STANDS. On day one everything costs
     `added * 1000`; by day three, re-wearing an earlier look costs
     PACK_REPEAT_ANY + PACK_REPEAT_TOP = 550 while ANY new piece costs 1000 — so
     from the third day of a level onward, repeating is cheaper than varying, by
     construction, at every tightness (repW scales the losing side). It converges
     on about two looks per level and stops. Stage B then raised option counts
     and never revisited the assignment, so the options were carried, not worn.
     Stage C re-walks the trip over the FINAL pack, where `added` is 0 for
     everything and the repetition terms finally decide. */
  t("seven occasions are not dressed as two outfits", () => withPackCloset(() => {
    const c = packTrip(5);
    const { demand, res } = solveFor(c, { K: 2, tripContexts: [{ ctx: "Errands", n: 5 }] });
    const v = W.packAssignVariety(demand, res.assign);
    if (v.placed < 6) return `fixture drift: only ${v.placed} occasions were dressed`;
    // The bag offers six looks here; stage A alone spent two of them.
    return v.distinct >= 4
      ? true : `${v.placed} occasions dressed as only ${v.distinct} distinct outfits`;
  }, scarceCloset));

  /* ================= 2026-08-06 r2: her Stl trip =========================
     Two reports, one trip: the pack planned for a wedding she never selected,
     and four days of one context came back as two identical outfits.

     ⚠️ THESE DRIVE THE APP PATH (packLoadState → packEnsureSolve), NOT packSolve
     DIRECTLY, and that distinction is the whole reason the r1 fix shipped
     broken. `solveFor` hands packSolve the wide trip rack; the app hands it the
     already-built BAG, so stage B had nothing to add and gave up silently while
     the suite went green. A harness that can't reach the code she runs is a
     harness that certifies the wrong thing. */
  const appSolve = (c, o = {}) => {
    W.capsuleId = c.id;
    W.kvData.set("pack:" + c.id, Object.assign({
      contexts: o.tripContexts === undefined ? null : o.tripContexts,
      K: o.K == null ? 2 : o.K, assignV: 2,
    }, o.rec || {}));
    const st = W.packLoadState(c.id, { resolve: o.resolve !== false, K: o.K == null ? 2 : o.K });
    if (st) W.packEnsureSolve(st);
    return st;
  };

  /* The console probe hook. Measuring through the entry point she actually uses
     is a standing rule here (driving packSolve directly once produced confident,
     wrong numbers), and every such measurement needs the fixtures — which live
     in this closure. Exported so a session can run one from the browser console
     without adding a throwaway case. Nothing in the suite reads it. */
  window.__t = { withPackCloset, withPackClosetA, packTrip, appSolve, solveFor, scarceCloset, W, D };

  t("the app path spends the options it builds", () => withPackCloset(() => {
    const c = packTrip(5);
    const st = appSolve(c, { K: 2, tripContexts: [{ ctx: "Errands", n: 5 }] });
    if (!st) return "no pack state";
    const v = W.packAssignVariety(st.demand, st.res.assign);
    if (v.placed < 6) return `fixture drift: only ${v.placed} occasions were dressed`;
    // ⚠️ Vacuity guard: if the BAG can't make four looks the assertion below is
    // about the closet's poverty, not about whether the solver spends what it has.
    const occ = st.demand.find(o => o.source === "selected") || st.demand[0];
    const built = W.packOptionCount(occ, new W.Set(st.pack), { wxFor: null });
    if (built < 4) return `vacuous: the bag only offers ${built} looks for that group`;
    return v.distinct >= 4
      ? true : `${v.placed} occasions dressed as only ${v.distinct} distinct outfits`;
  }, Object.assign({ capsules: [packTrip(5)] }, scarceCloset)));

  /* ⚠️ THE DIAL HAS TO SURVIVE THE WHOLE PATH, NOT JUST packCounts (2026-08-08
     audit — her fourth report on this dial, and the first three fixes all landed
     upstream of where it was actually being lost).

     packCounts scales correctly with K and packFill builds exactly what it asks
     for. Measured on a 158-piece closet, 7-day trip, that is 11 / 15 / 19 pieces
     at lean / normal / cushion. Then packRepack rebuilt the bag from scratch as
     "pinned ∪ what the outfits use ∪ extras" and cut all three to 8 / 8 / 9 —
     because eight occasions need about eight outfits' worth of pieces whatever
     the dial says. Lean and normal came out byte-identical. Everything upstream
     was right and the user-visible answer was still the same bag.

     So this asserts the number she can actually SEE, through packLoadState →
     packEnsureSolve, which is the only place the defect was visible at all: the
     three previous rounds each measured an intermediate and went green. */
  /* ⚠️ THE CONTROL CHANGED, SO ITS GUARD CHANGED WITH IT (2026-08-08). This
     asserted K — lean/normal/cushion — and K is no longer something she sets:
     the audit measured that the dial only ever moved the number of SPARE
     pieces (core held at 7/7/9 while optional moved 4/8/10), so it was replaced
     by Light/Balanced/Flexible naming that number outright. The contract is
     unchanged in substance and is still the thing four reports were about: the
     control she touches must change the bag she gets. A red case is not
     automatically a regression — when a decision reverses, its guard reverses. */
  t("the packing mode changes the bag she actually gets", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const sizes = W.PACK_MODES.map(mode => {
        const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }], rec: { mode } });
        return st ? st.pack.length : -1;
      });
      const [light, balanced, flexible] = sizes;
      if (sizes.some(n => n < 0)) return `no pack state: ${JSON.stringify(sizes)}`;
      // ⚠️ Vacuity guard: a closet with no spare capacity would clamp all three
      // to core and this would pass on poverty rather than on the mode working.
      if (flexible <= light) return `vacuous: flexible (${flexible}) never exceeded light (${light})`;
      return light < balanced && balanced <= flexible
        ? true : `light ${light}, balanced ${balanced}, flexible ${flexible} — not monotonic`;
    }, { capsules: [c] });
  });

  /* ================= 2026-08-08: the review ==============================
     The app had never asked her anything — it presented a finished plan and she
     had to go digging, which is how a dress she'd never wear could sit on a card
     until she found the swap sheet. She chose to be offered EVERY occasion with
     a prominent skip, so the queue is ordered by ambiguity instead. */
  t("review options are genuinely different, not the next three in one ranking", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
      if (!st || !st.res) return "no pack state";
      const occ = W.packReviewQueue(st)[0];
      if (!occ) return "vacuous: nothing to review";
      const opts = W.packReviewOptions(st, occ);
      if (opts.length < 2) return `vacuous: only ${opts.length} option offered`;
      /* ⚠️ Distinct on packLookKey, which excludes shoes — swapping shoes was
         how the solver used to fake variety (r13), and "more options" that does
         the same would be the same bug wearing the review's clothes. */
      const looks = new W.Set(opts.map(o => W.packLookKey(o.ids)));
      return looks.size === opts.length
        ? true : `${opts.length} options collapse to ${looks.size} distinct looks`;
    }, { capsules: [c] });
  });

  /* ⚠️ THE LABELS HAVE TO TELL THE OPTIONS APART, and two versions failed at
     exactly this while looking correct in the markup. "Separates instead" was
     true of all three alternatives at once; naming each option's lead garment
     then collided whenever two shared a top. The whole interaction is choosing
     between them, so a label that doesn't distinguish is worse than none.
     Both were found by rendering the card and reading it. */
  t("every review option is labelled distinguishably", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
      if (!st || !st.res) return "no pack state";
      let checked = 0;
      for (const occ of W.packReviewQueue(st)) {
        const cd = st.res.assign.get(occ.id);
        const alts = W.packReviewOptions(st, occ).filter(x => W.packDistinct(x, cd));
        if (alts.length < 2) continue;
        checked++;
        const labels = W.packOptionLabels([cd, ...alts]);
        if (labels.length !== new W.Set(labels).size)
          return `${occ.context || occ.level}: ${JSON.stringify(labels)}`;
      }
      return checked ? true : "vacuous: no occasion offered two alternatives";
    }, { capsules: [c] });
  });

  /* ================= 2026-08-10: one supply, dealt out ===================
     Her report: *"when it gives alternative outfits, each context occasion gets
     the same set — so I can't choose freely."*

     Structural, not a ranking accident: every occasion at one level enumerates
     the same bag against the same score, so the top three by shape were the
     same three on every card. Measured on this fixture before the fix — four
     Errands days offered the IDENTICAL trio, both Work days another identical
     trio, out of 8 and 10 in-bag looks respectively.
     ⚠️ Compared as SETS. The same three in a different order is the same three. */
  t("two days of one context are not offered the same alternatives", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }, { ctx: "Work", n: 2 }] });
      if (!st || !st.res) return "no pack state";
      const sets = new Map();
      let checked = 0;
      for (const occ of st.demand) {
        const opts = W.packReviewOptions(st, occ);
        if (opts.length < 2) continue;            // nothing to be identical with
        checked++;
        const key = opts.map(o => W.packLookKey(o.ids)).sort().join("|");
        if (sets.has(key)) return `${sets.get(key)} and ${occ.context || occ.level} were offered the same set: ${key}`;
        sets.set(key, occ.context || occ.level);
      }
      // ⚠️ Vacuity guard: with fewer than two reviewable cards nothing can collide.
      return checked >= 4 ? true : `vacuous: only ${checked} cards offered alternatives`;
    }, { capsules: [c] });
  });

  /* ⚠️ AND NEVER ANOTHER DAY'S OUTFIT WHILE ANYTHING ELSE IS LEFT. Picking one
     could only produce the duplicate the solver had already priced against —
     two of the three options on a card were exactly that before the deal
     existed.
     ⚠️ It is a LAST RESORT, not a prohibition, and the case has to say so or it
     asserts something the app doesn't promise: an empty card is worse than a
     repeated one, so the final pass allows it. What must never happen is a
     repeat while an unclaimed candidate the card was never shown still sits in
     its own supply — which is exactly the version of this that went red. */
  t("a review option repeats another day only when nothing else is left", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }, { ctx: "Work", n: 2 }] });
      if (!st || !st.res) return "no pack state";
      const worn = new Map();
      for (const o of st.demand) {
        const cd = st.res.assign.get(o.id);
        if (cd) worn.set(W.packLookKey(cd.ids), o.id);
      }
      let checked = 0;
      for (const occ of st.demand) {
        const opts = W.packReviewOptions(st, occ);
        const shown = new W.Set(opts.map(o => W.packLookKey(o.ids)));
        for (const opt of opts) {
          const look = W.packLookKey(opt.ids);
          checked++;
          const other = worn.get(look);
          if (!other || other === occ.id) continue;
          const spare = W.packOccCandidatesRanked(st, occ, 12)
            .filter(x => !worn.has(x.look) && !shown.has(x.look));
          if (spare.length)
            return `${occ.context || occ.level} was offered what ${other} is wearing, `
                 + `with ${spare.length} unclaimed looks it was never shown`;
        }
      }
      return checked >= 8 ? true : `vacuous: only ${checked} options across the trip`;
    }, { capsules: [c] });
  });

  /* ⚠️ AND A CARD MAY SPEND AT MOST ONE PIECE OF WEIGHT. The deal reaches past
     the bag when it can't give a card anything fresh, which is the r1 answer to
     a bag-confined review — but unbounded it becomes the app repacking the
     suitcase to win an argument about variety. Measured at the intermediate
     ordering: one card came back with three alternatives costing +2 each. */
  t("at most one review option per card costs weight", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }, { ctx: "Work", n: 2 }] });
      if (!st || !st.res) return "no pack state";
      let seenCosted = 0;
      for (const occ of st.demand) {
        const costed = W.packReviewOptions(st, occ).filter(o => o.adds);
        seenCosted += costed.length;
        if (costed.length > 1)
          return `${occ.context || occ.level} was offered ${costed.length} options that add pieces`;
      }
      // ⚠️ Vacuous if the bag is rich enough that nothing ever reaches past it.
      return seenCosted ? true : "vacuous: no card ever needed the closet";
    }, { capsules: [c] });
  });

  /* ================= 2026-08-10 r2: the review can see the wash ==========
     Her report: *"it should stop offering or flag for me if I've chosen
     something too many times for laundry. Right now I've selected the same
     t shirt 4 times and that's a problem."*

     `packCandidates` passes `cleanOnly=false` deliberately — laundry is a
     SCHEDULE constraint, not a pool filter (inversion ②) — so every option was
     legal in isolation and nothing costed the fourth wear of one tee. The
     solver knew; the review, which is where she now actually chooses, didn't.
     ⚠️ NEEDS A CLOSET WHERE THE WASH BINDS. The general fixture has eight tees
     and never runs out — the documented "fixture tidier than her closet" trap,
     and it would make every case here vacuous. Tee shirts are tolerance-1. */
  const washCloset = { replace: (add) => {
    for (let n = 0; n < 4; n++) add("tee" + n, "Tops", "Tee shirts", [2, 3]);
    for (let n = 0; n < 2; n++) add("jea" + n, "Bottoms", "Jeans", [2, 3, 4]);
    for (let n = 0; n < 2; n++) add("snk" + n, "Shoes", "Sneakers", [2, 3]);
  } };

  t("an option that would push a piece past its wears says so", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 5 }] });
      if (!st || !st.res) return "no pack state";
      const probe = W.packLaundryProbe(st);
      let checked = 0, flagged = 0;
      for (const occ of st.demand) {
        for (const opt of W.packReviewOptions(st, occ)) {
          checked++;
          const over = probe(occ.id, opt.ids).over;
          if (over.length) flagged++;
          // The flag and the schedule must agree — a note on a clean option is
          // as wrong as silence on a dirty one.
          if (!!over.length !== !!opt.laundry)
            return `${occ.date}: schedule says ${over.length} over, label says "${opt.laundry || ""}"`;
        }
      }
      if (!checked) return "vacuous: no options at all";
      return flagged ? true : "vacuous: nothing on this trip was ever past its wears";
    }, Object.assign({ capsules: [c] }, washCloset));
  });

  /* ⚠️ RANKED DOWN, NOT REMOVED. "Stop offering" has to mean "offer the clean
     ones first" — on a trip whose whole bag is over the line, removing them
     empties the card, and an empty card is the r12 partial-result bug again.
     So: no card may show a flagged option above a clean one. */
  t("clean options are offered before ones that break the wash", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 5 }] });
      if (!st || !st.res) return "no pack state";
      let mixed = 0;
      for (const occ of st.demand) {
        const flags = W.packReviewOptions(st, occ).map(o => !!o.laundry);
        if (flags.some(Boolean) && flags.some(f => !f)) mixed++;
        for (let i = 1; i < flags.length; i++)
          if (flags[i - 1] && !flags[i])
            return `${occ.date}: a flagged option was offered above a clean one`;
      }
      // ⚠️ Vacuity guard: all-clean or all-flagged cards can't order wrongly.
      return mixed ? true : "vacuous: no card offered both a clean and a flagged option";
    }, Object.assign({ capsules: [c] }, washCloset));
  });

  /* ⚠️ AND THE TRIP'S LAUNDRY ANSWER HAS TO REACH ALL OF IT (her ask: "maybe
     the bag should have a laundry setting? I will/won't do laundry on this
     trip"). The sheet writes the SAME PLAN_LAUNDRY sentinel the by-day planner
     writes, so this asserts through that sentinel rather than through the sheet:
     one wash day mid-trip, and the schedule the flags come from resets. */
  t("a wash day clears the laundry flags it should", () => {
    const c = packTrip(8);
    return withPackCloset(() => {
      const before = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 7 }] });
      const wasViol = before.res.violations.length;
      const wasFlag = before.demand.reduce((n, o) =>
        n + W.packReviewOptions(before, o).filter(x => x.laundry).length, 0);
      if (!wasViol) return "vacuous: nothing was over its wears to begin with";
      const cap = W.capsuleById.get(c.id);
      const mid = W.tripDates(cap)[4];
      cap.plan = Object.assign({}, cap.plan, { [mid]: [W.PLAN_LAUNDRY] });
      if (!W.packWashDays(cap).includes(mid)) return "fixture drift: the wash day didn't register";
      const after = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 7 }] });
      const nowViol = after.res.violations.length;
      const nowFlag = after.demand.reduce((n, o) =>
        n + W.packReviewOptions(after, o).filter(x => x.laundry).length, 0);
      return (nowViol < wasViol && nowFlag < wasFlag)
        ? true : `violations ${wasViol} -> ${nowViol}, flagged options ${wasFlag} -> ${nowFlag}`;
    }, Object.assign({ capsules: [c] }, washCloset));
  });

  /* ⚠️ A REVIEW CONFINED TO THE BAG IS A REVIEW OF A DECISION SHE WASN'T PART OF
     (2026-08-08, her report: *"it treats the pack as built… all from within one
     settled bag. If I don't like those options the way to change is not clear.
     I want input before the bag is finalized."*).

     Measured on a 7-day trip: 21 alternatives inside the bag across 8
     occasions, against 3,171 that existed in her closet at those levels —
     about 0.7%. The bag came out of packFill with no input from her, so every
     "choice" was a reshuffle of eight pieces somebody else picked. */
  /* ⚠️ A DAY SHE SCHEDULED BEATS THE SPREADER (2026-08-09, her report: "need to
     be able to schedule the contexts, not just have things auto-assigned to
     days"). Auto-placement is a proposal; a date she set is a decision.

     ⚠️ The first version silently ignored her: `_nth` is assigned as occasions
     are PLACED, so it looked for a pin on #0, found none and stopped — a pin on
     #2 was never reached, and placing pinned ones first would have renumbered
     them and changed the very id the pin is keyed on. The ids are minted up
     front now. */
  t("an occasion she schedules lands on that day, and the rest spread around it", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 3 }, { ctx: "Work", n: 2 }] });
      if (!st) return "no pack state";
      const sel = st.demand.filter(o => o.source === "selected");
      if (sel.length < 4) return `vacuous: only ${sel.length} selected occasions`;
      // Deliberately pick one that is NOT #0 — that's the case that failed.
      const target = sel.find(o => /#[1-9]/.test(o.id)) || sel[sel.length - 1];
      const want = st.demand.map(o => o.date).filter(Boolean)
        .find(d => d !== target.date);
      if (!want) return "vacuous: nowhere else to move it to";
      const rec = W.packRecord(c.id);
      W.kvData.set("pack:" + c.id, Object.assign({}, rec, { occDates: { [target.id]: want } }));
      const st2 = W.packLoadState(c.id);
      const moved = st2 && st2.demand.find(o => o.id === target.id);
      if (!moved) return `${target.id} vanished after scheduling`;
      if (moved.date !== want) return `asked for ${want}, landed on ${moved.date}`;
      // Every occasion still exists — scheduling moves, it doesn't consume.
      const after = st2.demand.filter(o => o.source === "selected").length;
      return after === sel.length ? true : `${sel.length} occasions became ${after}`;
    }, { capsules: [c] });
  });

  t("scheduling one day leaves the other days' outfits alone", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 3 }, { ctx: "Work", n: 2 }] });
      if (!st || !st.res) return "no pack state";
      W.packPersist(c.id);                       // the real path persists the solve
      const sel = st.demand.filter(o => o.source === "selected");
      const target = sel.find(o => /#[1-9]/.test(o.id)) || sel[sel.length - 1];
      const before = new W.Map();
      for (const o of sel) before.set(o.id, (st.res.assign.get(o.id) || { ids: [] }).ids.join(","));
      const want = st.demand.map(o => o.date).filter(Boolean).find(d => d !== target.date);
      if (!want) return "vacuous: nowhere else to move it to";
      W.kvData.set("pack:" + c.id, Object.assign({}, W.packRecord(c.id), { occDates: { [target.id]: want } }));
      const st2 = W.packLoadState(c.id);
      W.packEnsureSolve(st2);
      const changed = [...before.keys()].filter(id => id !== target.id)
        .filter(id => (st2.res.assign.get(id) || { ids: [] }).ids.join(",") !== before.get(id));
      return !changed.length
        ? true : `moving one day reshuffled ${changed.length} others: ${JSON.stringify(changed)}`;
    }, { capsules: [c] });
  });

  /* ================= 2026-08-09: packing from what she's worn ============
     Her report: *"what about pulling in outfits I've already worn — you KNOW
     those are outfits I would create. The packer is still creating outfits I
     wouldn't really wear."*

     Measured before the change, on a closet with a real outfit history: 298
     worn outfits fitted each occasion's level and exactly 2 survived inside the
     bag packFill had built from slot RATES. Picking pieces first is what
     destroys the combinations. */
  const withWornHistory = (fn) => withPackCloset(() => {
    // Twelve looks she has actually worn, over the standard pack fixture.
    const combos = [
      ["tee0","jea0","snk0"], ["tee1","jea0","snk0"], ["tee2","jea1","snk1"],
      ["blo0","pnt0","fla0"], ["blo1","pnt0","fla0"], ["blo2","skt0","hee0"],
      ["swt0","jea1","snk1"], ["swt1","jea2","snk2"], ["tee3","jea2","fla1"],
      ["blo3","skt1","hee1"], ["swt2","pnt1","fla1"], ["tee4","jea0","snk2"],
    ];
    W.outfits = []; W.outfitLinks = [];
    combos.forEach((ids, k) => {
      const oid = "wo" + k;
      W.outfits.push({ id: oid, name: null, layout: null, rating: null, archived: false });
      ids.forEach(id => W.outfitLinks.push({ outfit_id: oid, item_id: id }));
      // worn on distinct days, so outfitWornCount is real
      for (let n = 0; n < 2 + (k % 3); n++)
        W.wears.push({ id: `ww${k}_${n}`, item_id: ids[0], outfit_id: oid,
                       worn_on: D(-(10 + k * 4 + n)), context: ["Errands"], formality_for: 3 });
    });
    W.buildOutfitIndexes(); W.buildSuggestIndexes();
    return fn();
  });

  /* ⚠️ NOTHING MAY SCROLL THE PAGE SIDEWAYS. Wide content scrolls inside its own
     container; the column never does. The by-day fold broke this on every pack
     screen — `.frow` is width:100% and the row adds 14px side margins, so it
     overflowed its column by exactly that. Same trap as the 181px .log-cta,
     from the other side: a full-width control with margins needs calc(). */
  t("the pack screens don't scroll sideways", () => withPackCloset(() => {
    const c = packTrip(6);
    const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
    if (!st || !st.res) return "no pack state";
    W.capsuleId = c.id;
    const measure = (html) => {
      const h = W.document.createElement("div");
      h.style.cssText = "position:absolute;left:-9999px;top:0;width:390px";
      h.innerHTML = html; W.document.body.appendChild(h);
      const over = Math.round(h.scrollWidth - 390);
      h.remove(); return over;
    };
    const bits = [];
    W._packDaysOpen = false;
    const fold = measure(W.packDaysFoldHtml(st));
    if (fold > 0) bits.push(`the by-day fold overflows by ${fold}px`);
    for (const sec of ["plan", "bag", "outfits"]) {
      W._tripSection = sec;
      const over = measure(W.renderCapsuleTrip());
      if (over > 0) bits.push(`trip/${sec} overflows by ${over}px`);
    }
    W._tripSection = null;
    return bits.length ? bits.join("; ") : true;
  }, { capsules: [packTrip(6)] }));

  /* ================= 2026-08-10 r3 =====================================
     ⚠️ EVERY ROW IN THE ⋯ MENU HAS TO DO SOMETHING (her report: *"tapping 'by
     day plan' from the three dot menu doesn't do anything"*).

     The rows carried the same `data-cap-*` attributes the detail page uses, on
     the theory that the delegated handler would pick them up. It couldn't: that
     listener is on `#capsulesBody` and the sheet renders into `#moveInner`,
     outside it. So every row was dead except Locations, which had its own
     onclick — the one that didn't rely on the theory was the one that worked.
     ⚠️ Asserted on the RENDERED sheet, because that is where the wiring is: a
     test of CAPSULE_ACTIONS alone would have passed throughout the bug. */
  t("every row in the trip ⋯ menu is wired to a real action", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      W.capsuleId = c.id;
      W.openTripMoreSheet();
      const rows = [...W.document.querySelectorAll("#moveInner [data-tripmore]")];
      W.hideSheet("moveSheet");
      if (rows.length < 5) return `only ${rows.length} rows rendered`;
      for (const b of rows) {
        const act = b.dataset.tripmore;
        if (typeof b.onclick !== "function") return `"${act}" has no handler`;
        if (act !== "detail" && typeof W.CAPSULE_ACTIONS[act] !== "function")
          return `"${act}" names no action`;
      }
      return true;
    }, { capsules: [c] });
  });

  /* ⚠️ THE DAY IS HERS TO SET (her report: *"the by day plan should not auto
     assign days — I should be able to do it myself"*). The control existed but
     only on the Outfits section, so the one screen that IS about days was the
     one where a day couldn't be changed, and the app's spread read as a
     decision rather than a starting point.
     ⚠️ Only a `selected` occasion may move: its id is date-free (D6) so it keeps
     its outfit, while a declared occasion IS its date and a floor occasion is
     keyed by it. A move control on those would orphan them. */
  t("the by-day plan lets her move a day, and says whose choice it is", () => {
    const c = packTrip(6);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }, { ctx: "Work", n: 2 }],
                               rec: { built: W.todayStr() } });
      if (!st || !st.res) return "no pack state";
      W.capsuleId = c.id;
      W.packPersistSolve(st);
      const byDate = W.packPlanByDate(W.capsuleById.get(c.id));
      if (!byDate || !byDate.size) return "vacuous: the by-day plan showed nothing";
      let movable = 0, fixed = 0;
      for (const [date, entries] of byDate) {
        const h = W.document.createElement("div");
        h.innerHTML = W.packPlanCardsHtml(entries, date);
        const cards = [...h.querySelectorAll(".pack-occ")];
        entries.forEach((e, n) => {
          const has = !!cards[n].querySelector("[data-pack-moveday]");
          if (e.occ.source === "selected") { movable++; if (!has) movable = -99; }
          else { fixed++; if (has) fixed = -99; }
        });
      }
      if (movable < 0) return "an occasion she picked had no way to change its day";
      if (fixed < 0) return "a date-anchored occasion offered a move it can't honour";
      if (!movable) return "vacuous: nothing on this trip was movable";
      return W.packDaySpreadRowHtml(W.capsuleById.get(c.id)).includes("data-pack-keepdays")
        ? true : "the plan never offers to keep the days it chose";
    }, { capsules: [c] });
  });

  t("outfits she has worn are offered before invented ones", () => withWornHistory(() => {
    const c = packTrip(6);
    const slate = W.packSlate(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
    const demand = W.packDemand(slate);
    const occ = demand.find(o => o.level === 3) || demand[0];
    const pool = W.items.map(i => i.id);
    const worn = W.packWornCandidates(occ, pool, {});
    if (!worn.length) return "vacuous: no worn outfit fits this occasion";
    // Every one is genuinely a look she wore, with all pieces available.
    for (const cd of worn) {
      if (!cd.wornDays) return `${cd.ids.join(",")} was offered with 0 wear-days`;
      if (cd.proven !== W.PACK_PROVEN_TIER.worn) return `wrong tier: ${cd.proven}`;
    }
    // And they lead the candidate list the solver actually reads.
    const cands = W.packCandidates(occ, pool, { all: true });
    const firstMade = cands.findIndex(x => x.proven === W.PACK_PROVEN_TIER.made);
    const lastWorn = cands.map(x => x.proven).lastIndexOf(W.PACK_PROVEN_TIER.worn);
    /* ⚠️ VACUITY GUARD, and it was needed: without it "no generated candidates
       at all" satisfied the ordering trivially, and the case survived a
       mutation that put generated candidates FIRST. An ordering assertion needs
       both kinds present to mean anything. */
    if (firstMade === -1) return `vacuous: no generated candidates to be ordered against (${cands.length} total)`;
    if (lastWorn === -1) return `vacuous: no worn candidates in the list`;
    return lastWorn < firstMade
      ? true : `a generated candidate (#${firstMade}) came before a worn one (#${lastWorn})`;
  }));

  /* ⚠️ THE SEED IS WHAT MAKES THE TIERS REAL. Without it the proven candidates
     are filtered to a bag chosen on other grounds and almost none survive —
     measured 2 of 298. */
  t("the bag is seeded from outfits she has worn", () => withWornHistory(() => {
    const c = packTrip(6);
    const slate = W.packSlate(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
    const demand = W.packDemand(slate);
    const seed = W.packProvenSeed(demand, { poolIds: W.items.map(i => i.id) });
    if (!seed.ids.length) return "vacuous: nothing was seeded";
    // ⚠️ Distinct looks, or this degenerates to one outfit for the whole trip —
    // measured: 8 occasions collapsed to 1 outfit and 2 pieces.
    const looks = [...seed.byOcc.values()].map(cd => W.packLookKey(cd.ids));
    if (looks.length !== new W.Set(looks).size)
      return `the seed reused a look ${looks.length - new W.Set(looks).size}×`;
    // Every seeded piece belongs to an outfit she actually wore.
    const wornIds = new W.Set();
    for (const o of W.outfits) if (W.outfitWornCount(o) > 0)
      (W.outfitItemMap.get(o.id) || []).forEach(id => wornIds.add(id));
    const stray = seed.ids.filter(id => !wornIds.has(id));
    return !stray.length ? true : `seeded ${JSON.stringify(stray)}, which no worn outfit uses`;
  }));

  /* ⚠️ A TIER, NOT A THUMB ON THE SCALE (her decision). The bonus must never
     buy a bigger bag, a repeated look, or a laundry violation — it decides
     between otherwise-equal candidates and no more. Asserted against the cost
     terms directly, because a downstream outcome can't tell the difference
     between "preferred" and "forced". */
  t("the proven bonus can never outrank a piece, a repeat, or clean laundry", () => {
    const bits = [];
    if (!(W.PACK_WORN_BONUS < 1000)) bits.push(`worn bonus ${W.PACK_WORN_BONUS} >= one added piece (1000)`);
    if (!(W.PACK_WORN_BONUS < W.PACK_REPEAT_DAY)) bits.push(`worn bonus outranks a repeated day`);
    if (!(W.PACK_WORN_BONUS < 5000)) bits.push(`worn bonus outranks a laundry violation`);
    if (!(W.PACK_SHAPE_BONUS < W.PACK_WORN_BONUS)) bits.push(`a shape outranks an actual wearing`);
    return bits.length ? bits.join("; ") : true;
  });

  t("the review can reach outside the bag, and says what that costs", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
      if (!st || !st.res) return "no pack state";
      const occ = W.packReviewQueue(st)[0];
      if (!occ) return "vacuous: nothing to review";
      const bag = new W.Set(st.pack);
      const beyond = W.packReviewBeyond(st, occ);
      if (!beyond.length) return "vacuous: the closet offered nothing beyond the bag";
      for (const o of beyond) {
        // Every one must genuinely leave the bag, and must know its own price.
        if (o.ids.every(id => bag.has(id))) return `an option was entirely in the bag already`;
        const real = o.ids.filter(id => !bag.has(id)).length;
        if (o.adds !== real) return `stated +${o.adds}, actually adds ${real}`;
      }
      // Cheapest first — packing light is the default preference.
      const adds = beyond.map(o => o.adds);
      return adds.every((n, k) => k === 0 || adds[k - 1] <= n)
        ? true : `not cheapest-first: ${JSON.stringify(adds)}`;
    }, { capsules: [c] });
  });

  /* Choosing one has to actually put it in the bag, or the outfits screen and
     the items screen disagree — inversion ①. This works through packRepack's
     union, which is the second thing that fix bought. */
  /* ⚠️ THE COUNT ON A SCREEN MUST MATCH THE LIST UNDER IT, and the options page
     failed both halves at once when it was first rendered (2026-08-09): it said
     "52 from your bag" while showing 40, and TWO tiles rendered as "What you
     have now" because the raw enumeration contained outfits differing only by
     shoes — the fake variety r13 took out of the solver, padding a list she'd
     asked to be long. Deduping on packLookKey fixes both. Found by rendering
     the page and reading it; the markup was fine. */
  t("the options screen shows no two of the same look, and counts what it shows", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
      if (!st || !st.res) return "no pack state";
      const occ = W.packReviewQueue(st)[0];
      if (!occ) return "vacuous: nothing to review";
      W.capsuleId = c.id;
      W._packOptsOcc = occ.id;
      const html = W.renderPackOptionsPage();
      const d = W.document, host = d.createElement("div");
      host.style.cssText = "position:absolute;left:-9999px;top:0;width:390px";
      host.innerHTML = html; d.body.appendChild(host);
      try {
        const tiles = [...host.querySelectorAll(".pack-opt-tile")];
        if (tiles.length < 3) return `vacuous: only ${tiles.length} options rendered`;
        const keys = tiles.map(t => W.packLookKey(t.dataset.packIds.split(",")));
        if (keys.length !== new W.Set(keys).size)
          return `${keys.length - new W.Set(keys).size} tiles repeat a look`;
        // Exactly one tile is her current outfit — two means packDistinct and
        // the list disagree about what "the same outfit" means.
        const cur = host.querySelectorAll(".pack-opt-tile.on").length;
        if (cur > 1) return `${cur} tiles claim to be the current outfit`;
        const m = host.innerText.replace(/[ \t]+/g, " ").match(/(\d+) from your bag(?: \u00b7 (\d+) more)?/);
        if (!m) return "no count line";
        const stated = (+m[1]) + (m[2] ? +m[2] : 0);
        return stated === tiles.length
          ? true : `says ${stated}, shows ${tiles.length}`;
      } finally { host.remove(); W._packOptsOcc = null; }
    }, { capsules: [c] });
  });

  t("choosing an outfit from outside the bag adds its pieces", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
      if (!st || !st.res) return "no pack state";
      const occ = W.packReviewQueue(st)[0];
      const beyond = W.packReviewBeyond(st, occ);
      if (!beyond.length) return "vacuous: nothing beyond the bag";
      const pick = beyond[0];
      const before = st.pack.length;
      st.res.assign.set(occ.id, { ids: pick.ids.slice(), pieces: [], score: 0 });
      W.packRepack(st);
      const bag = new W.Set(st.pack);
      const missing = pick.ids.filter(id => !bag.has(id));
      if (missing.length) return `chose it, but ${JSON.stringify(missing)} never entered the bag`;
      return st.pack.length > before
        ? true : `bag stayed at ${before} despite adding ${pick.adds} new pieces`;
    }, { capsules: [c] });
  });

  t("choosing an outfit takes it out of the queue and locks it", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
      if (!st || !st.res) return "no pack state";
      const before = W.packReviewQueue(st).length;
      if (!before) return "vacuous: the queue was already empty";
      const occ = W.packReviewQueue(st)[0];
      // The record is the state (inversion ③) — assert on it, not on a render.
      W.kvData.set("pack:" + c.id, Object.assign({}, W.packRecord(c.id),
        { chosen: [occ.id], locked: [occ.id] }));
      const after = W.packReviewQueue(st).length;
      const locked = new W.Set(W.packRecord(c.id).locked || []);
      return (after === before - 1 && locked.has(occ.id))
        ? true : `queue ${before} -> ${after}, locked=${locked.has(occ.id)}`;
    }, { capsules: [c] });
  });

  /* ⚠️ AND A CHOICE RE-PLANS THE REST OF THE TRIP AROUND IT (2026-08-10, her
     ask: *"once I've selected an option, the pack is reoptimized around all
     locked outfits/items automatically again"*).

     The choice already locked the occasion and packEnsureSolve already knew how
     to solve around locks — nothing asked it to, so a choice stayed local and
     the other days kept outfits chosen against a bag she had just changed.

     ⚠️ ASSERTED ON THE MECHANISM, NOT ON "SOMETHING ELSE MOVED", and the first
     version of this case made exactly that mistake. Whether a re-solve changes
     another day is the SOLVER's business — holding one more lock can perfectly
     well leave the same optimum, and it did on one fixture and moved five days
     on another. A case asserting the outcome measures the fixture.
     So: break a day by dropping a piece it needs, then choose an outfit for a
     different day. Only a re-solve can fill the broken one back in, and if none
     runs it stays empty. Deterministic, and it is the user-visible promise.
     ⚠️ The other half is the one that silently rots: an EARLIER choice has to
     survive the next re-solve, which it does only because each choice locks its
     own occasion. A re-solve that dropped the locks would still pass the first
     half on its own.
     ⚠️ Async, so it needs withPackClosetA — the sync wrapper restores the closet
     in a `finally` and the fixture would be gone by the first await.
     ⚠️ The kv freshness READ must fail rather than return []: kvUpdate reads []
     as "the row is gone" and re-applies the patch to an empty record, which
     wipes the pack and makes this case pass for the wrong reason. */
  await ta("choosing an outfit re-plans the other days, and earlier choices hold", async () => {
    const c = packTrip(6);
    const saved = { rest: W.rest, render: W.renderCapsules, toast: W.toast, cid: W.capsuleId };
    W.rest = async (path) => { if (String(path).startsWith("/kv?")) throw new Error("stub"); return []; };
    W.renderCapsules = () => {}; W.toast = () => {};
    try {
      return await withPackClosetA(async () => {
        const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }, { ctx: "Work", n: 2 }] });
        if (!st || !st.res) return "no pack state";
        const chooser = st.demand.find(o => o.context === "Errands");
        const alt1 = chooser && W.packReviewOptions(st, chooser)[0];
        if (!alt1) return "vacuous: nothing to choose";
        // Break a DIFFERENT day: drop a piece it needs and the chosen one doesn't.
        const victim = st.demand.find(o => {
          const cd = st.res.assign.get(o.id);
          return o.id !== chooser.id && cd && cd.ids.some(id => !alt1.ids.includes(id));
        });
        if (!victim) return "vacuous: no other dressed day to break";
        const piece = st.res.assign.get(victim.id).ids.find(id => !alt1.ids.includes(id));
        await W.packDropPiece(piece);
        if (W._packState.res.assign.get(victim.id)) return "fixture drift: dropping the piece didn't break that day";
        /* ⚠️ COUNTED EXCLUDING THE DAY SHE CHOOSES FOR, and the first version
           didn't — dropping a piece can break the chooser's own outfit too, so
           setting it counted as "one fewer broken day" and the case passed with
           the re-solve deleted. It survived its own mutation check by measuring
           the choice itself. */
        const stillBroken = () => [...st.demand]
          .filter(o => o.id !== chooser.id && !W._packState.res.assign.get(o.id)).length;
        const broken = stillBroken();
        if (!broken) return "fixture drift: no OTHER day was left without an outfit";

        await W.packChooseOutfit(chooser.id, alt1.ids);
        if (stillBroken() >= broken) return `${broken} other days had no outfit and the choice re-planned none of them`;

        const second = W._packState.demand.find(o => o.context === "Errands" && o.id !== chooser.id);
        const alt2 = second && W.packReviewOptions(W._packState, second)[0];
        if (!alt2) return "vacuous: no second occasion to choose for";
        await W.packChooseOutfit(second.id, alt2.ids);
        const held = (id, ids) => {
          const cd = W._packState.res.assign.get(id);
          return cd && cd.ids.join(",") === ids.slice().sort().join(",");
        };
        if (!held(chooser.id, alt1.ids)) return "the first choice was overwritten by the second re-solve";
        return held(second.id, alt2.ids) ? true : "the second choice didn't stick";
      }, { capsules: [c] });
    } finally {
      W.rest = saved.rest; W.renderCapsules = saved.render; W.toast = saved.toast;
      W.capsuleId = saved.cid; W._packState = null;
      W.kvData.delete("pack:" + c.id);
    }
  });

  /* ⚠️ UNLOCKING RE-OPENS THE QUESTION (2026-08-10 r2, her ask: *"if I unlock an
     outfit, I want it to show me the alternatives again"*). A choice writes both
     `chosen` (decided — the review row hides) and `locked` (held through every
     re-solve); unlock only ever cleared the second, so the card came back
     editable with nothing to compare against.
     ⚠️ Asserted on the RENDERED card, not on the record: the record is two
     flags and the thing she reported is what the card shows. */
  await ta("unlocking an outfit brings its alternatives back", async () => {
    const c = packTrip(6);
    const saved = { rest: W.rest, render: W.renderCapsules, toast: W.toast, cid: W.capsuleId };
    W.rest = async (path) => { if (String(path).startsWith("/kv?")) throw new Error("stub"); return []; };
    W.renderCapsules = () => {}; W.toast = () => {};
    try {
      return await withPackClosetA(async () => {
        const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }, { ctx: "Work", n: 2 }] });
        if (!st || !st.res) return "no pack state";
        const occ = st.demand.find(o => o.context === "Errands");
        const asks = () => {
          const s = W._packState;
          return W.packOccCardHtml(s, s.demand.find(o => o.id === occ.id)).includes("pack-review-q");
        };
        if (!asks()) return "vacuous: the card wasn't asking before she chose";
        const alt = W.packReviewOptions(st, occ)[0];
        if (!alt) return "vacuous: nothing to choose";
        await W.packChooseOutfit(occ.id, alt.ids);
        if (asks()) return "the card kept asking after she chose";
        await W.packToggleLock(occ.id);                      // unlock
        if (!asks()) return "unlocking left the card with no alternatives";
        return W.packReviewOptions(W._packState, W._packState.demand.find(o => o.id === occ.id)).length
          ? true : "the card asks but has nothing to offer";
      }, { capsules: [c] });
    } finally {
      W.rest = saved.rest; W.renderCapsules = saved.render; W.toast = saved.toast;
      W.capsuleId = saved.cid; W._packState = null; W.kvData.delete("pack:" + c.id);
    }
  });

  /* ⚠️ WHAT SHE ADDS BY HAND IS PART OF THE PLAN, NOT LUGGAGE (2026-08-10 r3,
     her ask: *"make sure adding items individually works as expected, including
     incorporating into suggested outfits — I want the packing algorithm to try
     to use the whole list unless I mark something as 'do not plan'"*).

     Two failures compounded. A hand-added piece went into the bag unmarked, so
     it counted as "spare" — the mode's trim could drop it and packSyncMembers
     would then delete it from the trip. And `res = null` never produced a new
     solve, because the stored assignment still described the trip perfectly and
     the rehydrate guard passed: the piece sat in the suitcase with no outfit
     knowing about it.
     ⚠️ Asserted at LIGHT, the mode most likely to trim, or the survival half is
     about a mode that wasn't trimming anything. */
  await ta("a piece added by hand survives and gets into an outfit", async () => {
    const c = packTrip(6);
    const saved = { rest: W.rest, render: W.renderCapsules, toast: W.toast, cid: W.capsuleId };
    W.rest = async (path) => { if (String(path).startsWith("/kv?")) throw new Error("stub"); return []; };
    W.renderCapsules = () => {}; W.toast = () => {};
    try {
      return await withPackClosetA(async () => {
        const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }, { ctx: "Work", n: 2 }],
                                 rec: { built: W.todayStr(), mode: "light" } });
        if (!st || !st.res) return "no pack state";
        await W.packPersist(c.id);
        const add = W.items.filter(i => !st.pack.includes(i.id)).slice(0, 3).map(i => i.id);
        if (add.length < 3) return "vacuous: the closet had nothing outside the bag";
        await W.addItemsToCapsule(c.id, add);
        const st2 = W.packStateReady(c.id);          // how a screen reaches it
        await W.packPersist(c.id);
        const used = new Set();
        for (const cd of st2.res.assign.values()) for (const id of cd.ids) used.add(id);
        const members = (W.capsuleLinkMap.get(c.id) || []).map(l => l.item_id);
        const gone = add.filter(id => !st2.pack.includes(id) || !members.includes(id));
        if (gone.length) return `${gone.length} of 3 added pieces were dropped from the trip`;
        return add.some(id => used.has(id))
          ? true : "none of the added pieces reached an outfit";
      }, { capsules: [c] });
    } finally {
      W.rest = saved.rest; W.renderCapsules = saved.render; W.toast = saved.toast;
      W.capsuleId = saved.cid; W._packState = null; W.kvData.delete("pack:" + c.id);
    }
  });

  /* ⚠️ AND "DON'T PLAN AROUND IT" IS THE OPT-OUT, not a delete. The piece stays
     packed and stays on the checklist; only the outfit building stops. It is
     deliberately NOT `banned`, which means "keep it out of the bag".
     ⚠️ It implies kept, or it would be a slow way of deleting: a piece nothing
     plans around is in no outfit, which makes it spare, which the mode trims. */
  await ta("\"don't plan around it\" keeps the piece and drops it from the outfits", async () => {
    const c = packTrip(6);
    const saved = { rest: W.rest, render: W.renderCapsules, toast: W.toast,
                    cid: W.capsuleId, busy: W._packBusy };
    W.rest = async (path) => { if (String(path).startsWith("/kv?")) throw new Error("stub"); return []; };
    W.renderCapsules = () => {}; W.toast = () => {};
    try {
      return await withPackClosetA(async () => {
        const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }, { ctx: "Work", n: 2 }],
                                 rec: { built: W.todayStr() } });
        if (!st || !st.res) return "no pack state";
        await W.packPersist(c.id);
        const usedIds = () => {
          const u = new W.Set();
          for (const cd of W._packState.res.assign.values()) for (const id of cd.ids) u.add(id);
          return u;
        };
        const victim = [...usedIds()].find(id => (W.itemById.get(id) || {}).category === "Tops");
        if (!victim) return "vacuous: no top was in an outfit to begin with";
        W._packSel.clear(); W._packSel.add(victim);
        await W.packNoPlanSelected(true);
        if (usedIds().has(victim)) return "it is still in an outfit";
        if (!W._packState.pack.includes(victim)) return "it was taken out of the bag";
        if (!(W.capsuleLinkMap.get(c.id) || []).some(l => l.item_id === victim))
          return "it was removed from the trip";
        if (W._packState.demand.some(o => W.packReviewOptions(W._packState, o).some(x => x.ids.includes(victim))))
          return "the review still offers outfits built from it";
        // …and it comes back.
        W._packSel.clear(); W._packSel.add(victim);
        await W.packNoPlanSelected(false);
        return usedIds().has(victim) ? true : "unmarking it didn't put it back in the plan";
      }, { capsules: [c] });
    } finally {
      W.rest = saved.rest; W.renderCapsules = saved.render; W.toast = saved.toast;
      W.capsuleId = saved.cid; W._packBusy = saved.busy;
      W._packState = null; W._packSel.clear(); W.kvData.delete("pack:" + c.id);
    }
  });

  /* ⚠️ SKIPPING IS NOT CHOOSING. "These all look fine" marks them decided so
     the queue empties, but must NOT lock them — locking what she merely didn't
     object to would make a later re-solve refuse to improve days she never
     actually looked at. */
  t("skipping the review doesn't lock what she didn't choose", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }] });
      if (!st || !st.res) return "no pack state";
      const all = st.demand.filter(o => st.res.assign.get(o.id)).map(o => o.id);
      if (!all.length) return "vacuous: nothing was dressed";
      W.kvData.set("pack:" + c.id, Object.assign({}, W.packRecord(c.id), { chosen: all }));
      const queue = W.packReviewQueue(st).length;
      const locked = (W.packRecord(c.id).locked || []).length;
      return (queue === 0 && locked === 0)
        ? true : `queue=${queue} locked=${locked}`;
    }, { capsules: [c] });
  });

  /* Core is what her outfits actually use; the mode may only ever trim SPARE.
     If a mode change could drop a piece an outfit needs, the items screen and
     the outfits screen would disagree — the thing inversion ① exists to stop. */
  t("no mode can trim a piece an outfit needs", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      for (const mode of W.PACK_MODES) {
        const st = appSolve(c, { tripContexts: [{ ctx: "Errands", n: 4 }], rec: { mode } });
        if (!st || !st.res) return `no pack state at ${mode}`;
        const bag = new W.Set(st.pack);
        for (const cd of st.res.assign.values())
          for (const id of cd.ids)
            if (!bag.has(id)) return `${mode} trimmed ${id}, which an outfit uses`;
      }
      return true;
    }, { capsules: [c] });
  });

  /* The mechanism behind it, asserted directly so a future "simplification" of
     packRepack back into a rebuild can't pass. The bag must be a SUPERSET of the
     outfits' pieces (inversion ① still holds — every outfit is fully packed),
     not the minimum such set. */
  t("packRepack keeps the bag it was given, it doesn't rebuild it", () => {
    const c = packTrip(7);
    return withPackCloset(() => {
      const st = appSolve(c, { K: 3, tripContexts: [{ ctx: "Errands", n: 4 }] });
      if (!st || !st.res) return "no pack state";
      const used = new W.Set();
      for (const cd of st.res.assign.values()) for (const id of cd.ids) used.add(id);
      const bag = new W.Set(st.pack);
      const missing = [...used].filter(id => !bag.has(id));
      if (missing.length) return `outfits use pieces not in the bag: ${JSON.stringify(missing)}`;
      // Vacuity guard: if the outfits happened to use everything, "superset" is
      // trivially true and this case is asserting nothing.
      if (bag.size === used.size) return `vacuous: every one of the ${bag.size} pieces is in an outfit`;
      return bag.size > used.size
        ? true : `bag ${bag.size} vs ${used.size} used`;
    }, { capsules: [c] });
  });

  /* ⚠️ LEAN MEANS A SMALLER BAG, NOT A REPEATED OUTFIT (her decision,
     2026-08-06 r2). The old target was `ceil(n/2)` at lean — four days of one
     context asked for two looks and got exactly that, by design, and the design

  /* ⚠️ Positional ids (`${date}#${index}`) meant unticking a context renumbered
     everything after it, and the rehydrate guard — which only asked whether the
     pieces were still in the bag — happily handed the REMOVED occasion's outfit
     to whatever moved into its slot. She saw the outfit she'd deleted, relabelled. */
  /* ⚠️ THE STORED OUTFITS ARE HAND-PICKED, NOT WHAT THE SOLVER WOULD CHOOSE, and
     that is the whole design of these two cases. A first version stored the
     solver's own answer and passed under every mutation — including one that
     removed the partial-rehydrate machinery outright — because the solver is
     deterministic and simply reproduced the same picks. It asserted nothing.
     A deliberately odd assignment can only survive by being READ, never by
     being recomputed. */
  const HAND_WORK = ["blo0", "pnt0", "fla0"];       // a Work outfit, level 5
  const HAND_ERR = ["tee7", "jea2", "snk2"];        // an Errands outfit, level 3
  const storeAssign = (c, demand, pick, contexts) => {
    const assign = {}, sig = {};
    for (const o of demand) {
      const ids = pick(o);
      if (ids) assign[o.id] = ids.slice().sort();
      sig[o.id] = W.packOccSig(o);
    }
    W.kvData.set("pack:" + c.id, { built: today, assignV: 2, K: 2,
                                   pieces: W.items.map(i => i.id),
                                   contexts, assign, occSig: sig });
    W._packState = null;
    return assign;
  };

  t("unticking a context leaves the others' outfits exactly where they were", () => {
    const c = packTrip(6);

      const work = demand.filter(o => o.context === "Work");
      if (work.length !== 2) return `vacuous: ${work.length} Work occasions`;
      storeAssign(c, demand, o => o.context === "Work" ? HAND_WORK
        : o.context === "Errands" ? HAND_ERR : HAND_ERR, [{ ctx: "Work", n: 2 }]);
      const st2 = W.packLoadState(c.id);
      W.packEnsureSolve(st2);
      for (const o of work) {
        const cd = st2.res.assign.get(o.id);
        if (!cd) return `Work occasion ${o.id} lost its outfit`;
        if (cd.ids.join(",") !== HAND_WORK.slice().sort().join(","))
          return `Work occasion ${o.id} was re-solved: ${cd.ids.join(",")}`;

      return st2.demand.some(o => o.context === "Errands") ? "Errands survived the untick" : true;

  t("reopening a solved pack does not re-enter the solver", () => {

        let s = dayWorn.get(id); if (!s) dayWorn.set(id, s = new Set());

     option counts and the dial was decorative — but what it buys is BAG SIZE,
     not repetition. Measured on this fixture at the moment of the change:
     lean 6 pieces / worst top worn 1 day, cushion 7 pieces / worst top 1 day. */
  /* ⚠️ Needs a SCARCE closet, and the reason is worth writing down: on the roomy
     general fixture the solver spreads tops perfectly at every setting, so the
     dial has nothing to trade and the case passes vacuously. The pressure comes
     from high-tolerance tops being available — a sweater (tolerance 4) makes
     reuse cheap, so Lean takes it and Cushion pays a piece to avoid it.
     This case was silently defanged once already by an unrelated change to the
     plane-day occasion's LEVEL, which split the trip across two levels and
     removed the scarcity. Hence the explicit closet. */
  const scarceTops = (add) => {
    add("swtA", "Tops", "Sweaters", [3]);      // tolerance 4 — reuse is cheap
    add("swtB", "Tops", "Sweaters", [3]);
    add("teeA", "Tops", "Tee shirts", [3]);    // tolerance 1 — one day each
    add("teeB", "Tops", "Tee shirts", [3]);
    add("jeaA", "Bottoms", "Jeans", [3]);
    add("jeaB", "Bottoms", "Jeans", [3]);
    add("snkA", "Shoes", "Sneakers", [3]);
  };
  /* Distinct OUTFITS, judged the way the app judges them: packLookKey is the
     piece set minus shoes, so two looks that differ only by shoes are one look
     (r13). This is the right unit for "does lean repeat more than cushion" —
     see the case below for why the old top-day measure was the wrong one. */
  const distinctLooks = (demand, res) => {
    const s = new W.Set();
    for (const o of demand) {
      const cd = res.assign.get(o.id);
      if (cd) s.add(W.packLookKey(cd.ids));
    }
    return s.size;
  };
  t("Lean packs a smaller bag than Cushion, and repeats no more", () => withPackCloset(() => {
    const c = packTrip(6);
    /* ⚠️ `ctx`/`n`, not `context`/`per` — packSlate reads those keys. This test
       carried the old spelling from before the 2026-07-30 r5 flat-list rework
       and had been silently solving a degenerate slate ever since: every
       occasion came out with context `undefined` and level null, so K couldn't
       bite and lean and cushion returned the identical pack. It was RED on main
       and nothing had noticed, because a failing assertion still looks like a
       test doing its job.

       ⚠️ IT THEN WENT RED AGAIN, AND THE MEASURE WAS THE PROBLEM (2026-08-08
       audit). It asserted repetition with `topSpread` — the most DAYS any one
       top went out — and on a scarce closet a smaller bag makes that
       arithmetically impossible to hold: four tops cannot dress four occasions
       and also shrink. But her model is recombination (2026-08-06 r2: *"small
       numbers of clothes can make lots of different outfits"*), and one top worn
       with two different bottoms is two different OUTFITS, not a repeat. Asked
       directly, she confirmed that's fine. So the contract is distinct looks,
       which is also the unit packLookKey, packDistinct and packOptionCount all
       already use. A guard case measuring something stricter than the decision
       it guards will go red for the right reason and send you to the wrong
       place — it sent one round at `repW` before a mutation ruled it out. */
    const tripContexts = [{ ctx: "Errands", n: 4 }];
    const lean = solveFor(c, { K: 1, tripContexts });
    const cush = solveFor(c, { K: 3, tripContexts });
    const lp = lean.res.pack.length, up = cush.res.pack.length;
    const l = distinctLooks(lean.demand, lean.res), u = distinctLooks(cush.demand, cush.res);
    const bits = [];
    // The dial's whole remaining job: fewer pieces at Lean.
    if (!(lp < up)) bits.push(`lean packed ${lp}, cushion ${up} — the dial changed nothing`);
    // And the smaller bag must not be bought back with a repeated OUTFIT.
    if (l < u) bits.push(`lean made ${l} distinct outfits vs cushion's ${u}`);
    return bits.length ? bits.join("; ") : true;
  }, { replace: scarceTops }));

  /* ================= ITEMS FIRST (2026-07-30 redesign) =================

  const itemsFirst = (c, opt = {}) => {

    const targets = opt.targets || counts.slots;
    const fill = W.packFill(targets, { c, demand, rack, pinned: opt.pinned, subTargets: opt.subTargets });
    const cov = W.packCoverage(fill.pack, demand, {});
    return { slate, demand, rack, counts, targets, fill, cov };
  };

  /* ⚠️ THE REGRESSION THIS ENGINE WAS REWRITTEN FOR. Scoring bare "does anything

     work day: every level was technically covered, the remaining picks fell

  /* Composed behaviour: a level with several occasions must not hang on one top.
     ⚠️ Two earlier versions of this case were VACUOUS and both were caught by
     mutation, which is worth recording because the reason is architectural:
     when the pool comes from buildRack, the rack's own formality top-up
     (RACK_LEVEL_MIN = 2) already guarantees two L5 tops, so nothing in packFill
     is on trial. This case therefore guards the COMPOSED pipeline; the case
     below isolates packFill's own scoring against a hand-built pool. */
  t("a level with several occasions never hangs on a single top (end to end)", () => withPackCloset(() => {
    const c = packTrip(6);
    const r = itemsFirst(c, { tripContexts: [{ ctx: "Work", n: 5 }] });
    const occAt = new Map();
    for (const o of r.demand) if (o.level) occAt.set(o.level, (occAt.get(o.level) || 0) + 1);
    const piecesAt = new Map();
    for (const id of r.fill.pack) {
      const i = W.itemById.get(id);
      const slot = W.suggestSlot(i);
      if (slot !== "Tops" && slot !== "Dresses") continue;
      for (const lv of (W.itemFormalitySet(i) || [])) {
        if (!occAt.has(lv)) continue;
        piecesAt.set(lv, (piecesAt.get(lv) || 0) + 1);
      }
    }
    const thin = [...occAt.entries()]
      .filter(([lv, n]) => n >= 2 && (piecesAt.get(lv) || 0) < 2)
      .map(([lv, n]) => [lv, n, piecesAt.get(lv) || 0]);
    return !thin.length
      ? true : `[level, occasions, topsReachingIt]: ${JSON.stringify(thin)}`;
  }));

     pool is handed in directly and is tee-heavy, so bare-coverage scoring fills
     up on tees and leaves one L5 top. This is the case that actually goes red

  /* Isolates the per-level CAPACITY term specifically. Every candidate is the
     same subcategory and the same tolerance, so the subcategory-diversity
     penalty is uniform and cannot be what produces the answer — only counting
     how many wear-days each level still needs can. Without it, bare coverage

     ⚠️ This case exists because measurement showed the capacity term carried

  t("packFill weights levels by how many wear-days they still need", () => withPackCloset(() => {

  t("reopening a trip returns the stored pack, and doesn't solve to do it", () => withPackCloset(() => {
    /* Inversion ③: reopening must not hand her a different pack. Since the

       st.res starts null. */
    const c = packTrip(5);

    return same && lazy ? true : `pack=${JSON.stringify(st && st.pack)} resWasComputed=${st && st.res !== null}`;
  }));

  t("dropping a piece breaks its days instead of silently re-solving", () => withPackCloset(() => {
    const c = packTrip(5);
    const { demand, res } = solveFor(c);
    const victim = res.pack.find(id => [...res.assign.values()].some(cd => cd.ids.includes(id)));
    const before = [...res.assign.keys()].length;
    // Simulate the drop the way packDropPiece does, then ask for consequences.
    const st = { cid: c.id, c, demand, res, rack: null, K: 2 };
    res.pack = res.pack.filter(id => id !== victim);
    const broken = demand.filter(o => { const cd = res.assign.get(o.id); return cd && cd.ids.includes(victim); });
    for (const o of broken) res.assign.delete(o.id);
    const cons = W.packConsequences(st);
    return broken.length > 0 && [...res.assign.keys()].length === before - broken.length
        && cons.broken.length === broken.length
      ? true : `broken=${broken.length} cons=${cons.broken.length}`;
  }));

    const c = packTrip(5);

    const occ = st.demand.find(o => st.res.assign.has(o.id) && o.level >= 4) || st.demand[0];
    const cd = st.res.assign.get(occ.id);
    if (!cd) return "no assignment to swap";
    const piece = cd.ids[0];
    const cands = W.packSwapCandidates(full, occ, cd, piece);
    const oldSlot = W.suggestSlot(W.itemById.get(piece));
    const bad = cands.filter(i => W.suggestSlot(i) !== oldSlot && !(oldSlot === "Outerwear" && W.isLayer(i)));
    const wrongLevel = cands.filter(i => !(W.itemFormalitySet(i) || []).includes(occ.level));
    return !bad.length && !wrongLevel.length && !cands.some(i => i.id === piece)
      ? true : `n=${cands.length} wrongSlot=${bad.length} wrongLevel=${wrongLevel.length}`;

  const packDayFixture = (sameOutfit) => {

    return { cid: c.id, c, slate, demand, rack: { ids: [] }, K: 2,
             res: { pack: a.concat(b), assign, options, unmet: [], violations: [], stats: {} } };
  };

  t("logging a piece twice in one day is still one wear", () => withWearCloset(() => {

  const withWeekCloset = (fn) => {
    const saved = { items: W.items, wears: W.wears, outfits: W.outfits, outfitLinks: W.outfitLinks,
                    byId: W.itemById, plan: W.kvData.get("dayplan"), wash: W.kvData.get("washdays") };

    ];
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    W.outfits = [{ id: "o1", name: "Uniform", archived: false }];
    W.outfitLinks = [{ outfit_id: "o1", item_id: "jea" }, { outfit_id: "o1", item_id: "boo" }];
    W.wears = [];
    W.buildOutfitIndexes();
    try { return fn(); }
    finally {
      W.items = saved.items; W.wears = saved.wears; W.outfits = saved.outfits;
      W.outfitLinks = saved.outfitLinks; W.itemById = saved.byId;
      if (saved.plan === undefined) W.kvData.delete("dayplan"); else W.kvData.set("dayplan", saved.plan);
      if (saved.wash === undefined) W.kvData.delete("washdays"); else W.kvData.set("washdays", saved.wash);
      W.buildOutfitIndexes();
    }
  };
  const weekDates = () => [...Array(7)].map((_, n) => D(n));

  t("the forecast names the DAY a piece runs out, not just that it will", () => withWeekCloset(() => {
    // jeans tolerance 5, worn 0 times since the wash; planned every day
    const plans = {};
    for (const d of weekDates()) plans[d] = [{ contexts: [], outfit: "o1" }];
    const fc = W.weekLaundryForecast(weekDates(), { plans, wearRows: [], washSet: {} });
    // days 0-4 are fine, day 5 is the 6th wear → over, and it's reported once
    return eq([fc.firstOverflow, [...fc.byDate.keys()]], [D(5), [D(5)]]);
  }));

  /* ⚠️ Seeded from real history, not from zero. A jean already at 4 of 5 on
     Monday is ONE wear from the hamper all week — planRewearFlags fixed exactly

  t("the forecast seeds from wears already on the clock", () => withWeekCloset(() => {
    const plans = {}; for (const d of weekDates()) plans[d] = [{ contexts: [], outfit: "o1" }];

  const withGapCloset = (fn) => {

                    byId: W.itemById, caps: W.capsules, links: W.capsuleLinks, exc: W.exclusions };

    // plenty of casual everything…

      W.items.push(mk("top" + n, "Tops", "Tee shirts", [3]));
      W.items.push(mk("bot" + n, "Bottoms", "Jeans", [3]));
      W.items.push(mk("sho" + n, "Shoes", "Sneakers", [3]));

    for (let n = 0; n < 3; n++) W.items.push(mk("heel" + n, "Shoes", "Heels", [6]));

      W.items.push(mk("blouse" + n, "Tops", "Blouses", [6]));
      W.items.push(mk("skirt" + n, "Bottoms", "Skirts", [6]));
    }
    W.itemById = new Map(W.items.map(i => [i.id, i]));
    // Symphony is level 6 by seed and needs GAP_MIN_CTX_DAYS logged days
    W.wears = [];
    for (let n = 0; n < 8; n++)
      W.wears.push({ item_id: "heel0", worn_on: `2026-05-0${(n % 9) + 1}`, context: ["Symphony"], formality_for: 6 });
    W.outfits = []; W.outfitLinks = []; W.capsules = []; W.capsuleLinks = []; W.exclusions = [];
    W.buildOutfitIndexes(); W.buildCapsuleIndexes(); W.buildExcludeSet();
    W._thinBaseMemo = null;
    try { return fn(); } finally {
      W.items = saved.items; W.wears = saved.wears; W.outfits = saved.outfits;
      W.outfitLinks = saved.outfitLinks; W.itemById = saved.byId;
      W.capsules = saved.caps; W.capsuleLinks = saved.links; W.exclusions = saved.exc;

      W.rackShouldRotate(aged, today, false),    // the cadence

  t("a rack built by an older derivation is rebuilt, not left sitting there", () => withRackCloset(() => {

  const withDressyOnlyShoes = (fn) => {

                    exclusions: W.exclusions, cap: W.activeCapsuleId, ready: W.dataReady,

      formality: dressy ? [5, 6] : [2, 3], season: ["Spring","Summer","Fall","Winter"] });
    W.items = []; W.wears = [];
    // enough everyday pieces elsewhere that only Shoes is under pressure
    for (const [cat, sub] of [["Tops","Tee shirts"],["Bottoms","Jeans"],["Dresses","Short"],["Outerwear","Jackets"]])

        const id = `${cat}_${n}`;

      W.items.push(mk(`Shoes_heel_${n}`, "Shoes", "Heels", true));
    W.outfits = []; W.outfitLinks = []; W.exclusions = [];
    W.activeCapsuleId = null; W.dataReady = true;
    W.kvData.delete("rack"); W.kvData.delete("dayplan");
    W.buildOutfitIndexes(); W.buildExcludeSet(); W.buildSuggestIndexes();
    try { return fn(); }
    finally {
      W.items = saved.items; W.wears = saved.wears; W.outfits = saved.outfits;
      W.outfitLinks = saved.outfitLinks; W.exclusions = saved.exclusions;
